<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trade View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080b0f;--panel:#12181f;--border:#232d3a;--text:#e7ecf2;--muted:#7c8a9c;--accent:#3b82f6;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;}
  /* fixed tab bar: never scrolls; only the view below it does */
  #tabs{position:fixed;top:0;left:0;right:0;height:48px;display:flex;gap:8px;align-items:center;padding:0 16px;
        background:var(--panel);border-bottom:1px solid var(--border);z-index:10;}
  #tabs button{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:8px;
               padding:7px 16px;font:600 13px 'Inter',sans-serif;cursor:pointer;}
  #tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* B-1358: system health pill on the shell, so EVERY view shows Render/Upstash/freeze/memory problems in red */
  #sys{margin-left:auto;min-width:0;max-width:60%;display:flex;align-items:center;gap:6px;font:600 12px 'Inter',sans-serif;
       color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--border);border-radius:8px;padding:6px 10px;}
  #sys span{overflow:hidden;text-overflow:ellipsis;}
  #sys i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--muted);}
  #sys.ok{color:#22c55e;} #sys.ok i{background:#22c55e;}
  #sys.bad{color:#fff;background:#b91c1c;border-color:#ef4444;} #sys.bad i{background:#fff;}
  #views{position:fixed;top:48px;left:0;right:0;bottom:0;}
  #views iframe{display:none;width:100%;height:100%;border:0;background:var(--bg);}
  #views iframe.on{display:block;}
</style>
</head>
<body>
<nav id="tabs">
  <button data-v="v1">View 1</button>
  <button data-v="v2">View 2</button>
  <button data-v="v3">View 3</button>
  <button data-v="v4">View 4 · Live</button>
  <div id="sys" title="System health"><i></i><span id="sysTxt">checking…</span></div>
</nav>
<div id="views">
  <iframe id="v1" title="View 1" data-src="/trade-view1"></iframe>
  <iframe id="v2" title="View 2" data-src="/trade-view2"></iframe>
  <iframe id="v3" title="View 3" data-src="/trade-view3"></iframe>
  <iframe id="v4" title="View 4" data-src="/trade-view4"></iframe>
</div>
<script>
  // Each view keeps its own page and 10s polling; a view loads on its first click, then stays loaded so switching is instant.
  function show(v) {
    if (!document.getElementById(v)) v = "v1";
    document.querySelectorAll("#views iframe").forEach(f => {
      const on = f.id === v;
      if (on && !f.src) f.src = f.dataset.src + location.search;
      f.classList.toggle("on", on);
    });
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
    if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
  }
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => show(b.dataset.v));
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1) || "v1");

  // B-1358: poll /health every 5 s; red with the cause when Render, Upstash, the event loop, memory or the order-log push fails.
  let downSince = null;
  const ist = ms => new Date(ms).toLocaleTimeString("en-IN", {timeZone: "Asia/Kolkata", hour12: false});
  function paint(probs, okTxt) {
    const el = document.getElementById("sys");
    el.className = probs.length ? "bad" : "ok";
    const t = probs.length ? "PROBLEM: " + probs.join(" · ") : okTxt;
    document.getElementById("sysTxt").textContent = t; el.title = t;
  }
  let busy = false;
  async function pollHealth() {
    if (busy) return;  // B-1359: never stack /health calls
    busy = true;
    let h;
    try {
      const r = await fetch("/health", {cache: "no-store", signal: AbortSignal.timeout(15000)});
      if (!r.ok) throw new Error("HTTP " + r.status);
      h = await r.json(); downSince = null;
    } catch (e) {
      busy = false;
      downSince = downSince || Date.now();
      return paint([`Render unreachable since ${ist(downSince)} IST (${e.message || "no answer"}) - views show frozen data`]);
    }
    busy = false;
    const probs = [];
    if (h.upstash_ok === false) probs.push(`Upstash down: ${h.upstash_error || "error"}`);
    if (h.loop_lag_s >= 15) probs.push(`bot frozen ${Math.round(h.loop_lag_s)}s`);
    if (h.rss_pct >= 75) probs.push(`memory ${h.rss_pct}%`);
    if (h.threadpool_total && h.threadpool_used >= h.threadpool_total) probs.push(`bot busy: all ${h.threadpool_total} workers stuck, pages hang`);
    if (h.order_log_git_push_age_s > 600) probs.push(`order log not in git for ${Math.round(h.order_log_git_push_age_s / 60)}m`);
    paint(probs, `System OK · Render up · Upstash ${h.upstash_ok == null ? "not checked yet" : "ok"} · mem ${h.rss_pct ?? "-"}%`);
  }
  pollHealth(); setInterval(pollHealth, 5000);
</script>
</body>
</html>

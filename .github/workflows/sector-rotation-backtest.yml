name: Sector rotation backtest (B-336, daily, both directions)
on:
  workflow_dispatch:
    inputs:
      script:
        description: script to run
        default: scripts/sector_rotation_backtest.py
      tf:
        description: candle size (1d, 1h, 4h, 15m, 5m)
        default: 1d
      fade:
        description: "1 = breadth-reversal fade variant"
        default: "0"
      results:
        description: results file to commit
        default: docs/sector_rotation_results.json
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/confident-fermi-mlqbka
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt yfinance
      - run: FADE=${{ inputs.fade || '0' }} TF=${{ inputs.tf || '1d' }} python ${{ inputs.script || 'scripts/sector_rotation_backtest.py' }}
      - name: Commit results
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add ${{ inputs.results || 'docs/sector_rotation_results.json' }}
          git commit -m "Backtest results ${{ inputs.results || 'sector' }}" || exit 0
          git pull --rebase origin claude/confident-fermi-mlqbka && git push origin HEAD:claude/confident-fermi-mlqbka

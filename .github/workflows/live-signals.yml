name: Live Intraday Signals (paper trading)

# Runs entirely on GitHub's infrastructure - independent of any laptop/device
# being online. Polls /auto-signal every 15 min during NSE/BSE cash hours
# (9:15-15:30 IST = 3:45-10:00 UTC) on weekdays, for each symbol below.
# Also runnable on demand via workflow_dispatch.
on:
  schedule:
    # UTC 3:00-10:55 = IST 8:30-16:25, every 5 min, Mon-Fri. Matches the
    # engine's own data resolution (5-min candles) - polling faster than the
    # underlying bar interval wouldn't see anything new. Covers the full
    # 9:15-15:30 IST session with a buffer either side; calls outside actual
    # market hours are harmless no-ops (the endpoint itself checks the time).
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Poll auto-signal for each symbol
        # orb_minutes/sma_fast/sma_slow below are per-symbol, chosen by
        # backtesting orb_breakout against 60 days of real 5-min data
        # (entry-trigger-research.yml, run 2026-09-02) - not the same
        # one-size-fits-all defaults for every symbol. See
        # docs/daily_logs/2026-09-02-entry-trigger-research.md for the
        # comparison against orb_volume/vwap_reclaim/macd_cross and the
        # full sweep grid each of these was picked from.
        run: |
          BASE="https://tv-paper-bot-gdan.onrender.com/auto-signal"
          RISK="capital=400000&daily_risk_pct=2&risk_per_trade_pct=2&stop_pct=2&rr=3"

          curl -sS -m 30 "https://tv-paper-bot-gdan.onrender.com/health" || true
          echo

          echo "### NIFTY (^NSEI)"
          curl -sS -m 60 "$BASE?symbol=%5ENSEI&${RISK}&orb_minutes=30&sma_fast=5&sma_slow=50"
          echo

          echo "### BANKNIFTY (^NSEBANK)"
          curl -sS -m 60 "$BASE?symbol=%5ENSEBANK&${RISK}&orb_minutes=5&sma_fast=9&sma_slow=50"
          echo

          echo "### SENSEX (^BSESN)"
          curl -sS -m 60 "$BASE?symbol=%5EBSESN&${RISK}&orb_minutes=30&sma_fast=20&sma_slow=50"
          echo

          # NSE stock universe expanded 2026-09-03 to the Nifty 100 (Nifty
          # 50 + Nifty Next 50 - NSE's own published index constituent
          # lists) per explicit user pushback on the earlier hand-picked
          # 15-name list - see main.py's NSE_STOCK_UNIVERSE comment for the
          # full reasoning. Unproven -> half ceiling (1%), same
          # orb_breakout defaults as main.py's WATCHLIST entries - must
          # stay in sync with it (same symbol list, same params) or this
          # backstop would fight the in-process scheduler for the same
          # symbol. Symbol is URL-encoded (handles "M&M.NS" correctly,
          # a literal & would otherwise be parsed as a query delimiter).
          STOCK_RISK="capital=400000&daily_risk_pct=2&risk_per_trade_pct=1&stop_pct=1&rr=3&orb_minutes=15&sma_fast=9&sma_slow=21"
          NSE_STOCKS="RELIANCE.NS TCS.NS HDFCBANK.NS INFY.NS ICICIBANK.NS HINDUNILVR.NS ITC.NS SBIN.NS BHARTIARTL.NS KOTAKBANK.NS LT.NS AXISBANK.NS BAJFINANCE.NS MARUTI.NS ASIANPAINT.NS HCLTECH.NS SUNPHARMA.NS TITAN.NS ULTRACEMCO.NS WIPRO.NS NESTLEIND.NS BAJAJFINSV.NS POWERGRID.NS NTPC.NS TATAMOTORS.NS TATASTEEL.NS M&M.NS INDUSINDBK.NS JSWSTEEL.NS ADANIENT.NS ADANIPORTS.NS COALINDIA.NS GRASIM.NS HINDALCO.NS CIPLA.NS DRREDDY.NS EICHERMOT.NS TECHM.NS BRITANNIA.NS DIVISLAB.NS APOLLOHOSP.NS BAJAJ-AUTO.NS TATACONSUM.NS SBILIFE.NS HDFCLIFE.NS LTIM.NS SHRIRAMFIN.NS TRENT.NS HEROMOTOCO.NS UPL.NS ADANIGREEN.NS ADANIPOWER.NS AMBUJACEM.NS DMART.NS BANKBARODA.NS BOSCHLTD.NS CANBK.NS CHOLAFIN.NS DABUR.NS DLF.NS GODREJCP.NS HAVELLS.NS HAL.NS HINDPETRO.NS ICICIGI.NS ICICIPRULI.NS INDIGO.NS IOC.NS IRFC.NS JINDALSTEL.NS JIOFIN.NS LICI.NS MARICO.NS MOTHERSON.NS MUTHOOTFIN.NS NHPC.NS ONGC.NS PIDILITIND.NS PNB.NS PFC.NS RECLTD.NS SIEMENS.NS SRF.NS TATAPOWER.NS TORNTPHARM.NS UNIONBANK.NS MCDOWELL-N.NS VEDL.NS ZOMATO.NS ZYDUSLIFE.NS BEL.NS BPCL.NS GAIL.NS NAUKRI.NS LUPIN.NS POLYCAB.NS UBL.NS"
          for SYMBOL in $NSE_STOCKS; do
            ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$SYMBOL")
            echo "### $SYMBOL"
            curl -sS -m 60 "$BASE?symbol=${ENC}&${STOCK_RISK}"
            echo
          done

          echo "### daily-summary"
          curl -sS -m 30 "https://tv-paper-bot-gdan.onrender.com/daily-summary?capital=400000&daily_risk_pct=2"
          echo

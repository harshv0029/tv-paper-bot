name: Refresh NSE Universe (full equity list)

# Fetches the real, exhaustive NSE EQ-series equity list and writes it to
# docs/nse_universe.json - main.py loads this file at import time to build
# WATCHLIST's stock section (see _load_nse_universe_from_file() in
# main.py), falling back to its own small hardcoded Nifty 100 list if the
# file is missing/unreadable/too small, so a fetch failure here never
# takes the live app down.
#
# Source: Kotak Neo's own scrip master (kotak_neo.py:scrip_master(), via
# the live server's GET /kotak-neo/nse-universe), NOT NSE's own site.
# NSE's archive endpoints (EQUITY_L.csv) sit behind Akamai bot protection
# that edge-blocks GitHub Actions' datacenter IPs outright - confirmed
# blocked on multiple dispatches 2026-09-03, still true 2026-09-05, a
# network-level block that isn't fixable from curl in CI. Explicit user
# instruction (2026-09-05): "cant you source it from kotak neo. all the
# tickers which it can provide" - Kotak's scrip-master host is a
# different domain entirely and sidesteps the block. This filters to
# pGroup=="EQ" (confirmed against real RELIANCE/RELINFRA/RHFL rows to be
# exactly NSE's main-board equity series, same filter EQUITY_L.csv's own
# SERIES=EQ would have applied) - see /kotak-neo/nse-universe in main.py
# for the real filtering logic; this workflow just calls that endpoint
# and commits its output.
#
# Broader than Nifty 500 index membership, not narrower: Kotak's scrip
# master carries no index-membership column, so this is every EQ-series
# NSE stock (~2,600, ETFs included), not a curated 500.
on:
  schedule:
    # Every Monday 03:00 UTC = 08:30 IST, well before NSE's 09:15 open -
    # explicit user instruction ("setup a weekly update of list from
    # market data and sync to my db to keep this updated. every monday").
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the real NSE EQ universe from the live server (Kotak-sourced)
        env:
          KOTAK_NEO_API_TOKEN: ${{ secrets.KOTAK_NEO_API_TOKEN }}
        run: |
          mkdir -p docs
          # Render free tier can be cold - wake it first (same pattern as
          # journal-sync.yml), then retry the real fetch with backoff.
          curl -sS -m 60 "https://tv-paper-bot-gdan.onrender.com/health" || true
          echo
          curl -sS --retry 3 --retry-delay 10 --retry-connrefused -m 60 \
            "https://tv-paper-bot-gdan.onrender.com/kotak-neo/nse-universe?token=${KOTAK_NEO_API_TOKEN}" \
            -o /tmp/nse-universe.json

          COUNT=$(jq -r '.count // 0' /tmp/nse-universe.json)
          ERR=$(jq -r '.error // empty' /tmp/nse-universe.json)
          if [[ -n "$ERR" ]]; then
            echo "::error::/kotak-neo/nse-universe returned an error: $ERR"
            exit 1
          fi
          # Same "refuse a suspiciously small universe" floor as the
          # endpoint itself (main.py checks < 500) - belt and suspenders
          # against ever committing a corrupt/truncated list.
          if [[ "$COUNT" -lt 500 ]]; then
            echo "::error::Only $COUNT symbols returned - refusing to commit, looks wrong"
            exit 1
          fi
          echo "Fetched $COUNT real EQ-series symbols from Kotak's scrip master"

          jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source, series, count, fetched_at_utc: $ts, symbols}' \
            /tmp/nse-universe.json > docs/nse_universe.json

      - name: Commit and push if the universe changed
        run: |
          git config user.name "tv-paper-bot NSE universe refresh"
          git config user.email "actions@users.noreply.github.com"
          git add docs/nse_universe.json
          if git diff --cached --quiet; then
            echo "No change in NSE universe - nothing to commit"
          else
            COUNT=$(jq -r '.count' docs/nse_universe.json)
            git commit -m "Weekly refresh: NSE EQ universe from Kotak scrip master ($COUNT symbols)"
            git push
          fi

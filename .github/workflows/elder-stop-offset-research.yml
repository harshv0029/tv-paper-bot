name: Elder stop-offset and round-number research (B-606)

# Structural stop beyond the 10-bar swing (offset 0.25/0.5/0.75/1.0 ATR, clamped to the ATR multiple)
# and round-number snap vs just-beyond vs raw ATR stop, on two identical base entries (EMA13 dip,
# 20-bar breakout). 2 families x 4 shards = 8 jobs + merge. FULL universe via
# main._load_nse_universe_from_file(), BOTH directions, ATR 1.5/2/3, stop on every trade, 0.8%
# round trip. Candle sweep: re-dispatch with interval=1h / 15m / 5m (4h owed). Research only.
# Dispatch only when no Deploy Gate / safety run is queued.
on:
  workflow_dispatch:
    inputs:
      interval:
        description: "Candle size (1d, 1h, 15m, 5m)"
        required: false
        default: "1d"
      period:
        description: "yfinance period (1d: 5y; 1h: 730d; 15m/5m: 60d)"
        required: false
        default: "5y"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        family: [offset, round]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Run family shard
        run: |
          set -o pipefail
          python3 scripts/elder_stop_offset_research.py \
            --family "${{ matrix.family }}" --shard ${{ matrix.shard }} --nshards 4 \
            --interval "${{ inputs.interval }}" --period "${{ inputs.period }}" --out out/
      - uses: actions/upload-artifact@v4
        with:
          name: stopoff-${{ matrix.family }}-${{ matrix.shard }}
          path: out/

  merge:
    needs: research
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: stopoff-*
          merge-multiple: true
      - name: Merge shards and print per-tag table
        run: |
          set -o pipefail
          python3 scripts/elder_stop_offset_research.py --merge shards --json stopoff_results.json | tee stopoff_table.txt
      - uses: actions/upload-artifact@v4
        with:
          name: elder-stop-offset-results
          path: |
            stopoff_results.json
            stopoff_table.txt

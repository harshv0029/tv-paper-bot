name: Elder Directional System DI13 remainder (B-588)

# B-588 remainder: Elder/Wilder DI period 13 (the earlier dirsys run used 14), period sweep 8/13/21,
# Wilder vs EMA smoothing, fixed vs trailing stop, bad-bar guard, 30% out-of-sample split,
# candle sweep. Per run: 4 variants x 4 (n,smoothing) sets x 2 directions x 2 stops x 3 ATR = 192
# tags. FULL universe via main._load_nse_universe_from_file(), 8 shards (one job each).
# Dispatch ORDER (one candle size per dispatch; each is a separate 8-job run, keep one running +
# one queued): 1d, 1h, 15m, 5m, 4h, 1m. Dispatch only when no Deploy Gate / safety run is queued.
# 4h is built from 1h bars (09:15-anchored); 1m only has 7 days of history (thin, flag as such).
# Bar-count constants (30-bar max hold, indicator windows) change meaning with the interval.
# Research only: no live wiring. A new workflow file cannot be dispatched until it is on main.
on:
  workflow_dispatch:
    inputs:
      interval:
        description: "Candle size (1d, 4h, 1h, 15m, 5m, 1m)"
        required: false
        default: "1d"
      period:
        description: "yfinance period override (blank = default: 1d 5y, 4h/1h 730d, 15m/5m 60d, 1m 7d)"
        required: false
        default: ""

jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Run shard
        run: |
          python3 scripts/elder_dirsys_di13_research.py \
            --shard ${{ matrix.shard }} --nshards 8 \
            --interval "${{ inputs.interval }}" --period "${{ inputs.period }}" --out out/
      - uses: actions/upload-artifact@v4
        with:
          name: dirsys13-${{ matrix.shard }}
          path: out/

  merge:
    needs: research
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: dirsys13-*
          merge-multiple: true
      - name: Merge shards and print per-tag table
        run: |
          set -o pipefail
          python3 scripts/elder_dirsys_di13_research.py --merge shards --json dirsys13_results.json | tee dirsys13_table.txt
      - uses: actions/upload-artifact@v4
        with:
          name: elder-dirsys13-results-${{ inputs.interval }}
          path: |
            dirsys13_results.json
            dirsys13_table.txt

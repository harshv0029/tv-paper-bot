name: Collect artifacts of a finished run (print JSON/TSV to the log)

# Read-only helper: downloads the artifacts of another workflow run (by id)
# and prints their text contents so results can be read from the job log when
# the original aggregate step failed or the sandbox cannot fetch blob URLs.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id whose artifacts to print"
        required: true
      pattern:
        description: "Artifact name glob"
        required: false
        default: "*"

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: ${{ inputs.pattern }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Print
        run: |
          python3 - <<'PYEOF'
          import glob, json, os
          for f in sorted(glob.glob("out/**/*", recursive=True)):
              if not os.path.isfile(f):
                  continue
              print("=== " + f)
              txt = open(f, errors="replace").read()
              try:
                  txt = json.dumps(json.loads(txt), separators=(",", ":"))
              except Exception:
                  pass
              print(txt[:20000])
          PYEOF

name: Collect artifacts of a finished run (commit raw files to branch data/run-artifacts)

# Helper: downloads the artifacts of another workflow run (by id) and commits the raw
# files, untouched, to the branch data/run-artifacts under run-<id>/ so a session can
# `git fetch origin data/run-artifacts` instead of reading huge job logs (the sandbox
# cannot reach blob URLs).  Set print=true to also dump contents to the log (small runs).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id whose artifacts to collect"
        required: true
      pattern:
        description: "Artifact name glob"
        required: false
        default: "*"
      print:
        description: "Also print contents to the job log (true/false)"
        required: false
        default: "false"

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: ${{ inputs.pattern }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit raw files to data/run-artifacts
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin data/run-artifacts >/dev/null 2>&1; then
            git fetch origin data/run-artifacts --depth=1
            git checkout -B data/run-artifacts FETCH_HEAD
          else
            git checkout --orphan data/run-artifacts
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "run-${{ inputs.run_id }}"
          cp -r out/. "run-${{ inputs.run_id }}/"
          git add "run-${{ inputs.run_id }}"
          git commit -m "artifacts of run ${{ inputs.run_id }} (${{ inputs.pattern }})" || echo "nothing new"
          git push origin data/run-artifacts
      - name: Print (optional)
        if: ${{ inputs.print == 'true' }}
        run: |
          python3 - <<'PYEOF'
          import glob, json, os
          for f in sorted(glob.glob("out/**/*", recursive=True)):
              if not os.path.isfile(f):
                  continue
              print("=== " + f, os.path.getsize(f))
              txt = open(f, errors="replace").read()
              try:
                  txt = json.dumps(json.loads(txt), separators=(",", ":"))
              except Exception:
                  pass
              print(txt[:60000])
          PYEOF

name: F&O Options Black-Scholes Approximation Backtest, All 8 Swing Families (research)

# ============================================================================
# EXPLORATORY RESEARCH - READ THIS BEFORE TRUSTING ANY NUMBER BELOW.
#
# THIS IS SYNTHETIC OPTIONS PRICING, NOT REAL MARKET DATA. NSE single-stock
# option premiums (real bid/ask, real implied vol smiles/skew, real open
# interest/liquidity) are not available via yfinance or anywhere in this
# repo's data plumbing. Every option premium in this workflow is COMPUTED
# from the Black-Scholes formula using the underlying's real historical
# closing price, an approximate constant risk-free rate (6.5%), and a
# 20-day trailing REALIZED volatility of the underlying as a stand-in for
# implied vol - real options nearly always trade at an IV that differs
# from trailing realized vol (often materially, especially around
# earnings/events), so premiums here can be systematically over- or
# under-priced relative to what a real NSE option chain would have shown.
# This must be disclosed everywhere this workflow's numbers are used, not
# just here: it is weaker evidence than the cash-equity backtests these
# signals are derived from, and weaker again than the futures-approximation
# pass in the companion workflow (which at least tracks a real cash price
# point-for-point).
#
# Signal logic itself is UNCHANGED: all 8 strategy families below
# (Supertrend 3.0x flip, MACD crossover, Donchian 55-day breakout,
# Fibonacci wide-trail, RSI(2) mean reversion, Bollinger Band squeeze
# breakout, Golden Cross 50/200 SMA, Gap-and-Go 5y) reuse the EXACT
# validated entry/exit signal math from their source
# .github/workflows/swing-*-research.yml files, byte-for-byte - the
# strategy still enters/exits on the underlying's own signal; only the
# instrument traded (a long ATM call instead of the underlying share) and
# its P&L are different.
#
# Options mechanics modeled:
#   - LONG ATM call only, per strategy's LONG entry signal (no puts, no
#     spreads - a direct translation of "buy the same signal via calls").
#   - Strike = nearest round number to the entry-day close (see
#     round_strike() below for the disclosed rounding-interval table -
#     an approximation of real NSE strike spacing, not the exact
#     per-symbol strike ladder).
#   - TWO separate expiry variants, run independently: WEEKLY (next
#     Thursday from entry) and MONTHLY (last Thursday of the entry's
#     month, or next month's if already past). Real NSE weekly options
#     exist only on a handful of index/liquid names - for single-stock
#     names, weekly is itself an approximation of "if this stock had
#     weekly options."
#   - Priced via closed-form Black-Scholes (S=underlying close,
#     K=ATM strike, r=6.5%, sigma=20-day trailing annualized realized
#     vol, T=time to the assigned expiry in years). Verified against the
#     textbook example S=100,K=100,T=0.25,r=0.05,sigma=0.2 -> call~=4.61
#     in a standalone scratch check before this workflow was written.
#   - Daily revaluation is implicit, not printed bar-by-bar: because the
#     underlying's own exit index (equity_exit_idx) already tells us
#     exactly which day the position closes (signal exit, the strategy's
#     own price-based stop, or max-hold - all already resolved by the
#     UNCHANGED signal logic), the option's entry and exit premiums are
#     each computed via full daily-fresh S(t)/T(t)/sigma(t) at those two
#     dates - which correctly captures theta decay, spot movement, and
#     vol drift between entry and exit without needing a third state to
#     track (there is no path-dependent decision between entry and exit
#     that additional daily prints would change).
#   - Exit: (a) the underlying's own exit signal/stop fires before
#     expiry -> option sold at that day's BS premium; (b) option expiry
#     is reached first -> settled at intrinsic value only (max(S-K,0)),
#     regardless of what the underlying signal does afterward - a real
#     option does not ride past its own expiry, so an entry is NOT
#     rolled into a fresh weekly/monthly contract chain here (disclosed
#     simplification - a real trader wanting to stay in the underlying's
#     move past one expiry would need to explicitly roll, not modeled).
#
# DISCLOSED cost model (approximate, NOT the exact current NSE F&O
# tariff): brokerage Rs20 flat per order (both legs, approximating
# "0.03% or Rs20 whichever lower"), STT 0.1% on SELL-side premium only
# (options STT is sell-side, unlike equity's both-side buy+sell), exchange
# txn ~0.05% of premium, GST 18% on brokerage+exchange, no stamp duty.
# NOT modeled: the well-known NSE "exercised ITM option" STT trap, where
# physically/cash-settling an in-the-money option at expiry can attract
# STT on the full INTRINSIC value at a materially higher effective rate
# than this model's flat sell-side-premium STT assumes - a real limitation
# of this cost model for the "expiry_settlement" exit bucket specifically,
# disclosed here rather than silently baked in.
#
# Position sizing: long-option risk translation of this project's
# standing risk_pct formula - since a long call's max loss is the premium
# paid, lots are sized so total premium outlay approximates
# usable_capital * risk_pct/100 (same risk_amount as every equity/futures
# backtest), capped by total capital, then floored to whole lots (same
# disclosed lot-size approximation as the companion futures workflow -
# NOT real per-symbol NSE lot sizes).
#
# Universe: same 52-symbol universe as every equity/futures backtest this
# session. DISCLOSURE: single-stock options in real NSE F&O are listed on
# only a subset of these 52 symbols (many are cash-only) - this pass
# treats the whole universe as "if these were all optionable," not a
# claim all 52 have real listed options.
#
# Does not touch main.py or any live trading code. Read-only: no live
# parameter changed, nothing wired into main.py, no workflow dispatched
# by this session.
# ============================================================================

on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Sanity-check Black-Scholes formula against textbook example
        run: |
          python3 - <<'PYEOF'
          import math
          def _n(x): return 0.5 * (1.0 + math.erf(x / math.sqrt(2.0)))
          def bs_call(S, K, T, r, sigma):
              d1 = (math.log(S / K) + (r + 0.5 * sigma * sigma) * T) / (sigma * math.sqrt(T))
              d2 = d1 - sigma * math.sqrt(T)
              return S * _n(d1) - K * math.exp(-r * T) * _n(d2)
          price = bs_call(100, 100, 0.25, 0.05, 0.2)
          print(f"BS textbook check (S=100,K=100,T=0.25,r=0.05,sigma=0.2): {price:.4f} (expect ~4.615)")
          assert abs(price - 4.615) < 0.02, "Black-Scholes formula check FAILED - aborting workflow"
          print("Black-Scholes formula check PASSED")
          PYEOF
      - name: Run F&O options Black-Scholes backtest (all 8 strategy families x weekly/monthly)
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import json
          import math
          import calendar
          from datetime import date, timedelta
          import numpy as np
          import pandas as pd
          import main as m

          # =====================================================================
          # Strategy signal-detection functions - copied UNCHANGED (entry/exit
          # math byte-for-byte identical) from their validated
          # .github/workflows/swing-*-research.yml sources. Only the
          # trade-recording tail is stripped to raw signal facts (entry/exit
          # index, price, initial stop, exit reason) - the option
          # pricing/sizing/cost/P&L happens downstream, once, in the BS
          # evaluator.
          # =====================================================================

          def _atr(highs, lows, closes, n, method="rolling"):
              prev_close = np.concatenate(([np.nan], closes[:-1]))
              tr = np.maximum(highs - lows, np.maximum(np.abs(highs - prev_close), np.abs(lows - prev_close)))
              if method == "ewm":
                  return pd.Series(tr).ewm(alpha=1.0 / n, adjust=False).mean().to_numpy()
              return pd.Series(tr).rolling(n).mean().to_numpy()


          def _rsi(closes, n):
              delta = np.diff(closes, prepend=closes[0])
              gain = np.where(delta > 0, delta, 0.0)
              loss = np.where(delta < 0, -delta, 0.0)
              avg_gain = pd.Series(gain).ewm(alpha=1.0 / n, adjust=False).mean().to_numpy()
              avg_loss = pd.Series(loss).ewm(alpha=1.0 / n, adjust=False).mean().to_numpy()
              with np.errstate(invalid="ignore", divide="ignore"):
                  rs = avg_gain / avg_loss
                  rsi = 100.0 - 100.0 / (1.0 + rs)
              rsi = np.where(avg_loss == 0, 100.0, rsi)
              return rsi


          def _bollinger(closes, period, num_std):
              s = pd.Series(closes)
              sma = s.rolling(period).mean().to_numpy()
              std = s.rolling(period).std(ddof=0).to_numpy()
              return sma, sma + num_std * std, sma - num_std * std


          def _squeeze_flags(bandwidth, lookback, percentile):
              n = len(bandwidth)
              is_squeeze = np.full(n, False)
              for i in range(n):
                  if np.isnan(bandwidth[i]):
                      continue
                  window = bandwidth[max(0, i - lookback + 1): i + 1]
                  if np.all(np.isnan(window)):
                      continue
                  if bandwidth[i] <= np.nanpercentile(window, percentile):
                      is_squeeze[i] = True
              return is_squeeze


          def _supertrend(highs, lows, closes, atr_n, mult):
              n = len(closes)
              atr = _atr(highs, lows, closes, atr_n, method="ewm")
              hl2 = (highs + lows) / 2.0
              basic_upper = hl2 + mult * atr
              basic_lower = hl2 - mult * atr
              final_upper = np.full(n, np.nan)
              final_lower = np.full(n, np.nan)
              direction = np.zeros(n, dtype=int)
              st = np.full(n, np.nan)
              for i in range(n):
                  reset = i == 0 or np.isnan(atr[i]) or np.isnan(final_lower[i - 1]) or np.isnan(final_upper[i - 1])
                  if reset:
                      final_upper[i] = basic_upper[i]
                      final_lower[i] = basic_lower[i]
                      direction[i] = 1
                      st[i] = final_lower[i] if not np.isnan(final_lower[i]) else np.nan
                      continue
                  final_upper[i] = (basic_upper[i] if (basic_upper[i] < final_upper[i - 1] or closes[i - 1] > final_upper[i - 1])
                                     else final_upper[i - 1])
                  final_lower[i] = (basic_lower[i] if (basic_lower[i] > final_lower[i - 1] or closes[i - 1] < final_lower[i - 1])
                                     else final_lower[i - 1])
                  if direction[i - 1] == 1:
                      direction[i] = -1 if closes[i] < final_lower[i] else 1
                  else:
                      direction[i] = 1 if closes[i] > final_upper[i] else -1
                  st[i] = final_lower[i] if direction[i] == 1 else final_upper[i]
              return st, direction, atr


          def _macd(closes, fast, slow, signal):
              s = pd.Series(closes)
              ema_fast = s.ewm(span=fast, adjust=False).mean()
              ema_slow = s.ewm(span=slow, adjust=False).mean()
              macd_line = (ema_fast - ema_slow).to_numpy()
              signal_line = pd.Series(macd_line).ewm(span=signal, adjust=False).mean().to_numpy()
              return macd_line, signal_line


          def _rec(symbol, entry_idx, entry_date, entry_price, initial_stop, exit_idx, exit_date, exit_price, exit_reason):
              return dict(symbol=symbol, entry_idx=entry_idx, entry_date=entry_date, entry_price=entry_price,
                          initial_stop=initial_stop, exit_idx=exit_idx, exit_date=exit_date, exit_price=exit_price,
                          exit_reason=exit_reason, held_days=exit_idx - entry_idx)


          def replay_supertrend(symbol, df):
              TREND_SMA_N, ST_ATR_N, ST_MULT, MAX_HOLD_DAYS = 200, 10, 3.0, 60
              df = df.reset_index(drop=True)
              n = len(df)
              min_lookback = max(TREND_SMA_N, ST_ATR_N) + 5
              if n < min_lookback + 5:
                  return []
              closes = df["Close"].to_numpy(dtype=float)
              highs = df["High"].to_numpy(dtype=float)
              lows = df["Low"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()
              sma_trend = pd.Series(closes).rolling(TREND_SMA_N).mean().to_numpy()
              st, direction, atr = _supertrend(highs, lows, closes, ST_ATR_N, ST_MULT)
              trades, position = [], None
              for i in range(n):
                  if position is not None:
                      held_days = i - position["entry_idx"]
                      exit_reason = None
                      if direction[i] == -1 and direction[i - 1] == 1:
                          exit_reason = "supertrend_flip_bearish"
                      elif held_days >= MAX_HOLD_DAYS:
                          exit_reason = "max_hold_timeout"
                      if exit_reason:
                          trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                              position["initial_stop"], i, dates[i], closes[i], exit_reason))
                          position = None
                      continue
                  if i < min_lookback or i == 0:
                      continue
                  if np.isnan(atr[i]) or atr[i] <= 0 or np.isnan(sma_trend[i]) or np.isnan(st[i]):
                      continue
                  flipped_bullish = direction[i] == 1 and direction[i - 1] == -1
                  if not flipped_bullish or closes[i] <= sma_trend[i]:
                      continue
                  if closes[i] - st[i] <= 0:
                      continue
                  position = dict(entry_idx=i, entry_date=dates[i], entry_price=closes[i], initial_stop=st[i])
              if position is not None:
                  trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                      position["initial_stop"], n - 1, dates[-1], closes[-1], "data_end_forced_close"))
              return trades


          def replay_macd(symbol, df):
              TREND_EMA_N, MACD_FAST, MACD_SLOW, MACD_SIGNAL = 50, 12, 26, 9
              ATR_N, ATR_STOP_MULT, MAX_HOLD_DAYS = 14, 2.5, 60
              df = df.reset_index(drop=True)
              n = len(df)
              min_lookback = max(TREND_EMA_N, MACD_SLOW + MACD_SIGNAL, ATR_N) + 5
              if n < min_lookback + 5:
                  return []
              closes = df["Close"].to_numpy(dtype=float)
              highs = df["High"].to_numpy(dtype=float)
              lows = df["Low"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()
              atr = _atr(highs, lows, closes, ATR_N)
              ema_trend = pd.Series(closes).ewm(span=TREND_EMA_N, adjust=False).mean().to_numpy()
              macd_line, signal_line = _macd(closes, MACD_FAST, MACD_SLOW, MACD_SIGNAL)
              trades, position = [], None
              for i in range(n):
                  if position is not None:
                      held_days = i - position["entry_idx"]
                      exit_reason = None
                      if closes[i] <= position["stop"]:
                          exit_reason = "stop_hit"
                      elif macd_line[i] < signal_line[i] and macd_line[i - 1] >= signal_line[i - 1]:
                          exit_reason = "macd_bearish_cross"
                      elif held_days >= MAX_HOLD_DAYS:
                          exit_reason = "max_hold_timeout"
                      if exit_reason:
                          trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                              position["initial_stop"], i, dates[i], closes[i], exit_reason))
                          position = None
                      continue
                  if i < min_lookback or i == 0:
                      continue
                  if np.isnan(atr[i]) or atr[i] <= 0 or np.isnan(ema_trend[i]):
                      continue
                  bullish_cross = macd_line[i] > signal_line[i] and macd_line[i - 1] <= signal_line[i - 1]
                  if not bullish_cross or closes[i] <= ema_trend[i]:
                      continue
                  stop_loss = closes[i] - ATR_STOP_MULT * atr[i]
                  if closes[i] - stop_loss <= 0:
                      continue
                  position = dict(entry_idx=i, entry_date=dates[i], entry_price=closes[i], initial_stop=stop_loss, stop=stop_loss)
              if position is not None:
                  trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                      position["initial_stop"], n - 1, dates[-1], closes[-1], "data_end_forced_close"))
              return trades


          def replay_donchian55(symbol, df):
              DONCHIAN_N, TREND_RISING_LOOKBACK, TREND_SMA_N = 55, 20, 50
              ATR_N, VOL_LOOKBACK, VOL_SURGE_MULT, ATR_STOP_MULT, MAX_HOLD_DAYS, STRUCT_LOW_N = 14, 20, 1.5, 2.0, 60, 10
              df = df.reset_index(drop=True)
              n = len(df)
              if n < max(DONCHIAN_N, TREND_SMA_N, ATR_N, VOL_LOOKBACK) + 5:
                  return []
              closes = df["Close"].to_numpy(dtype=float)
              highs = df["High"].to_numpy(dtype=float)
              lows = df["Low"].to_numpy(dtype=float)
              vol = df["Volume"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()
              atr = _atr(highs, lows, closes, ATR_N)
              sma_trend = pd.Series(closes).rolling(TREND_SMA_N).mean().to_numpy()
              min_lookback = max(DONCHIAN_N, TREND_SMA_N + TREND_RISING_LOOKBACK, ATR_N, VOL_LOOKBACK, STRUCT_LOW_N) + 1
              trades, position = [], None
              for i in range(n):
                  if position is not None:
                      position["running_max_close"] = max(position["running_max_close"], closes[i])
                      trail_stop = position["running_max_close"] - position["atr_at_entry"] * ATR_STOP_MULT
                      if trail_stop > position["stop"]:
                          position["stop"] = trail_stop
                      held_days = i - position["entry_idx"]
                      exit_reason = None
                      if closes[i] <= position["stop"]:
                          exit_reason = "trail_stop_hit"
                      elif held_days >= MAX_HOLD_DAYS:
                          exit_reason = "max_hold_timeout"
                      if exit_reason:
                          trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                              position["initial_stop"], i, dates[i], closes[i], exit_reason))
                          position = None
                      continue
                  if i < min_lookback:
                      continue
                  if np.isnan(atr[i]) or atr[i] <= 0 or np.isnan(sma_trend[i]) or np.isnan(sma_trend[i - TREND_RISING_LOOKBACK]):
                      continue
                  donchian_high = float(np.max(highs[i - DONCHIAN_N:i]))
                  if closes[i] <= donchian_high:
                      continue
                  trend_ok = closes[i] > sma_trend[i] and sma_trend[i] > sma_trend[i - TREND_RISING_LOOKBACK]
                  if not trend_ok:
                      continue
                  avg_vol = float(np.mean(vol[i - VOL_LOOKBACK:i]))
                  if avg_vol <= 0 or vol[i] < VOL_SURGE_MULT * avg_vol:
                      continue
                  struct_low = float(np.min(lows[i - STRUCT_LOW_N:i]))
                  atr_stop = closes[i] - ATR_STOP_MULT * atr[i]
                  stop_loss = max(struct_low, atr_stop)
                  if closes[i] - stop_loss <= 0:
                      continue
                  position = dict(entry_idx=i, entry_date=dates[i], entry_price=closes[i], initial_stop=stop_loss,
                                   stop=stop_loss, atr_at_entry=float(atr[i]), running_max_close=closes[i])
              if position is not None:
                  trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                      position["initial_stop"], n - 1, dates[-1], closes[-1], "data_end_forced_close"))
              return trades


          def replay_fib_wide_trail(symbol, df):
              SWING_LOOKBACK, MIN_SWING_PCT = 40, 3.0
              FIB_618, FIB_382, FIB_786 = 0.618, 0.382, 0.786
              TREND_SMA_N, TREND_RISING_LOOKBACK, ATR_N, VOL_LOOKBACK = 50, 20, 14, 20
              ATR_STOP_MULT, MAX_HOLD_DAYS = 3.0, 60
              df = df.reset_index(drop=True)
              n = len(df)
              min_lookback = max(SWING_LOOKBACK, TREND_SMA_N + TREND_RISING_LOOKBACK, ATR_N, VOL_LOOKBACK) + 1
              if n < min_lookback + 5:
                  return []
              closes = df["Close"].to_numpy(dtype=float)
              opens = df["Open"].to_numpy(dtype=float)
              highs = df["High"].to_numpy(dtype=float)
              lows = df["Low"].to_numpy(dtype=float)
              vol = df["Volume"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()
              atr = _atr(highs, lows, closes, ATR_N)
              sma_trend = pd.Series(closes).rolling(TREND_SMA_N).mean().to_numpy()
              trades, position = [], None
              for i in range(n):
                  if position is not None:
                      position["running_max_close"] = max(position["running_max_close"], closes[i])
                      trail_stop = position["running_max_close"] - position["atr_at_entry"] * ATR_STOP_MULT
                      if trail_stop > position["stop"]:
                          position["stop"] = trail_stop
                      held_days = i - position["entry_idx"]
                      exit_reason = None
                      if closes[i] <= position["stop"]:
                          exit_reason = "trail_stop_hit"
                      elif held_days >= MAX_HOLD_DAYS:
                          exit_reason = "max_hold_timeout"
                      if exit_reason:
                          trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                              position["initial_stop"], i, dates[i], closes[i], exit_reason))
                          position = None
                      continue
                  if i < min_lookback:
                      continue
                  if np.isnan(atr[i]) or atr[i] <= 0 or np.isnan(sma_trend[i]) or np.isnan(sma_trend[i - TREND_RISING_LOOKBACK]):
                      continue
                  trend_ok = closes[i] > sma_trend[i] and sma_trend[i] > sma_trend[i - TREND_RISING_LOOKBACK]
                  if not trend_ok:
                      continue
                  window_start = i - SWING_LOOKBACK
                  window_closes = closes[window_start:i]
                  swing_high = float(np.max(window_closes))
                  swing_high_idx = window_start + int(np.argmax(window_closes))
                  low_window_start = max(0, swing_high_idx - SWING_LOOKBACK)
                  swing_low = float(np.min(lows[low_window_start:swing_high_idx + 1]))
                  swing_range = swing_high - swing_low
                  if swing_range <= 0 or (swing_range / swing_high) * 100 < MIN_SWING_PCT:
                      continue
                  fib_618 = swing_high - FIB_618 * swing_range
                  fib_382 = swing_high - FIB_382 * swing_range
                  fib_786 = swing_high - FIB_786 * swing_range
                  if not (fib_618 <= closes[i] <= fib_382):
                      continue
                  if not (closes[i] > closes[i - 1] and closes[i] > opens[i]):
                      continue
                  avg_vol = float(np.mean(vol[i - VOL_LOOKBACK:i]))
                  if avg_vol <= 0 or vol[i] < avg_vol:
                      continue
                  atr_stop = closes[i] - ATR_STOP_MULT * atr[i]
                  stop_loss = max(fib_786, atr_stop)
                  if closes[i] - stop_loss <= 0:
                      continue
                  position = dict(entry_idx=i, entry_date=dates[i], entry_price=closes[i], initial_stop=stop_loss,
                                   stop=stop_loss, atr_at_entry=float(atr[i]), running_max_close=closes[i])
              if position is not None:
                  trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                      position["initial_stop"], n - 1, dates[-1], closes[-1], "data_end_forced_close"))
              return trades


          def replay_rsi2(symbol, df):
              TREND_SMA_N, RSI_N, RSI_ENTRY_MAX, RSI_EXIT_MIN = 200, 2, 10.0, 70.0
              ATR_N, ATR_STOP_MULT, MAX_HOLD_DAYS = 14, 2.0, 10
              df = df.reset_index(drop=True)
              n = len(df)
              min_lookback = max(TREND_SMA_N, ATR_N, RSI_N) + 5
              if n < min_lookback + 5:
                  return []
              closes = df["Close"].to_numpy(dtype=float)
              highs = df["High"].to_numpy(dtype=float)
              lows = df["Low"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()
              atr = _atr(highs, lows, closes, ATR_N)
              sma_trend = pd.Series(closes).rolling(TREND_SMA_N).mean().to_numpy()
              rsi2 = _rsi(closes, RSI_N)
              trades, position = [], None
              for i in range(n):
                  if position is not None:
                      held_days = i - position["entry_idx"]
                      exit_reason = None
                      if closes[i] <= position["stop"]:
                          exit_reason = "stop_hit"
                      elif rsi2[i] > RSI_EXIT_MIN:
                          exit_reason = "rsi_reverted"
                      elif held_days >= MAX_HOLD_DAYS:
                          exit_reason = "max_hold_timeout"
                      if exit_reason:
                          trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                              position["initial_stop"], i, dates[i], closes[i], exit_reason))
                          position = None
                      continue
                  if i < min_lookback:
                      continue
                  if np.isnan(atr[i]) or atr[i] <= 0 or np.isnan(sma_trend[i]):
                      continue
                  if closes[i] <= sma_trend[i] or rsi2[i] >= RSI_ENTRY_MAX:
                      continue
                  stop_loss = closes[i] - ATR_STOP_MULT * atr[i]
                  if closes[i] - stop_loss <= 0:
                      continue
                  position = dict(entry_idx=i, entry_date=dates[i], entry_price=closes[i], initial_stop=stop_loss, stop=stop_loss)
              if position is not None:
                  trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                      position["initial_stop"], n - 1, dates[-1], closes[-1], "data_end_forced_close"))
              return trades


          def replay_bb_squeeze(symbol, df):
              BB_PERIOD, BB_STD, SQUEEZE_LOOKBACK, SQUEEZE_PERCENTILE, RECENT_SQUEEZE_WINDOW = 20, 2.0, 126, 10, 20
              ATR_N, ATR_STOP_MULT, MAX_HOLD_DAYS = 14, 2.5, 60
              df = df.reset_index(drop=True)
              n = len(df)
              min_lookback = max(BB_PERIOD, SQUEEZE_LOOKBACK, ATR_N) + 5
              if n < min_lookback + 5:
                  return []
              closes = df["Close"].to_numpy(dtype=float)
              highs = df["High"].to_numpy(dtype=float)
              lows = df["Low"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()
              atr = _atr(highs, lows, closes, ATR_N)
              sma, upper, lower = _bollinger(closes, BB_PERIOD, BB_STD)
              bandwidth = (upper - lower) / sma
              is_squeeze = _squeeze_flags(bandwidth, SQUEEZE_LOOKBACK, SQUEEZE_PERCENTILE)
              trades, position = [], None
              for i in range(n):
                  if position is not None:
                      held_days = i - position["entry_idx"]
                      exit_reason = None
                      if closes[i] <= position["stop"]:
                          exit_reason = "stop_hit"
                      elif closes[i] < sma[i] and closes[i - 1] >= sma[i - 1]:
                          exit_reason = "middle_band_cross"
                      elif held_days >= MAX_HOLD_DAYS:
                          exit_reason = "max_hold_timeout"
                      if exit_reason:
                          trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                              position["initial_stop"], i, dates[i], closes[i], exit_reason))
                          position = None
                      continue
                  if i < min_lookback or i == 0:
                      continue
                  if np.isnan(atr[i]) or atr[i] <= 0 or np.isnan(upper[i]) or np.isnan(sma[i]):
                      continue
                  breakout = closes[i] > upper[i] and closes[i - 1] <= upper[i - 1]
                  if not breakout:
                      continue
                  if not np.any(is_squeeze[max(0, i - RECENT_SQUEEZE_WINDOW): i]):
                      continue
                  stop_loss = closes[i] - ATR_STOP_MULT * atr[i]
                  if closes[i] - stop_loss <= 0:
                      continue
                  position = dict(entry_idx=i, entry_date=dates[i], entry_price=closes[i], initial_stop=stop_loss, stop=stop_loss)
              if position is not None:
                  trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                      position["initial_stop"], n - 1, dates[-1], closes[-1], "data_end_forced_close"))
              return trades


          def replay_golden_cross(symbol, df):
              SMA_FAST, SMA_SLOW, ATR_N, ATR_STOP_MULT, MAX_HOLD_DAYS = 50, 200, 14, 2.5, 250
              df = df.reset_index(drop=True)
              n = len(df)
              min_lookback = max(SMA_SLOW, ATR_N) + 5
              if n < min_lookback + 5:
                  return []
              closes = df["Close"].to_numpy(dtype=float)
              highs = df["High"].to_numpy(dtype=float)
              lows = df["Low"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()
              atr = _atr(highs, lows, closes, ATR_N)
              sma_fast = pd.Series(closes).rolling(SMA_FAST).mean().to_numpy()
              sma_slow = pd.Series(closes).rolling(SMA_SLOW).mean().to_numpy()
              trades, position = [], None
              for i in range(n):
                  if position is not None:
                      held_days = i - position["entry_idx"]
                      exit_reason = None
                      if closes[i] <= position["stop"]:
                          exit_reason = "stop_hit"
                      elif sma_fast[i] < sma_slow[i] and sma_fast[i - 1] >= sma_slow[i - 1]:
                          exit_reason = "death_cross"
                      elif held_days >= MAX_HOLD_DAYS:
                          exit_reason = "max_hold_timeout"
                      if exit_reason:
                          trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                              position["initial_stop"], i, dates[i], closes[i], exit_reason))
                          position = None
                      continue
                  if i < min_lookback or i == 0:
                      continue
                  if np.isnan(atr[i]) or atr[i] <= 0 or np.isnan(sma_fast[i]) or np.isnan(sma_slow[i]):
                      continue
                  golden_cross = sma_fast[i] > sma_slow[i] and sma_fast[i - 1] <= sma_slow[i - 1]
                  if not golden_cross:
                      continue
                  stop_loss = closes[i] - ATR_STOP_MULT * atr[i]
                  if closes[i] - stop_loss <= 0:
                      continue
                  position = dict(entry_idx=i, entry_date=dates[i], entry_price=closes[i], initial_stop=stop_loss, stop=stop_loss)
              if position is not None:
                  trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                      position["initial_stop"], n - 1, dates[-1], closes[-1], "data_end_forced_close"))
              return trades


          def replay_gap_and_go(symbol, df):
              GAP_PCT_THRESHOLD, VOL_MULT, ATR_N, ATR_STOP_MULT, MAX_HOLD_DAYS = 2.0, 1.5, 14, 2.5, 60
              df = df.reset_index(drop=True)
              n = len(df)
              min_lookback = max(ATR_N, 20) + 5
              if n < min_lookback + 5:
                  return []
              opens = df["Open"].to_numpy(dtype=float)
              highs = df["High"].to_numpy(dtype=float)
              lows = df["Low"].to_numpy(dtype=float)
              closes = df["Close"].to_numpy(dtype=float)
              volumes = df["Volume"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()
              atr = _atr(highs, lows, closes, ATR_N)
              vol_avg = pd.Series(volumes).rolling(20).mean().to_numpy()
              prev_close = np.concatenate(([np.nan], closes[:-1]))
              gap_pct = (opens - prev_close) / prev_close * 100
              trades, position = [], None
              for i in range(n):
                  if position is not None:
                      held_days = i - position["entry_idx"]
                      exit_reason = None
                      if closes[i] <= position["stop"]:
                          exit_reason = "stop_hit"
                      elif closes[i] < position["gap_low"]:
                          exit_reason = "gap_filled"
                      elif held_days >= MAX_HOLD_DAYS:
                          exit_reason = "max_hold_timeout"
                      if exit_reason:
                          trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                              position["initial_stop"], i, dates[i], closes[i], exit_reason))
                          position = None
                      continue
                  if i < min_lookback or i == 0:
                      continue
                  if np.isnan(atr[i]) or atr[i] <= 0 or np.isnan(vol_avg[i]) or np.isnan(gap_pct[i]):
                      continue
                  gapped_up = gap_pct[i] >= GAP_PCT_THRESHOLD
                  held_gap = closes[i] > opens[i]
                  closed_strong = closes[i] >= opens[i] + 0.5 * (highs[i] - opens[i])
                  vol_confirmed = volumes[i] > vol_avg[i] * VOL_MULT
                  if not (gapped_up and held_gap and closed_strong and vol_confirmed):
                      continue
                  stop_loss = closes[i] - ATR_STOP_MULT * atr[i]
                  if closes[i] - stop_loss <= 0:
                      continue
                  position = dict(entry_idx=i, entry_date=dates[i], entry_price=closes[i], initial_stop=stop_loss,
                                   stop=stop_loss, gap_low=lows[i])
              if position is not None:
                  trades.append(_rec(symbol, position["entry_idx"], position["entry_date"], position["entry_price"],
                                      position["initial_stop"], n - 1, dates[-1], closes[-1], "data_end_forced_close"))
              return trades


          STRATEGIES = [
              ("supertrend_3x_flip", "2y", replay_supertrend),
              ("macd_crossover", "2y", replay_macd),
              ("donchian_breakout_55d", "2y", replay_donchian55),
              ("fibonacci_wide_trail", "2y", replay_fib_wide_trail),
              ("rsi2_mean_reversion", "2y", replay_rsi2),
              ("bb_squeeze_breakout", "2y", replay_bb_squeeze),
              ("golden_cross_50_200", "2y", replay_golden_cross),
              ("gap_and_go_5y", "5y", replay_gap_and_go),
          ]

          # =====================================================================
          # Black-Scholes options-approximation pricing/sizing/cost layer
          # (instrument-specific, applied downstream of the unchanged signal
          # logic above). Formula verified against the Hull textbook example
          # in the workflow's own preceding "Sanity-check" step.
          # =====================================================================
          CAPITAL_INR = 400000.0
          R_FREE = 0.065  # disclosed approximate India risk-free rate
          FUTURES_MARGIN_PCT = 0.18  # reused only for the lot-size approximation below, same as the companion futures workflow

          LOT_TARGET_MARGIN_INR = 100000.0
          LOT_TARGET_NOTIONAL_INR = LOT_TARGET_MARGIN_INR / FUTURES_MARGIN_PCT

          def lot_size_for(price):
              if price <= 0:
                  return 0
              raw = LOT_TARGET_NOTIONAL_INR / price
              return max(5, int(round(raw / 5.0) * 5))

          OPTIONS_COST_MODEL = {
              "brokerage_flat": 20.0, "stt_sell_pct": 0.001,
              "exchange_txn_pct": 0.0005, "gst_pct": 0.18,
          }

          def _options_order_cost(premium_notional, side, cm):
              brokerage = cm["brokerage_flat"]
              exch = premium_notional * cm["exchange_txn_pct"]
              stt = premium_notional * cm["stt_sell_pct"] if side == "sell" else 0.0
              gst = (brokerage + exch) * cm["gst_pct"]
              return brokerage + exch + stt + gst

          def _norm_cdf(x):
              return 0.5 * (1.0 + math.erf(x / math.sqrt(2.0)))

          def bs_call_price(S, K, T, r, sigma):
              if T <= 0:
                  return max(S - K, 0.0)
              if sigma <= 0:
                  return max(S - K * math.exp(-r * T), 0.0)
              sqrt_t = math.sqrt(T)
              d1 = (math.log(S / K) + (r + 0.5 * sigma * sigma) * T) / (sigma * sqrt_t)
              d2 = d1 - sigma * sqrt_t
              return S * _norm_cdf(d1) - K * math.exp(-r * T) * _norm_cdf(d2)

          def rolling_hv_annualized(closes, window=20):
              log_ret = np.diff(np.log(closes), prepend=np.log(closes[0]))
              log_ret[0] = np.nan
              return pd.Series(log_ret).rolling(window).std(ddof=0).to_numpy() * math.sqrt(252)

          def round_strike(S):
              if S < 50: unit = 1
              elif S < 100: unit = 2.5
              elif S < 250: unit = 5
              elif S < 500: unit = 10
              elif S < 1000: unit = 20
              elif S < 2500: unit = 50
              else: unit = 100
              return round(S / unit) * unit

          def _last_thursday(year, month):
              last_day = calendar.monthrange(year, month)[1]
              d = date(year, month, last_day)
              while d.weekday() != 3:
                  d -= timedelta(days=1)
              return d

          def weekly_expiry_for(d):
              return d + timedelta(days=(3 - d.weekday()) % 7)

          def monthly_expiry_for(d):
              exp = _last_thursday(d.year, d.month)
              if exp < d:
                  y, mo = d.year, d.month + 1
                  if mo > 12:
                      mo, y = 1, y + 1
                  exp = _last_thursday(y, mo)
              return exp

          def evaluate_options_trade(trade, dates_pydate, closes, sigma_series, expiry_mode, risk_pct,
                                      capital=CAPITAL_INR, capital_tranches=2):
              entry_idx, equity_exit_idx = trade["entry_idx"], trade["exit_idx"]
              entry_date = dates_pydate[entry_idx]
              S_entry = closes[entry_idx]
              K = round_strike(S_entry)
              expiry_date = weekly_expiry_for(entry_date) if expiry_mode == "weekly" else monthly_expiry_for(entry_date)

              expiry_idx = None
              for j in range(entry_idx, len(dates_pydate)):
                  if dates_pydate[j] > expiry_date:
                      break
                  expiry_idx = j
              if expiry_idx is None:
                  return dict(skipped=True, reason="expiry_beyond_available_data")

              if expiry_idx <= equity_exit_idx:
                  actual_exit_idx, exit_reason = expiry_idx, "expiry_settlement"
              else:
                  actual_exit_idx, exit_reason = equity_exit_idx, trade["exit_reason"]

              sigma_entry = sigma_series[entry_idx]
              if np.isnan(sigma_entry) or sigma_entry <= 0:
                  return dict(skipped=True, reason="no_valid_volatility_at_entry")
              T_entry = max((expiry_date - entry_date).days, 0) / 365.0
              premium_entry = bs_call_price(S_entry, K, T_entry, R_FREE, sigma_entry)
              if premium_entry <= 0:
                  return dict(skipped=True, reason="zero_entry_premium")

              S_exit = closes[actual_exit_idx]
              if exit_reason == "expiry_settlement":
                  premium_exit = max(S_exit - K, 0.0)
              else:
                  exit_date = dates_pydate[actual_exit_idx]
                  T_exit = max((expiry_date - exit_date).days, 0) / 365.0
                  sigma_exit = sigma_series[actual_exit_idx]
                  if np.isnan(sigma_exit) or sigma_exit <= 0:
                      sigma_exit = sigma_entry
                  premium_exit = bs_call_price(S_exit, K, T_exit, R_FREE, sigma_exit)

              lot_size = lot_size_for(S_entry)
              usable_capital = min(capital, capital / capital_tranches)
              risk_amount = usable_capital * risk_pct / 100.0
              premium_notional_per_lot = premium_entry * lot_size
              if premium_notional_per_lot <= 0:
                  return dict(skipped=True, reason="degenerate_premium")
              lots_by_risk = risk_amount / premium_notional_per_lot
              lots_by_capital = usable_capital / premium_notional_per_lot
              lots = int(min(lots_by_risk, lots_by_capital))
              if lots <= 0:
                  return dict(skipped=True, reason="premium_exceeds_risk_budget", premium_entry=premium_entry,
                              lot_size=lot_size, fill_ratio=lots_by_risk)

              qty = lots * lot_size
              entry_notional = premium_entry * qty
              exit_notional = premium_exit * qty
              entry_cost = _options_order_cost(entry_notional, "buy", OPTIONS_COST_MODEL)
              exit_cost = _options_order_cost(exit_notional, "sell", OPTIONS_COST_MODEL)
              total_cost = entry_cost + exit_cost
              gross_pnl = (premium_exit - premium_entry) * qty
              net_pnl = gross_pnl - total_cost
              return dict(skipped=False, symbol=trade["symbol"], exit_reason=exit_reason,
                          underlying_exit_reason=trade["exit_reason"], held_days=actual_exit_idx - entry_idx,
                          strike=K, lots=lots, lot_size=lot_size, qty=qty, premium_entry=premium_entry,
                          premium_exit=premium_exit, gross_pnl=gross_pnl, net_pnl=net_pnl, total_cost=total_cost)

          EVIDENCED = sorted(m.NSE_STOCK_PARAM_OVERRIDES.keys())
          UNEVIDENCED_SAMPLE = [
              "ADANIPOWER.NS", "ASIANPAINT.NS", "BAJAJ-AUTO.NS", "BEL.NS", "BHARTIARTL.NS", "BPCL.NS",
              "BRITANNIA.NS", "COALINDIA.NS", "DABUR.NS", "DRREDDY.NS", "EICHERMOT.NS", "HAL.NS",
              "HCLTECH.NS", "HDFCBANK.NS", "HDFCLIFE.NS", "ICICIGI.NS", "ICICIPRULI.NS", "IOC.NS",
              "IRFC.NS", "JINDALSTEL.NS", "KOTAKBANK.NS", "LT.NS", "LUPIN.NS", "MARICO.NS",
              "MOTHERSON.NS", "NESTLEIND.NS", "PNB.NS", "POLYCAB.NS", "SBIN.NS", "SRF.NS",
              "SUNPHARMA.NS", "TATACONSUM.NS", "TATAPOWER.NS", "TATASTEEL.NS", "TORNTPHARM.NS",
              "UBL.NS", "UPL.NS", "VEDL.NS", "WIPRO.NS", "ZYDUSLIFE.NS",
          ]
          SYMBOLS = sorted(set(EVIDENCED) | set(UNEVIDENCED_SAMPLE))
          # DISCLOSURE: single-stock options in real NSE F&O are listed on only
          # a subset of these 52 symbols (many are cash-only). This pass treats
          # the whole universe as "if these were all optionable," not a claim
          # all 52 have real listed options.

          def _metrics_row(evals):
              evals = [e for e in evals if not e.get("skipped")]
              n = len(evals)
              if n == 0:
                  return dict(n=0, win_rate=0.0, pf_net=0.0, pf_gross=0.0, avg_net=0.0, avg_gross=0.0,
                              cost_drag_pct=0.0, avg_held_days=0.0)
              wins = [e for e in evals if e["net_pnl"] > 0]
              losses = [e for e in evals if e["net_pnl"] <= 0]
              win_rate = 100 * len(wins) / n
              gw = sum(e["net_pnl"] for e in wins)
              gl = -sum(e["net_pnl"] for e in losses)
              pf_net = (gw / gl) if gl > 0 else float("inf")
              wins_g = [e for e in evals if e["gross_pnl"] > 0]
              losses_g = [e for e in evals if e["gross_pnl"] <= 0]
              gwg = sum(e["gross_pnl"] for e in wins_g)
              glg = -sum(e["gross_pnl"] for e in losses_g)
              pf_gross = (gwg / glg) if glg > 0 else float("inf")
              avg_net = sum(e["net_pnl"] for e in evals) / n
              avg_gross = sum(e["gross_pnl"] for e in evals) / n
              total_cost = sum(e["total_cost"] for e in evals)
              cost_drag_pct = 100 * total_cost / max(1, sum(abs(e["gross_pnl"]) for e in evals))
              avg_held_days = sum(e["held_days"] for e in evals) / n
              return dict(n=n, win_rate=win_rate, pf_net=pf_net, pf_gross=pf_gross, avg_net=avg_net,
                          avg_gross=avg_gross, cost_drag_pct=cost_drag_pct, avg_held_days=avg_held_days)

          def _print_row(label, row):
              print(f"{label:>26} {row['n']:>5} {row['win_rate']:>6.1f}% {row['pf_net']:>7.2f} "
                    f"{row['pf_gross']:>8.2f} {row['avg_net']:>10.2f} {row['avg_gross']:>10.2f} "
                    f"{row['cost_drag_pct']:>9.1f}% {row['avg_held_days']:>8.1f}d")

          header = (f"{'bucket':>26} {'n':>5} {'win%':>7} {'PFnet':>7} {'PFgross':>8} "
                    f"{'avgNet':>10} {'avgGross':>10} {'costDrag%':>10} {'avgHeld':>9}")

          print(f"=== F&O OPTIONS (BLACK-SCHOLES APPROX) - {len(SYMBOLS)} symbols, {len(STRATEGIES)} strategies, weekly+monthly ===")
          print("REMINDER: synthetic option premiums (BS on trailing realized vol, not real IV) - see header disclosure.\n")

          _fetch_cache = {}
          def _fetch(sym, period):
              key = (sym, period)
              if key not in _fetch_cache:
                  try:
                      raw = m.fetch_ohlc(sym, period, "1d")
                  except Exception:
                      raw = None
                  _fetch_cache[key] = raw
              return _fetch_cache[key]

          overall_ok = {"weekly": 0, "monthly": 0}
          overall_skipped = {"weekly": 0, "monthly": 0}

          for strat_name, period, replay_fn in STRATEGIES:
              print(f"\n{'#'*78}\n# STRATEGY: {strat_name}  (period={period})\n{'#'*78}")

              per_symbol_trades = {}
              skipped_symbols = 0
              for sym in SYMBOLS:
                  raw = _fetch(sym, period)
                  if raw is None or len(raw) < 100:
                      skipped_symbols += 1
                      continue
                  try:
                      trades = replay_fn(sym, raw)
                  except Exception as e:
                      print(f"ERROR {sym}: {e}")
                      continue
                  if trades:
                      df2 = raw.reset_index(drop=True)
                      closes = df2["Close"].to_numpy(dtype=float)
                      dates_pydate = pd.to_datetime(df2["Date"]).dt.date.tolist()
                      sigma_series = rolling_hv_annualized(closes, 20)
                      per_symbol_trades[sym] = (trades, closes, dates_pydate, sigma_series)

              print(f"  fetched {len(SYMBOLS) - skipped_symbols}/{len(SYMBOLS)} symbols")

              for expiry_mode in ("weekly", "monthly"):
                  all_evals = []
                  skip_reasons = {}
                  for sym, (trades, closes, dates_pydate, sigma_series) in per_symbol_trades.items():
                      cfg = m.NSE_STOCK_PARAM_OVERRIDES.get(sym, m.NSE_STOCK_DEFAULT_PARAMS)
                      for t in trades:
                          ev = evaluate_options_trade(t, dates_pydate, closes, sigma_series, expiry_mode, cfg["risk_pct"])
                          if ev.get("skipped"):
                              skip_reasons[ev["reason"]] = skip_reasons.get(ev["reason"], 0) + 1
                              overall_skipped[expiry_mode] += 1
                          else:
                              overall_ok[expiry_mode] += 1
                          all_evals.append(ev)

                  n_signals = len(all_evals)
                  n_tradeable = sum(1 for e in all_evals if not e.get("skipped"))
                  print(f"\n  -- {expiry_mode.upper()} EXPIRY --")
                  if n_signals:
                      print(f"  {n_signals} raw signals, {n_tradeable} priced+sized "
                            f"({100*n_tradeable/n_signals:.1f}% fill rate)")
                  else:
                      print("  0 signals")
                  if skip_reasons:
                      print(f"  skip reasons: {skip_reasons}")

                  print(header)
                  _print_row("ALL", _metrics_row(all_evals))

                  tradeable = [e for e in all_evals if not e.get("skipped")]
                  if tradeable:
                      print("  -- BY EXIT REASON (option-level: signal exit / underlying stop / expiry) --")
                      print(header)
                      for reason in sorted(set(e["exit_reason"] for e in tradeable)):
                          _print_row(reason, _metrics_row([e for e in tradeable if e["exit_reason"] == reason]))
                      expiry_forced = [e for e in tradeable if e["exit_reason"] == "expiry_settlement"]
                      if expiry_forced:
                          print(f"  ({len(expiry_forced)}/{len(tradeable)} trades were forced to expiry-settle "
                                f"before the underlying's own signal exit fired - the option expired first)")

          print(f"\n{'='*78}\nOVERALL FILL SUMMARY ACROSS ALL 8 STRATEGIES:")
          for mode in ("weekly", "monthly"):
              tot = overall_ok[mode] + overall_skipped[mode]
              rate = 100 * overall_ok[mode] / tot if tot else 0.0
              print(f"  {mode:>8}: {overall_ok[mode]} priced+sized, {overall_skipped[mode]} skipped "
                    f"({rate:.1f}% fill rate)")
          PYEOF

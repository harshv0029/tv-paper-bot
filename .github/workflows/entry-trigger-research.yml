name: Entry Trigger Research (backtest candidates)

# One-off/manual research run: backtests several candidate entry-trigger
# strategies (orb_breakout, orb_volume, vwap_reclaim, macd_cross,
# bullish_engulfing, bollinger_mean_reversion) against real historical
# intraday data, so the live /auto-signal trigger logic is chosen on
# evidence, not asserted.
on:
  workflow_dispatch:
    inputs:
      run_price_action_research:
        description: "Also sweep bullish_engulfing on indices + real-volume stocks (AAPL/SPY/QQQ)"
        type: boolean
        default: true
      run_new_asset_research:
        description: "Also sweep orb_breakout + bullish_engulfing on gold (GC=F) and forex (EURUSD=X, USDINR=X) - OUT OF SCOPE per 2026-09-03 NSE-only direction, default off"
        type: boolean
        default: false
      run_bollinger_research:
        description: "Also sweep bollinger_mean_reversion on NSE indices + the 15 NSE large-caps"
        type: boolean
        default: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep + backtest candidates
        run: |
          BT="https://tv-paper-bot-gdan.onrender.com/backtest"
          SW="https://tv-paper-bot-gdan.onrender.com/sweep"
          PERIOD="60d"
          INTERVAL="5m"

          curl -sS -m 30 "https://tv-paper-bot-gdan.onrender.com/health" || true
          echo

          for SYMBOL in "%5ENSEI" "%5ENSEBANK" "%5EBSESN"; do
            echo "=========================================="
            echo "SYMBOL: $SYMBOL"
            echo "=========================================="

            echo "--- sweep: orb_breakout ---"
            curl -sS -m 90 "$SW?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=orb_breakout&rank_by=total_pnl&top_n=8&orb_minutes=5,15,30&sma_fast=5,9,20&sma_slow=20,21,50"
            echo

            echo "--- sweep: orb_volume ---"
            curl -sS -m 90 "$SW?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=orb_volume&rank_by=total_pnl&top_n=8&orb_minutes=5,15,30&sma_fast=9&sma_slow=21&volume_mult=1.2,1.5,2.0"
            echo

            echo "--- backtest: vwap_reclaim ---"
            curl -sS -m 60 "$BT?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=vwap_reclaim"
            echo

            echo "--- backtest: macd_cross (default 12/26/9) ---"
            curl -sS -m 60 "$BT?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=macd_cross"
            echo

            echo "--- backtest: orb_breakout (current /auto-signal defaults: 15/9/21) ---"
            curl -sS -m 60 "$BT?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=orb_breakout&orb_minutes=15&sma_fast=9&sma_slow=21"
            echo
          done

      - name: "Price action: bullish_engulfing sweep (indices, no volume filter)"
        if: ${{ inputs.run_price_action_research }}
        run: |
          SW="https://tv-paper-bot-gdan.onrender.com/sweep"
          PERIOD="60d"
          INTERVAL="5m"
          for SYMBOL in "%5ENSEI" "%5ENSEBANK" "%5EBSESN"; do
            echo "=========================================="
            echo "SYMBOL: $SYMBOL  strategy=bullish_engulfing (trend_sma sweep only - no volume, indices report 0)"
            echo "=========================================="
            curl -sS -m 90 "$SW?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=bullish_engulfing&rank_by=total_pnl&top_n=8&trend_sma=0,20,50&volume_confirm=false"
            echo
          done

      - name: "Price action: bullish_engulfing sweep (real-volume stocks)"
        if: ${{ inputs.run_price_action_research }}
        run: |
          SW="https://tv-paper-bot-gdan.onrender.com/sweep"
          BT="https://tv-paper-bot-gdan.onrender.com/backtest"
          PERIOD="60d"
          INTERVAL="5m"
          # These report real volume on Yahoo (unlike the indices above), so
          # also re-test the two strategies the 2026-09-02 research flagged
          # as "untestable" on indices due to zero volume.
          for SYMBOL in "AAPL" "SPY" "QQQ"; do
            echo "=========================================="
            echo "SYMBOL: $SYMBOL"
            echo "=========================================="

            echo "--- sweep: bullish_engulfing (trend_sma x volume_confirm) ---"
            curl -sS -m 90 "$SW?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=bullish_engulfing&rank_by=total_pnl&top_n=8&trend_sma=0,20,50&volume_confirm=false,true"
            echo

            echo "--- backtest: vwap_reclaim (re-test on real volume) ---"
            curl -sS -m 60 "$BT?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=vwap_reclaim"
            echo

            echo "--- sweep: orb_volume (re-test on real volume) ---"
            curl -sS -m 90 "$SW?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=orb_volume&rank_by=total_pnl&top_n=8&orb_minutes=5,15,30&sma_fast=9&sma_slow=21&volume_mult=1.2,1.5,2.0"
            echo
          done

      - name: "New asset classes: gold + forex (near-24x7 markets)"
        if: ${{ inputs.run_new_asset_research }}
        run: |
          SW="https://tv-paper-bot-gdan.onrender.com/sweep"
          PERIOD="60d"
          INTERVAL="5m"
          # Strategy is asset-class-agnostic (candlestick data only) - same
          # sweep grids already evidenced on NSE indices/AAPL, tested here on
          # gold futures and two forex pairs. Both trade far closer to 24x7
          # than equities (forex: ~24x5, closed weekends; gold futures:
          # ~23x5 with a daily settlement break) - see if that changes
          # anything about which strategy/params work.
          for SYMBOL in "GC=F" "EURUSD=X" "USDINR=X"; do
            echo "=========================================="
            echo "SYMBOL: $SYMBOL"
            echo "=========================================="

            echo "--- sweep: orb_breakout ---"
            curl -sS -m 90 "$SW?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=orb_breakout&rank_by=total_pnl&top_n=8&orb_minutes=5,15,30&sma_fast=5,9,20&sma_slow=20,21,50"
            echo

            echo "--- sweep: bullish_engulfing ---"
            curl -sS -m 90 "$SW?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=bullish_engulfing&rank_by=total_pnl&top_n=8&trend_sma=0,20,50&volume_confirm=false"
            echo
          done

      - name: "Price action: bollinger_mean_reversion sweep (NSE indices + large-caps)"
        if: ${{ inputs.run_bollinger_research }}
        run: |
          SW="https://tv-paper-bot-gdan.onrender.com/sweep"
          PERIOD="60d"
          INTERVAL="5m"
          # 2026-09-04 candidate: classic mean-reversion, not yet tested here.
          # Sourced win-rate context: ~58-65% in non-trending regimes when
          # exiting at the middle band, dropping toward ~45% without a
          # regime filter; explicitly documented as workable on NIFTY 50 and
          # other liquid NSE large-caps (see docs/daily_logs for sources).
          # Scoped to NSE only per the 2026-09-03 RESEARCH_AGENT_BRIEF.md
          # update - indices (no real volume, irrelevant here since this
          # strategy doesn't use volume) plus the 15 NSE large-caps now in
          # WATCHLIST.
          for SYMBOL in "%5ENSEI" "%5ENSEBANK" "%5EBSESN" \
                        "RELIANCE.NS" "TCS.NS" "HDFCBANK.NS" "INFY.NS" "ICICIBANK.NS" \
                        "HINDUNILVR.NS" "ITC.NS" "SBIN.NS" "BHARTIARTL.NS" "KOTAKBANK.NS" \
                        "LT.NS" "AXISBANK.NS" "BAJFINANCE.NS" "MARUTI.NS" "ASIANPAINT.NS"; do
            echo "=========================================="
            echo "SYMBOL: $SYMBOL  strategy=bollinger_mean_reversion (bb_period x bb_std sweep)"
            echo "=========================================="
            curl -sS -m 90 "$SW?symbol=${SYMBOL}&period=${PERIOD}&interval=${INTERVAL}&strategy=bollinger_mean_reversion&rank_by=total_pnl&top_n=8&bb_period=10,20,30&bb_std=1.5,2.0,2.5"
            echo
          done

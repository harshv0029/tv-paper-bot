name: Idea 4 Short Mirror Validation Replay (calls the REAL main.py functions)

# 2026-09-29, explicit user instruction ("Prep short mirror for others
# too") per CLAUDE.md's 2026-09-28 standing thumb rule: every strategy
# gets checked for both directions. Mirrors idea4-validation-replay.yml's
# own pattern exactly, calling m.idea4_entry_signal_short /
# m.idea4_exit_reason_short directly for every entry/exit/stop decision -
# only the position-bookkeeping/cost-application loop and short P&L sign
# are written here.
#
# Full NSE universe via m._load_nse_universe_from_file() (CLAUDE.md,
# 2026-09-29 full-universe thumb rule) - not main.NSE_FULL_UNIVERSE, which
# is silently restricted to the NIFTY-200 live-trading scope by the time
# this script imports main.
#
# Read-only research: does not touch any live parameter, table, or
# scheduler path, and idea4_entry_signal_short/idea4_exit_reason_short are
# NOT wired into main.py's live scan/scheduler/order path (see
# strategy_registry.py's "registering != trading" principle) - given the
# long side's own essentially-breakeven result (PFnet 0.999), this replay
# is what decides whether the short mirror fares any differently.
on:
  workflow_dispatch: {}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run Idea 4 short-mirror backtest against the real main.py functions
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import numpy as np
          import pandas as pd
          import yfinance as yf
          import main as m

          PERIOD = "5y"
          INTERVAL = "1d"
          CAPITAL_INR = 400000.0

          DEFAULT_COST_MODEL = {
              "brokerage_pct": 0.0020, "brokerage_flat": 0.0,
              "exchange_txn_pct": 0.0000297, "sebi_fee_pct": 0.000001,
              "stamp_duty_buy_pct": 0.00015, "stt_buy_pct": 0.001, "stt_sell_pct": 0.001,
              "gst_pct": 0.18, "slippage_pct": 0.0005, "dp_charge_flat": 15.93,
          }


          def _entry_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stamp = notional * cm["stamp_duty_buy_pct"]
              stt = notional * cm["stt_buy_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stamp + stt + gst + slippage


          def _sell_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stt = notional * cm["stt_sell_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stt + gst + slippage


          def _finalize_trade_short(symbol, entry_price, stop_loss, qty, entry_label, exit_price,
                                     exit_label, exit_reason, entry_cost, held_days, cost_model):
              gross_pnl = (entry_price - exit_price) * qty
              sell_cost = _sell_cost(qty, exit_price, cost_model)
              dp_once = cost_model["dp_charge_flat"] + cost_model["dp_charge_flat"] * cost_model["gst_pct"]
              total_cost = entry_cost + sell_cost + dp_once
              net_pnl = gross_pnl - total_cost
              r = stop_loss - entry_price
              return {
                  "symbol": symbol, "entry_ts": entry_label, "exit_ts": exit_label,
                  "exit_reason": exit_reason, "gross_pnl": gross_pnl, "net_pnl": net_pnl,
                  "total_cost": total_cost, "held_days": held_days,
                  "net_r": net_pnl / (r * qty) if r > 0 else None,
              }


          def replay_symbol(symbol, df, index_closes_aligned, risk_pct, capital, cost_model):
              """Calls the REAL m.idea4_entry_signal_short and
              m.idea4_exit_reason_short for every entry/exit/stop decision -
              only the position-bookkeeping/cost-application loop is
              written here."""
              trades = []
              df = df.reset_index(drop=True)
              n = len(df)
              min_lookback = 60
              if n < min_lookback + 20:
                  return trades

              closes = df["Close"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()
              position = None

              for i in range(min_lookback, n):
                  sub_df = df.iloc[: i + 1]
                  idx_sub = index_closes_aligned[: i + 1] if index_closes_aligned is not None else None

                  if position is not None:
                      reason = m.idea4_exit_reason_short(sub_df, position["entry_label"], position["stop_loss"])
                      if reason:
                          held_days = i - position["entry_idx"]
                          trades.append(_finalize_trade_short(
                              symbol, position["entry_price"], position["stop_loss"], position["qty"],
                              position["entry_label"], closes[i], dates[i], reason,
                              position["entry_cost"], held_days, cost_model,
                          ))
                          position = None

                  if position is None:
                      sig = m.idea4_entry_signal_short(sub_df, index_closes=idx_sub)
                      if sig is not None:
                          entry_price = sig["entry_price"]
                          stop_loss = sig["stop_loss"]
                          stop_dist = stop_loss - entry_price
                          if stop_dist > 0:
                              usable_capital_inr = min(capital, capital / m.CAPITAL_TRANCHES)
                              risk_amount_inr = usable_capital_inr * risk_pct / 100
                              qty = min(risk_amount_inr / stop_dist, usable_capital_inr / entry_price)
                              qty = int(np.floor(qty))
                              if qty > 0 and qty * entry_price >= 100:
                                  position = {
                                      "entry_price": entry_price, "stop_loss": stop_loss,
                                      "entry_idx": i, "entry_label": dates[i], "qty": qty,
                                      "entry_cost": _entry_cost(qty, entry_price, cost_model),
                                  }

              if position is not None:
                  held_days = (n - 1) - position["entry_idx"]
                  trades.append(_finalize_trade_short(
                      symbol, position["entry_price"], position["stop_loss"], position["qty"],
                      position["entry_label"], closes[-1], dates[-1], "data_end_forced_close",
                      position["entry_cost"], held_days, cost_model,
                  ))
              return trades


          def _fetch_universe_batched(symbols, period, interval, chunk_size=250):
              out = {}
              for start in range(0, len(symbols), chunk_size):
                  chunk = symbols[start:start + chunk_size]
                  raw = yf.download(chunk, period=period, interval=interval, group_by="ticker",
                                     threads=True, progress=False, auto_adjust=False)
                  if raw.empty:
                      continue
                  if not isinstance(raw.columns, pd.MultiIndex):
                      sub = raw.dropna(subset=["Open", "High", "Low", "Close"])
                      if not sub.empty:
                          sub = sub.reset_index()
                          date_col = "Date" if "Date" in sub.columns else "Datetime"
                          out[chunk[0]] = sub.rename(columns={date_col: "Date"}).reset_index(drop=True)
                      continue
                  top_level = set(raw.columns.get_level_values(0))
                  for sym in chunk:
                      if sym not in top_level:
                          continue
                      sub = raw[sym].dropna(subset=["Open", "High", "Low", "Close"])
                      if sub.empty:
                          continue
                      sub = sub.reset_index()
                      date_col = "Date" if "Date" in sub.columns else "Datetime"
                      out[sym] = sub.rename(columns={date_col: "Date"}).reset_index(drop=True)
              return out


          SYMBOLS = sorted(set(m._load_nse_universe_from_file()))
          print(f"--- Fetching {len(SYMBOLS)} symbols ({INTERVAL}, {PERIOD}), batched+threaded ---")
          raw_by_symbol = {
              sym: df for sym, df in _fetch_universe_batched(SYMBOLS, PERIOD, INTERVAL).items()
              if len(df) >= 100
          }
          print(f"  fetched {len(raw_by_symbol)}/{len(SYMBOLS)} symbols\n")

          print(f"--- Fetching reference index {m.UNIVERSAL_REFERENCE_INDEX} ---")
          idx_raw = m.fetch_ohlc(m.UNIVERSAL_REFERENCE_INDEX, PERIOD, INTERVAL).reset_index(drop=True)
          idx_dates = pd.to_datetime(idx_raw["Date"])
          idx_closes_df = pd.DataFrame({"Date": idx_dates, "idx_close": idx_raw["Close"].astype(float)})

          all_trades = []
          per_symbol_trade_count = {}
          for sym, raw in raw_by_symbol.items():
              cfg = m.NSE_STOCK_PARAM_OVERRIDES.get(sym, m.NSE_STOCK_DEFAULT_PARAMS)
              sym_dates = pd.to_datetime(raw["Date"])
              merged = pd.merge_asof(pd.DataFrame({"Date": sym_dates}), idx_closes_df, on="Date", direction="backward")
              idx_aligned = merged["idx_close"].to_numpy(dtype=float)
              try:
                  trades = replay_symbol(sym, raw, idx_aligned, cfg["risk_pct"], CAPITAL_INR, DEFAULT_COST_MODEL)
              except Exception as e:
                  print(f"ERROR {sym}: {e}")
                  continue
              if trades:
                  per_symbol_trade_count[sym] = len(trades)
              all_trades.extend(trades)
          print(f"  {len(all_trades)} total trades\n")


          def _metrics(trades):
              if not trades:
                  return dict(n=0, win_rate=0.0, pf_net=0.0, pf_gross=0.0, avg_net=0.0, avg_gross=0.0, avg_held_days=0.0)
              n = len(trades)
              wins = [t for t in trades if t["net_pnl"] > 0]
              losses = [t for t in trades if t["net_pnl"] <= 0]
              win_rate = 100 * len(wins) / n
              gw = sum(t["net_pnl"] for t in wins)
              gl = -sum(t["net_pnl"] for t in losses)
              pf_net = (gw / gl) if gl > 0 else float("inf")
              wins_g = [t for t in trades if t["gross_pnl"] > 0]
              losses_g = [t for t in trades if t["gross_pnl"] <= 0]
              gwg = sum(t["gross_pnl"] for t in wins_g)
              glg = -sum(t["gross_pnl"] for t in losses_g)
              pf_gross = (gwg / glg) if glg > 0 else float("inf")
              avg_net = sum(t["net_pnl"] for t in trades) / n
              avg_gross = sum(t["gross_pnl"] for t in trades) / n
              avg_held_days = sum(t["held_days"] for t in trades) / n
              return dict(n=n, win_rate=win_rate, pf_net=pf_net, pf_gross=pf_gross,
                          avg_net=avg_net, avg_gross=avg_gross, avg_held_days=avg_held_days)


          print("=== POOLED RESULT (real main.py functions, idea4_short) ===")
          row = _metrics(all_trades)
          print(f"n_trades={row['n']} win_rate={row['win_rate']:.2f}% "
                f"pf_net={row['pf_net']:.3f} pf_gross={row['pf_gross']:.3f} "
                f"avg_net_inr={row['avg_net']:.2f} avg_held_days={row['avg_held_days']:.1f}")

          print("\n=== By exit_reason ===")
          by_reason = {}
          for t in all_trades:
              by_reason.setdefault(t["exit_reason"], []).append(t)
          for reason, ts in sorted(by_reason.items(), key=lambda kv: -len(kv[1])):
              m2 = _metrics(ts)
              print(f"{reason}: n={m2['n']} win_rate={m2['win_rate']:.2f}% pf_net={m2['pf_net']:.3f} avg_held_days={m2['avg_held_days']:.1f}")

          print("\n=== Top 15 symbols by trade count ===")
          for sym, cnt in sorted(per_symbol_trade_count.items(), key=lambda kv: -kv[1])[:15]:
              print(f"{sym}: {cnt} trades")
          PYEOF

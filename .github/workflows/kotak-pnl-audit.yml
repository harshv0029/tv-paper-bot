name: Kotak Real P&L Audit

# B-59 (2026-10-06, user-approved): read the REAL Kotak trade book + order
# book via the Render app's token-gated endpoints. Public repo: this prints
# ONLY field names, row counts and status tallies - never raw rows, account
# identifiers or holdings. Phase 1 discovers the real field names (never
# guessed); phase 2 will add per-symbol realised P&L once they are known.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch trade book and order book, print schema only
        env:
          KOTAK_NEO_API_TOKEN: ${{ secrets.KOTAK_NEO_API_TOKEN }}
        run: |
          B=https://tv-paper-bot-gdan.onrender.com
          curl -sS -m 90 "$B/health" || true; echo
          curl -sS --retry 3 --retry-delay 10 -m 90 "$B/kotak-neo/trade-report?token=${KOTAK_NEO_API_TOKEN}" -o /tmp/t.json || true
          curl -sS --retry 3 --retry-delay 10 -m 90 "$B/kotak-neo/order-report?token=${KOTAK_NEO_API_TOKEN}" -o /tmp/o.json || true
          python3 - <<'PY'
          import json, collections
          for n in ("t","o"):
              try: d=json.load(open(f"/tmp/{n}.json"))
              except Exception as e: print(n,"unreadable",type(e).__name__); continue
              rows=d.get("data") if isinstance(d,dict) else d
              print(n,"top_keys",sorted(d) if isinstance(d,dict) else "list","error" if isinstance(d,dict) and d.get("error") else "")
              if not isinstance(rows,list) or not rows: print(n,"rows",0 if isinstance(rows,list) else "n/a"); continue
              print(n,"rows",len(rows)); print(n,"row_keys",sorted(rows[0]))
          PY
          python3 - <<'PY'
          # Phase 2 (2026-10-06): Kotak's own order book rows for RVNL/SAIL only.
          # Field names confirmed from the phase-1 run (never guessed). No account ids.
          import json
          try: rows=json.load(open("/tmp/o.json")).get("data") or []
          except Exception as e: rows=[]; print("o unreadable",type(e).__name__)
          sel=[r for r in rows if any(k in str(r.get("trdSym","")) for k in ("RVNL","SAIL"))]
          sel.sort(key=lambda r: str(r.get("ordDtTm","")))
          print("RVNL/SAIL order rows:",len(sel))
          for r in sel:
              print("|".join(str(r.get(k,"")) for k in ("ordDtTm","exCfmTm","trdSym","trnsTp","prod","prcTp","qty","fldQty","prc","trgPrc","avgPrc","ordSt","rejRsn","rmk","ordSrc","algCat","strategyCode")))
          print("cols: ordDtTm|exCfmTm|trdSym|trnsTp|prod|prcTp|qty|fldQty|prc|trgPrc|avgPrc|ordSt|rejRsn|rmk|ordSrc|algCat|strategyCode")
          PY
          python3 - <<'PY'
          # Phase 3 (2026-10-06): the app's own order-state log + bot-only trades for the
          # symbols the user flagged (why were swing positions exited ~3:14pm IST?). Both
          # endpoints are token-free and already public; filtered to those symbols only.
          import json, subprocess, datetime
          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          SYMS = ("RVNL", "SAIL", "DRREDDY", "VBL", "INDHOTEL")
          B = "https://tv-paper-bot-gdan.onrender.com"
          def get(path):
              out = subprocess.run(["curl", "-sS", "--retry", "3", "--retry-delay", "10", "-m", "90", B + path], capture_output=True, text=True).stdout
              try: return json.loads(out)
              except Exception: return {}
          ev = get("/real-order-log?days=1").get("events", [])
          print("app order-log events", len(ev))
          for e in sorted(ev, key=lambda e: e["ts"]):
              if any(s in (e.get("symbol") or "") for s in SYMS):
                  t = datetime.datetime.fromtimestamp(e["ts"], IST).strftime("%H:%M:%S IST")
                  print("LOG", t, e["symbol"], e["leg"], e["event"], "|", (e.get("prev_state") or "")[:70], "->", (e.get("new_state") or "")[:70], "|", (e.get("detail") or "")[:200])
          d = get("/real-trades-today-bot-only")
          print("bot-only keys", sorted(d))
          for k in ("open_positions", "closed_trades"):
              for r in d.get(k, []):
                  if any(s in json.dumps(r) for s in SYMS):
                      print(k, json.dumps(r)[:600])
          PY
      - name: Fetch positions and order book, print sanitised rows
        env:
          KOTAK_NEO_API_TOKEN: ${{ secrets.KOTAK_NEO_API_TOKEN }}
        run: |
          B=https://tv-paper-bot-gdan.onrender.com
          curl -sS -m 90 "$B/health" || true; echo
          curl -sS --retry 3 --retry-delay 10 -m 90 "$B/kotak-neo/positions?token=${KOTAK_NEO_API_TOKEN}" -o /tmp/p.json || true
          curl -sS --retry 3 --retry-delay 10 -m 90 "$B/kotak-neo/order-report?token=${KOTAK_NEO_API_TOKEN}" -o /tmp/o.json || true
          python3 - <<'PY'
          import json
          def rows_of(d):
              if isinstance(d, list): return d
              if isinstance(d, dict):
                  for v in d.values():
                      r = rows_of(v)
                      if r and isinstance(r[0], dict): return r
              return []
          bad = ("acc", "client", "ucc", "pan", "name", "mob", "email", "actid", "act_id")
          def load(n):
              try: return json.load(open(f"/tmp/{n}.json"))
              except Exception as e: print(n, "unreadable", type(e).__name__); return None
          p = load("p")
          if isinstance(p, dict) and p.get("error"): print("positions ERROR (truncated):", str(p["error"])[:80])
          pr = rows_of(p)
          print("position rows:", len(pr))
          if pr: print("position row keys:", sorted(pr[0]))
          for r in pr:
              print("POS", {k: v for k, v in r.items() if not any(b in k.lower() for b in bad)})
          o = load("o")
          orows = rows_of(o)
          print("order rows:", len(orows))
          for r in orows:
              if str(r.get("prcTp", "")).upper() in ("SL", "SL-M") and str(r.get("trnsTp", "")).upper() == "S":
                  print("SLORD", {k: r.get(k) for k in ("trdSym", "trnsTp", "prcTp", "trgPrc", "ordSt", "ordDtTm")})
          PY
      - name: Profitability audit from Kotak order book (today), summary only
        env:
          KOTAK_NEO_API_TOKEN: ${{ secrets.KOTAK_NEO_API_TOKEN }}
        run: |
          python3 - <<'PY'
          # B-59 profitability audit (2026-10-06): realised P&L per symbol from Kotak's own
          # COMPLETE orders (fldQty x avgPrc; fields confirmed in earlier runs). Gross of
          # brokerage/STT/charges (not in these fields - never guessed). Summary rows only.
          import json, collections
          try: d=json.load(open("/tmp/o.json")); rows=d.get("data") or []
          except Exception as e: rows=[]; print("o unreadable", type(e).__name__)
          try:
              t=json.load(open("/tmp/t.json")); print("trade-report:", ("ERROR "+str(t.get("error"))[:90]) if isinstance(t,dict) and t.get("error") else "ok rows=%s"%len(t.get("data") or []))
          except Exception as e: print("trade-report unreadable", type(e).__name__)
          by=collections.defaultdict(lambda: dict(bq=0,bv=0.0,sq=0,sv=0.0,n=0,rej=0,canc=0,mkt_sell=0))
          for r in rows:
              s=str(r.get("trdSym","")); st=str(r.get("ordSt","")).lower(); a=by[s]
              if st=="rejected": a["rej"]+=1; continue
              if st.startswith("cancel"): a["canc"]+=1; continue
              try: q=int(float(r.get("fldQty") or 0)); p=float(r.get("avgPrc") or 0)
              except Exception: continue
              if st!="complete" or q<=0: continue
              a["n"]+=1
              if str(r.get("trnsTp")).upper()=="B": a["bq"]+=q; a["bv"]+=q*p
              else:
                  a["sq"]+=q; a["sv"]+=q*p
                  if str(r.get("prcTp")).upper() in ("MKT","MARKET"): a["mkt_sell"]+=1
          tot=0.0; print("sym|buyQty|avgBuy|sellQty|avgSell|realisedGross|openQty|fills|rejected|cancelled")
          for s,a in sorted(by.items()):
              m=min(a["bq"],a["sq"]); 
              ab=a["bv"]/a["bq"] if a["bq"] else 0; asl=a["sv"]/a["sq"] if a["sq"] else 0
              pnl=m*(asl-ab) if m else 0.0; tot+=pnl
              if a["n"] or a["rej"]:
                  print("%s|%d|%.2f|%d|%.2f|%.2f|%d|%d|%d|%d"%(s,a["bq"],ab,a["sq"],asl,pnl,a["bq"]-a["sq"],a["n"],a["rej"],a["canc"]))
          print("TOTAL realised gross (matched qty, INR): %.2f"%tot)
          print("symbols with >=2 round trips today (churn):", [s for s,a in by.items() if a["n"]>=4])
          PY
      - name: SL snapshot of tracked-union symbols (today only; stored in git)
        env:
          KOTAK_NEO_API_TOKEN: ${{ secrets.KOTAK_NEO_API_TOKEN }}
        run: |
          python3 scripts/kotak_sl_snapshot.py https://tv-paper-bot-gdan.onrender.com "$KOTAK_NEO_API_TOKEN"
          git config user.name "tv-paper-bot sl snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/sl_snapshots
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "SL snapshot $(TZ=Asia/Kolkata date +%Y-%m-%d) (audit run)"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
  entries:
    runs-on: ubuntu-latest
    steps:
      - name: Kotak filled orders + app entry log
        env:
          KOTAK_NEO_API_TOKEN: ${{ secrets.KOTAK_NEO_API_TOKEN }}
        run: |
          B=https://tv-paper-bot-gdan.onrender.com
          curl -sS -m 90 "$B/health" || true; echo
          curl -sS --retry 3 --retry-delay 10 -m 90 "$B/kotak-neo/order-report?token=${KOTAK_NEO_API_TOKEN}" -o /tmp/o.json || true
          curl -sS --retry 3 --retry-delay 10 -m 90 "$B/real-order-log?days=10" -o /tmp/l.json || true
          curl -sS --retry 3 --retry-delay 10 -m 90 "$B/real-trades-today-bot-only" -o /tmp/b.json || true
          python3 - <<'PY'
          import json, datetime
          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          try: d = json.load(open("/tmp/o.json"))
          except Exception as e: d = {}; print("o unreadable", type(e).__name__)
          rows = d.get("data") if isinstance(d, dict) else d
          rows = [r for r in (rows or []) if float(r.get("fldQty") or 0) > 0]
          rows.sort(key=lambda r: str(r.get("ordDtTm", "")))
          print("FILLED order rows:", len(rows))
          for r in rows:
              print("|".join(str(r.get(k, "")) for k in ("ordDtTm", "trdSym", "trnsTp", "prod", "prcTp", "fldQty", "avgPrc", "ordSt", "ordSrc")))
          print("cols: ordDtTm|trdSym|trnsTp|prod|prcTp|fldQty|avgPrc|ordSt|ordSrc")
          try: l = json.load(open("/tmp/l.json")).get("events", [])
          except Exception: l = []
          for e in sorted(l, key=lambda e: e["ts"]):
              if e.get("leg") in ("entry", "staged_T1", "reroute") or e.get("event") in ("placed",) and e.get("leg") != "sl":
                  t = datetime.datetime.fromtimestamp(e["ts"], IST).strftime("%d-%b %H:%M IST")
                  print("LOG", t, e["symbol"], e["leg"], e["event"], "|", (e.get("detail") or "")[:200])
          try: b = json.load(open("/tmp/b.json"))
          except Exception: b = {}
          for k in ("open_positions", "closed_trades"):
              for r in b.get(k, []): print(k, json.dumps(r)[:500])
          PY
  etfscreen:
    # B-317: ETF liquidity screen (Yahoo is unreachable from the dev sandbox).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas
      - name: Screen NSE ETFs by 3-month turnover
        run: python3 scripts/etf_liquidity_screen.py | cut -c1-4000 | grep -v '^ETF_SCREEN_JSON' | head -90

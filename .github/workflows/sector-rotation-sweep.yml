name: Sector rotation L x N x ATR sweep (B-1002, 1d + 4h, both directions, real main.py fns)

# Backlog B-1002. scripts/class_a_replay.py MODE=sector_sweep: sector_rotation lookback L in {1,3,5} x top-N in
# {1,3,5} x ATR stop {1.5,2.5,4,6} x hold, candle size 1d and 4h (4h = 1h x 730d resampled, NSE session
# anchored; holds/lookback are in BARS, 4h holds h2/h6/h10 = ~1/3/5 sessions). Short = REAL main
# sector_rotation_fade_short_* fns; long = REAL main.sector_rotation_picks + harness stop below entry.
# Full universe (main._load_nse_universe_from_file()), 0.8% round-trip cost, atrnone refused (SL on every
# trade), every metric emitted per stop-fill model (stop / gap_aware / close), nothing trimmed.
# Matrix: tf x L = 6 jobs (<= 20 runners). Dispatch order per CLAUDE.md: research matrix, so only when no
# Deploy Gate / safety run is queued or running. Results are research evidence only: register as new tags;
# wiring is a separate step. No kill switch is touched.
on:
  workflow_dispatch:
    inputs:
      entry:
        description: entry fill model (B-1110); signal_close = the live paper fill, own _ec1 tags
        required: false
        default: next_open
        type: choice
        options: [next_open, signal_close]

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        tf: ["1d", "4h"]
        L: ["1", "3", "5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Sweep
        env:
          MODE: sector_sweep
          TF: ${{ matrix.tf }}
          LS: ${{ matrix.L }}
          NS: "1,3,5"
          ATRS: "1d5,2d5,4d0,6d0"
          DIRS: "short,long"
          ENTRY: ${{ inputs.entry }}
          NAME: ${{ matrix.tf }}_l${{ matrix.L }}_${{ inputs.entry }}
        run: python3 scripts/class_a_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: sectorsweep-${{ matrix.tf }}-l${{ matrix.L }}-${{ inputs.entry }}
          path: out/

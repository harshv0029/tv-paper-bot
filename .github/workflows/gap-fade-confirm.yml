name: Gap-fade confirmation (B-778)

# Elder exhaustion/common gap fade, both directions, FULL universe via main._load_nse_universe_from_file(), v2 tags with
# gross + net PFnet. Candle-size sweep via inputs (1d/5y, 1h/730d, 15m or 5m/60d). 4 shards + merge. Research only.
# Matrix: dispatch only when no Deploy Gate / safety run is queued.
on:
  workflow_dispatch:
    inputs:
      interval:
        description: "Candle size (1d, 1h, 15m, 5m)"
        required: false
        default: "1d"
      period:
        description: "yfinance period (1d: 5y; 1h: 730d; 15m/5m: 60d)"
        required: false
        default: "5y"

jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - run: python3 scripts/gap_fade_confirm.py --shard ${{ matrix.shard }} --nshards 4 --interval "${{ inputs.interval }}" --period "${{ inputs.period }}" --out out/
      - uses: actions/upload-artifact@v4
        with:
          name: gapfade-${{ matrix.shard }}
          path: out/

  merge:
    needs: research
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: gapfade-*
          merge-multiple: true
      - run: |
          set -o pipefail
          python3 scripts/gap_fade_confirm.py --merge shards --json gapfade_results.json | tee gapfade_table.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gapfade-results
          path: |
            gapfade_results.json
            gapfade_table.txt

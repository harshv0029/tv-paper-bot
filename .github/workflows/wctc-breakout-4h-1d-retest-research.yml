name: WCTC Breakout Retest at 4h/1d (research)

# Research-only, read-only pass (2026-09-22), idea 7b - explicit user
# instruction: "retry all of strategies with the view of these candles
# first [4h/1d hypothesis from idea 7]... run new rule of thumb on all
# tried strategies till date then go for 8th." This retests ideas 1
# (WCTC volatility breakout) and 6 (Williams high risk-per-trade) at 4h
# and 1d candles, following docs/BACKTESTING_METHODOLOGY.md exactly as
# idea 7 did: 1h fetched natively (730d), 1d fetched natively (5y), 4h
# derived by resampling the 1h fetch - no re-fetch at 4h's own interval
# (yfinance has no native 4h interval for this exchange anyway).
#
# Idea 1's original "yesterday's full session range" generalizes directly
# under "treat candles as candles" (methodology rule 3): threshold =
# today's candle open + k * PRIOR CANDLE's own high-low range. At 1d this
# is literally the original idea-1 mechanism; at 4h it's the same rule
# applied to a coarser candle - no new logic, no timeframe-specific
# branching. k=0.50 fixed (Williams' own most-cited value, already swept
# at 5m in idea 1 - not re-swept here). Stop: entry*(1-stop_pct/100),
# target: entry+2.0R - SAME as idea 1's original design (unlike ideas
# 4/5/7's ATR-stop work, kept deliberately unchanged here so this is a
# clean apples-to-apples retest of idea 1 itself, only the candle size
# changes).
#
# Idea 6's risk_pct sweep (2/10/20/30%) is retested on the SAME 4h/1d
# WCTC signal, since at coarser timeframes stop_dist is proportionally
# much larger in absolute price terms - worth re-checking whether the
# capital/CAPITAL_TRANCHES notional cap still saturates at just 2% risk
# the way it did at 5m (idea 6's finding), or whether it now takes a
# higher risk_pct to hit that same ceiling.
#
# No day/session boundary concept at all - candles are consumed
# sequentially, ONE open position per symbol at a time (idea 6's original
# per-symbol-per-day dedup doesn't generalize past 5m/15m the way score-
# based ideas' day-grouping does, so it's dropped here in favor of the
# same "no overlapping position" rule idea 7 used).
#
# Same cost model and 52-symbol universe as every other research workflow
# here. Read-only; does not touch main.py or any live parameter.

on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run WCTC breakout retest at 4h/1d (k=0.50, risk_pct sweep)
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import numpy as np
          import pandas as pd
          import main as m

          TZ_OFF = m.IST_OFFSET_MIN
          RR = 2.0
          K = 0.50
          RISK_PCT_VARIANTS = [2.0, 10.0, 20.0, 30.0]
          TIMEFRAMES = ["4h", "1d"]

          DEFAULT_COST_MODEL = {
              "brokerage_pct": 0.0020, "brokerage_flat": 0.0,
              "exchange_txn_pct": 0.0000297, "sebi_fee_pct": 0.000001,
              "stamp_duty_buy_pct": 0.00015, "stt_buy_pct": 0.001, "stt_sell_pct": 0.001,
              "gst_pct": 0.18, "slippage_pct": 0.0005, "dp_charge_flat": 15.93,
          }


          def _prep(df):
              df = df.copy()
              ts = pd.to_datetime(df["Date"])
              ts_utc = ts.dt.tz_convert("UTC") if ts.dt.tz is not None else ts.dt.tz_localize("UTC")
              ts_local = ts_utc + pd.Timedelta(minutes=TZ_OFF)
              df = df.assign(ts_local=ts_local)
              return df.sort_values("ts_local").reset_index(drop=True)


          def _resample(df, rule):
              idx = df.set_index("ts_local")
              agg = idx.resample(rule, label="left", closed="left").agg({
                  "Open": "first", "High": "max", "Low": "min", "Close": "last", "Volume": "sum",
              }).dropna(subset=["Open", "High", "Low", "Close"])
              return agg.reset_index()


          def _entry_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stamp = notional * cm["stamp_duty_buy_pct"]
              stt = notional * cm["stt_buy_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stamp + stt + gst + slippage


          def _sell_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stt = notional * cm["stt_sell_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stt + gst + slippage


          def _finalize_trade(symbol, entry_price, initial_stop, qty, entry_ts, exit_price, exit_ts,
                               exit_reason, entry_cost, cost_model, risk_pct):
              gross_pnl = (exit_price - entry_price) * qty
              sell_cost = _sell_cost(qty, exit_price, cost_model)
              dp_once = cost_model["dp_charge_flat"] + cost_model["dp_charge_flat"] * cost_model["gst_pct"]
              total_cost = entry_cost + sell_cost + dp_once
              net_pnl = gross_pnl - total_cost
              r = entry_price - initial_stop
              return {
                  "symbol": symbol, "risk_pct": risk_pct, "entry_ts": entry_ts, "exit_ts": exit_ts,
                  "exit_reason": exit_reason, "gross_pnl": gross_pnl, "net_pnl": net_pnl,
                  "total_cost": total_cost, "net_r": net_pnl / (r * qty) if r > 0 else None,
                  "risk_amount_inr": min(risk_pct, risk_pct),  # placeholder, overwritten below
              }


          def replay_wctc_generic(symbol, df, risk_pct, stop_pct, capital, cost_model):
              """Idea 1's mechanism generalized to any candle size (see
              header): threshold = this candle's open + k * PRIOR candle's
              own high-low range. No day/session concept - sequential bars,
              one open position per symbol at a time."""
              n = len(df)
              if n < 5:
                  return []
              close = df["Close"].to_numpy(dtype=float)
              open_ = df["Open"].to_numpy(dtype=float)
              high = df["High"].to_numpy(dtype=float)
              low = df["Low"].to_numpy(dtype=float)
              ts_local = df["ts_local"]

              trades = []
              i = 1
              while i < n:
                  prev_range = high[i - 1] - low[i - 1]
                  if prev_range <= 0:
                      i += 1
                      continue
                  threshold = open_[i] + K * prev_range
                  if close[i] <= threshold:
                      i += 1
                      continue

                  entry_price = float(close[i])
                  stop_loss = entry_price * (1 - stop_pct / 100)
                  stop_dist = entry_price - stop_loss
                  if stop_dist <= 0:
                      i += 1
                      continue
                  target = entry_price + RR * stop_dist
                  target_move_pct = m._target_move_pct(target, entry_price)
                  if target_move_pct <= m.ROUND_TRIP_COST_PCT:
                      i += 1
                      continue

                  usable_capital_inr = min(capital, capital / m.CAPITAL_TRANCHES)
                  risk_amount_inr = usable_capital_inr * risk_pct / 100
                  qty = risk_amount_inr / stop_dist
                  qty = min(qty, usable_capital_inr / entry_price)
                  qty = float(np.floor(qty))
                  if qty <= 0 or qty * entry_price < 100:
                      i += 1
                      continue
                  real_risk_inr = min(risk_amount_inr, qty * stop_dist)

                  exit_price, exit_ts, exit_reason = None, None, None
                  for j in range(i + 1, n):
                      cj = float(close[j])
                      if cj <= stop_loss:
                          exit_price, exit_reason = cj, "stop_hit"
                      elif cj >= target:
                          exit_price, exit_reason = cj, "target_hit"
                      if exit_reason:
                          exit_ts = ts_local.iloc[j].timestamp()
                          break
                  if exit_reason is None:
                      exit_price = float(close[n - 1])
                      exit_ts = ts_local.iloc[n - 1].timestamp()
                      exit_reason = "window_end_forced_close"
                      j = n - 1

                  entry_cost = _entry_cost(qty, entry_price, cost_model)
                  t = _finalize_trade(symbol, entry_price, stop_loss, qty, ts_local.iloc[i].timestamp(),
                                       exit_price, exit_ts, exit_reason, entry_cost, cost_model, risk_pct)
                  t["risk_amount_inr"] = real_risk_inr
                  trades.append(t)
                  i = j + 1

              return trades


          EVIDENCED = sorted(m.NSE_STOCK_PARAM_OVERRIDES.keys())
          UNEVIDENCED_SAMPLE = [
              "ADANIPOWER.NS", "ASIANPAINT.NS", "BAJAJ-AUTO.NS", "BEL.NS", "BHARTIARTL.NS", "BPCL.NS",
              "BRITANNIA.NS", "COALINDIA.NS", "DABUR.NS", "DRREDDY.NS", "EICHERMOT.NS", "HAL.NS",
              "HCLTECH.NS", "HDFCBANK.NS", "HDFCLIFE.NS", "ICICIGI.NS", "ICICIPRULI.NS", "IOC.NS",
              "IRFC.NS", "JINDALSTEL.NS", "KOTAKBANK.NS", "LT.NS", "LUPIN.NS", "MARICO.NS",
              "MOTHERSON.NS", "NESTLEIND.NS", "PNB.NS", "POLYCAB.NS", "SBIN.NS", "SRF.NS",
              "SUNPHARMA.NS", "TATACONSUM.NS", "TATAPOWER.NS", "TATASTEEL.NS", "TORNTPHARM.NS",
              "UBL.NS", "UPL.NS", "VEDL.NS", "WIPRO.NS", "ZYDUSLIFE.NS",
          ]
          SYMBOLS = sorted(set(EVIDENCED) | set(UNEVIDENCED_SAMPLE))
          CAPITAL_INR = 400000.0

          def _metrics_row(trades):
              if not trades:
                  return dict(n=0, win_rate=0.0, pf_net=0.0, pf_gross=0.0, avg_net=0.0, avg_gross=0.0,
                              cost_drag_pct=0.0, avg_risk_inr=0.0)
              n = len(trades)
              wins = [t for t in trades if t["net_pnl"] > 0]
              losses = [t for t in trades if t["net_pnl"] <= 0]
              win_rate = 100 * len(wins) / n
              gw = sum(t["net_pnl"] for t in wins)
              gl = -sum(t["net_pnl"] for t in losses)
              pf_net = (gw / gl) if gl > 0 else float("inf")
              wins_g = [t for t in trades if t["gross_pnl"] > 0]
              losses_g = [t for t in trades if t["gross_pnl"] <= 0]
              gwg = sum(t["gross_pnl"] for t in wins_g)
              glg = -sum(t["gross_pnl"] for t in losses_g)
              pf_gross = (gwg / glg) if glg > 0 else float("inf")
              avg_net = sum(t["net_pnl"] for t in trades) / n
              avg_gross = sum(t["gross_pnl"] for t in trades) / n
              total_cost = sum(t["total_cost"] for t in trades)
              cost_drag_pct = 100 * total_cost / max(1, sum(abs(t["gross_pnl"]) for t in trades))
              avg_risk_inr = sum(t["risk_amount_inr"] for t in trades) / n
              return dict(n=n, win_rate=win_rate, pf_net=pf_net, pf_gross=pf_gross,
                          avg_net=avg_net, avg_gross=avg_gross, cost_drag_pct=cost_drag_pct,
                          avg_risk_inr=avg_risk_inr)

          def _print_row(label, row):
              print(f"{label:>10} {row['n']:>6} {row['win_rate']:>6.1f}% {row['pf_net']:>7.2f} "
                    f"{row['pf_gross']:>8.2f} {row['avg_net']:>10.2f} {row['avg_gross']:>10.2f} "
                    f"{row['cost_drag_pct']:>9.1f}% {row['avg_risk_inr']:>11.2f}")

          header = (f"{'variant':>10} {'n':>6} {'win%':>7} {'PFnet':>7} {'PFgross':>8} {'avgNet':>10} "
                    f"{'avgGross':>10} {'costDrag%':>10} {'avgRiskINR':>11}")

          print("--- Fetching native data (1h/730d, 1d/5y) per symbol ---")
          native = {"1h": {}, "1d": {}}
          for sym in SYMBOLS:
              try:
                  native["1h"][sym] = _prep(m.fetch_ohlc(sym, "730d", "60m"))
              except Exception:
                  pass
              try:
                  native["1d"][sym] = _prep(m.fetch_ohlc(sym, "5y", "1d"))
              except Exception:
                  pass
          for tf in ("1h", "1d"):
              print(f"  {tf}: fetched {len(native[tf])}/{len(SYMBOLS)} symbols")
          print()

          per_tf_data = {
              "4h": {sym: _resample(df, "4h") for sym, df in native["1h"].items() if len(df) > 0},
              "1d": native["1d"],
          }

          for tf in TIMEFRAMES:
              print(f"########## TIMEFRAME: {tf} ##########\n")
              trades_by_risk = {}
              for risk_pct in RISK_PCT_VARIANTS:
                  all_trades = []
                  for sym, df in per_tf_data[tf].items():
                      if df is None or len(df) < 5:
                          continue
                      cfg = m.NSE_STOCK_PARAM_OVERRIDES.get(sym, m.NSE_STOCK_DEFAULT_PARAMS)
                      try:
                          trades = replay_wctc_generic(sym, df, risk_pct, cfg["stop_pct"], CAPITAL_INR, DEFAULT_COST_MODEL)
                      except Exception as e:
                          print(f"ERROR {sym} tf={tf} risk={risk_pct}: {e}")
                          continue
                      all_trades.extend(trades)
                  trades_by_risk[risk_pct] = all_trades

              print(f"=== {tf}: OVERALL, BY RISK-PCT (k=0.50 fixed) ===")
              print(header)
              for risk_pct in RISK_PCT_VARIANTS:
                  _print_row(f"{risk_pct:.0f}%", _metrics_row(trades_by_risk[risk_pct]))

              base_trades = trades_by_risk[2.0]
              print(f"\n=== {tf}: risk=2% BY EXIT REASON ===")
              print(header)
              for reason in sorted(set(t["exit_reason"] for t in base_trades)):
                  _print_row(reason, _metrics_row([t for t in base_trades if t["exit_reason"] == reason]))

              print(f"\n=== {tf}: risk=2% BY SYMBOL (n>=3, sorted by gross PF) ===")
              print(header)
              per_symbol = {}
              for t in base_trades:
                  per_symbol.setdefault(t["symbol"], []).append(t)
              symbol_rows = [(sym, _metrics_row(sts)) for sym, sts in per_symbol.items() if len(sts) >= 3]
              symbol_rows.sort(key=lambda x: x[1]["pf_gross"], reverse=True)
              for sym, row in symbol_rows[:15]:
                  _print_row(sym, row)
              print()
          PYEOF

name: Position Journal Sync

# Render's free tier has no persistent disk - every redeploy wipes the
# SQLite DB, including any open auto-signal position. Without this, an open
# position would just vanish from tracking: never checked against its
# stop/target again, no exit ever recorded, silently forgotten until a human
# notices. state/open_positions.json is a plain git-tracked file, so it
# survives every redeploy (baked into each fresh checkout) even though the
# DB doesn't - main.py reads it on startup and restores anything the fresh
# DB is missing (see reconcile_open_positions_from_journal in main.py).
#
# Also appends every newly-closed trade to docs/trade_outcomes_log.json -
# the DB's `trades` table is just as exposed to a redeploy wipe as open
# positions were, and this is the durable, growing record the Research
# Agent needs to compute real historical probabilities (e.g. "of trades
# that got X% of the way to target, what fraction actually hit it") instead
# of guessing at a confidence number.
#
# workflow_dispatch only, deliberately NOT `schedule:` - GH Actions'
# schedule cron proved unreliable in practice earlier today (see
# docs/KNOWN_ISSUES.md), which would defeat the point of a safety net. A
# separate lightweight CCR session ("Position Journal Sync Agent") calls
# this on a reliable recurring trigger instead.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current state from the live server
        run: |
          mkdir -p state
          # Render free-tier can be cold (asleep, or mid-redeploy from a
          # push earlier in this same session) - a bare 30s timeout failed
          # a real run today during exactly that. Wake it first with a
          # generous health check, then retry the actual fetch a few times
          # with backoff instead of failing the whole sync on one slow response.
          curl -sS -m 60 "https://tv-paper-bot-gdan.onrender.com/health" || true
          echo
          curl -sS --retry 4 --retry-delay 5 --retry-connrefused -m 45 \
            "https://tv-paper-bot-gdan.onrender.com/daily-summary?capital=400000&daily_risk_pct=2" \
            -o /tmp/daily-summary.json
          cat /tmp/daily-summary.json
          echo
          curl -sS --retry 2 --retry-delay 5 -m 30 \
            "https://tv-paper-bot-gdan.onrender.com/scheduler-attempts" \
            -o /tmp/scheduler-attempts.json
          cat /tmp/scheduler-attempts.json
          echo

      - name: Write the open-positions journal
        run: |
          jq '{synced_at_utc: (now | todate), open_positions: .open_positions}' /tmp/daily-summary.json \
            > state/open_positions.json
          cat state/open_positions.json

      - name: Append newly-closed trades to the outcome history
        run: |
          test -f docs/trade_outcomes_log.json || echo '[]' > docs/trade_outcomes_log.json
          jq -s '
            (.[0] // []) as $existing |
            (.[1].closed_trades // []) as $new |
            ($existing + $new)
            | group_by(.symbol + "|" + (.exit_time_utc|tostring))
            | map(.[0])
            | sort_by(.exit_time_utc)
          ' docs/trade_outcomes_log.json /tmp/daily-summary.json > /tmp/trade_outcomes_merged.json
          mv /tmp/trade_outcomes_merged.json docs/trade_outcomes_log.json
          echo "trade_outcomes_log.json now has $(jq 'length' docs/trade_outcomes_log.json) trades"

      - name: Append this cycle's entry-condition checks to the attempt log
        run: |
          # Real visibility into what the engine checked and decided, every
          # cycle - not just closed trades. One snapshot per sync (hourly),
          # not per 30s tick, to keep this readable. Kept forever, uncapped,
          # per explicit user instruction - this is the permanent record of
          # every attempt made, not a rolling window.
          mkdir -p docs
          test -f docs/attempt_log.json || echo '[]' > docs/attempt_log.json
          jq -s '
            .[0] + [{synced_at_utc: (now | todate), attempts: .[1]}]
          ' docs/attempt_log.json /tmp/scheduler-attempts.json > /tmp/attempt_log_merged.json
          mv /tmp/attempt_log_merged.json docs/attempt_log.json
          echo "attempt_log.json now has $(jq 'length' docs/attempt_log.json) snapshots"

      - name: Commit journal/history/attempts if any changed
        run: |
          git config user.name "tv-paper-bot journal sync"
          git config user.email "actions@users.noreply.github.com"
          git add state/open_positions.json docs/trade_outcomes_log.json docs/attempt_log.json
          if git diff --cached --quiet; then
            echo "No change - nothing to commit."
          else
            git commit -m "Sync position journal + trade outcome + attempt log ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

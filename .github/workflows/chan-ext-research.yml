name: Chan extension research (B-431 B-439 B-441 B-442 B-447 B-448 B-449 B-450 B-451 B-457 B-458)

# Research-only, read-only. Ernest Chan, Algorithmic Trading: the rows chan-research.yml does NOT cover.
# Harness: scripts/chan_ext_research.py (reuses chan_research.simulate/atr_arr/half_life and the oneil_research
# cell accumulators; never reimplements the trade loop). FULL NSE universe (main._load_nse_universe_from_file()),
# BOTH directions as separate tags, ATR stop on every trade (1.5/2.5/4.0), 0.8% round-trip cost.
# Candle sizes: 1d (5y) and 1h (730d) for Kalman (B-441), z20 mean reversion + stationarity-battery/ADF-break gates
# (B-447/B-448), volume-weighted anchor (B-442); 15m and 5m (60d) for B-442 (forced flat each session) and the
# late-day continuation (B-439, entry at the 15:00 IST bar, exit at the close). 1d also runs: 252d-return decile
# (B-431) with NIFTY-drawdown momentum-crash gates (B-451), India VIX gates on every chan ts family (B-450),
# per-year split of every ts cell (B-457; delisted-inclusive universe owed), correlation scan (B-449). The hygiene job
# (B-458) counts bad ticks / jumps / zero-volume bars across the universe. Bar-count constants mean BARS, not days,
# at every interval (stated in the harness header). 4h = 1h bars resampled per session (cell_tsv.resample_4h, B-785). Index-futures path for B-439 owed.
# Jobs: 3 shards x 4 intervals = 12, + 3 hygiene shards, + 4 merges. Each cell is its own tag; the merge prints
# PFnet net/gross, win %, n, avg hold bars, exit reasons and the universe size.
# Dispatch order per CLAUDE.md: big matrix, so only when no gate/safety run is queued.
on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        interval: ["1d", "4h", "1h", "15m", "5m"]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
          NSHARDS: "3"
          INTERVAL: ${{ matrix.interval }}
          OUT_DIR: out
        run: |
          set -o pipefail
          python3 scripts/chan_ext_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: chanext-${{ matrix.interval }}-${{ matrix.shard }}
          path: out/chan_ext_*.json

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Hygiene scan
        env:
          HYGIENE: "1"
          INTERVAL: "1d"
          SHARD: ${{ matrix.shard }}
          NSHARDS: "3"
          OUT_DIR: out
        run: |
          set -o pipefail
          python3 scripts/chan_ext_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: chanext-hyg-${{ matrix.shard }}
          path: out/chan_ext_hyg_*.json

  merge:
    needs: [run, hygiene]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        interval: ["1d", "4h", "1h", "15m", "5m"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: chanext-*
          path: shards
          merge-multiple: true
      - name: Merge and print
        env:
          OUT: chan_ext_results_${{ matrix.interval }}.json
          TSV_OUT: chan_ext_cells_${{ matrix.interval }}.tsv
        run: |
          set -o pipefail
          if [ "${{ matrix.interval }}" = "1d" ]; then
            python3 scripts/chan_ext_research.py --merge shards/chan_ext_1d_s*.json shards/chan_ext_hyg_1d_s*.json | tee merge_1d.txt
          else
            python3 scripts/chan_ext_research.py --merge shards/chan_ext_${{ matrix.interval }}_s*.json | tee merge_${{ matrix.interval }}.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chanext-results-${{ matrix.interval }}
          path: |
            chan_ext_results_${{ matrix.interval }}.json
            chan_ext_cells_${{ matrix.interval }}.tsv
            merge_${{ matrix.interval }}.txt

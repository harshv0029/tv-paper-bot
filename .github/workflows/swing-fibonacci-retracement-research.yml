name: Swing Fibonacci Retracement Signal (research)

# Research-only, read-only pass (2026-09-15) - twelfth from-scratch entry
# hypothesis this session, and a genuinely different technical method
# from everything tried so far (VWAP mean-reversion, opening-range
# breakout, Donchian breakout, EMA pullback) - explicit user request to
# try something like Fibonacci retracement rather than another variant
# of the same entry families.
#
# Built on the swing/daily-bar architecture proven in
# swing-breakout-continuation-research.yml (run 34929783550 / slow-
# Donchian follow-up run 34930930995, best PFnet of the session at 0.55,
# cost drag ~18%): same trend filter, same chandelier trailing-stop exit
# machinery, same cost model/universe/sizing. Only the ENTRY is new.
#
# Entry (ALL required, daily bars):
#   1. Identify the most recent significant swing: the highest close in
#      the last 40 trading days (the "swing high"), and the lowest low
#      in the 40 days leading up to that swing high (the "swing low") -
#      the up-move the retracement is measured against.
#   2. Minimum swing size: (swing_high - swing_low) / swing_high >= 3% -
#      filters out noise-level moves too small for a retracement level
#      to mean anything.
#   3. Golden-pocket pullback: today's close sits between the 61.8% and
#      38.2% Fibonacci retracement levels of that swing (the classic
#      "golden pocket" - standard technical-analysis convention, not
#      invented for this test).
#   4. Trend filter: close > 50-day SMA, AND the 50-day SMA itself is
#      rising vs 20 days ago (identical filter/window to every prior
#      swing test this session).
#   5. Reversal day: close > yesterday's close AND close > today's open
#      (a green reversal day, not just any day sitting in the zone).
#   6. Volume participation: today's volume >= the trailing 20-day
#      average (not necessarily a surge - pullback days are often
#      lower-volume, this just rules out a dead-volume drift).
#
# Stop: tighter of (a) the 78.6% retracement level (the standard
# Fibonacci invalidation - if price gives back this much of the swing,
# the retracement thesis is wrong), or (b) 2.0x ATR(14) below entry -
# same "tighter of two" pattern as every prior swing test.
# Exit: IDENTICAL to run 34929783550/34930930995 - chandelier trailing
# stop (running max close - 2.0x ATR-at-entry, ratchets up only), 60-day
# max-hold backstop. Same cost model, same 52-symbol universe, same 2
# years of daily bars, same position-sizing formula.
#
# Fibonacci ratios (38.2%/61.8%/78.6%) and the 40-day swing lookback are
# standard technical-analysis conventions, not fit to this test's own
# result - one shot, reported honestly either way.
#
# Does not call universal_score/orb_breakout/_vwap_mean_reversion_entry
# signal code at all - reuses only pure data/cost plumbing from main.py
# (fetch_ohlc, symbol lists, cost model). Read-only: no live parameter
# touched, nothing wired into main.py.

on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run swing fibonacci retracement backtest
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import json
          import numpy as np
          import pandas as pd
          import main as m

          PERIOD = "2y"
          INTERVAL = "1d"
          SWING_LOOKBACK = 40
          MIN_SWING_PCT = 3.0
          FIB_618 = 0.618
          FIB_382 = 0.382
          FIB_786 = 0.786
          TREND_SMA_N = 50
          TREND_RISING_LOOKBACK = 20
          ATR_N = 14
          VOL_LOOKBACK = 20
          ATR_STOP_MULT = 2.0
          MAX_HOLD_DAYS = 60

          DEFAULT_COST_MODEL = {
              "brokerage_pct": 0.0020, "brokerage_flat": 0.0,
              "exchange_txn_pct": 0.0000297, "sebi_fee_pct": 0.000001,
              "stamp_duty_buy_pct": 0.00015, "stt_buy_pct": 0.001, "stt_sell_pct": 0.001,
              "gst_pct": 0.18, "slippage_pct": 0.0005, "dp_charge_flat": 15.93,
          }


          def _entry_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stamp = notional * cm["stamp_duty_buy_pct"]
              stt = notional * cm["stt_buy_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stamp + stt + gst + slippage


          def _sell_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stt = notional * cm["stt_sell_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stt + gst + slippage


          def _finalize_trade(symbol, entry_price, initial_stop, qty, entry_label, exit_price, exit_label,
                               exit_reason, entry_cost, held_days, cost_model):
              gross_pnl = (exit_price - entry_price) * qty
              sell_cost = _sell_cost(qty, exit_price, cost_model)
              dp_once = cost_model["dp_charge_flat"] + cost_model["dp_charge_flat"] * cost_model["gst_pct"]
              total_cost = entry_cost + sell_cost + dp_once
              net_pnl = gross_pnl - total_cost
              r = entry_price - initial_stop
              return {
                  "symbol": symbol, "entry_ts": entry_label, "exit_ts": exit_label, "exit_reason": exit_reason,
                  "gross_pnl": gross_pnl, "net_pnl": net_pnl, "total_cost": total_cost, "held_days": held_days,
                  "net_r": net_pnl / (r * qty) if r > 0 else None,
              }


          def replay_symbol(symbol, df, risk_pct, capital, cost_model):
              trades = []
              df = df.reset_index(drop=True)
              n = len(df)
              min_lookback = max(SWING_LOOKBACK, TREND_SMA_N + TREND_RISING_LOOKBACK, ATR_N, VOL_LOOKBACK) + 1
              if n < min_lookback + 5:
                  return trades
              closes = df["Close"].to_numpy(dtype=float)
              opens = df["Open"].to_numpy(dtype=float)
              highs = df["High"].to_numpy(dtype=float)
              lows = df["Low"].to_numpy(dtype=float)
              vol = df["Volume"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()

              prev_close = np.concatenate(([np.nan], closes[:-1]))
              tr = np.maximum(highs - lows, np.maximum(np.abs(highs - prev_close), np.abs(lows - prev_close)))
              atr = pd.Series(tr).rolling(ATR_N).mean().to_numpy()
              sma_trend = pd.Series(closes).rolling(TREND_SMA_N).mean().to_numpy()

              position = None

              for i in range(n):
                  if position is not None:
                      position["running_max_close"] = max(position["running_max_close"], closes[i])
                      trail_stop = position["running_max_close"] - position["atr_at_entry"] * ATR_STOP_MULT
                      if trail_stop > position["stop"]:
                          position["stop"] = trail_stop
                      held_days = i - position["entry_idx"]
                      exit_reason = None
                      exit_price = closes[i]
                      if closes[i] <= position["stop"]:
                          exit_reason = "trail_stop_hit"
                      elif held_days >= MAX_HOLD_DAYS:
                          exit_reason = "max_hold_timeout"
                      if exit_reason:
                          trades.append(_finalize_trade(
                              symbol, position["entry_price"], position["initial_stop"], position["qty"],
                              position["entry_label"], exit_price, dates[i], exit_reason,
                              position["entry_cost"], held_days, cost_model,
                          ))
                          position = None
                      continue

                  if i < min_lookback:
                      continue
                  if np.isnan(atr[i]) or atr[i] <= 0 or np.isnan(sma_trend[i]) or np.isnan(sma_trend[i - TREND_RISING_LOOKBACK]):
                      continue

                  trend_ok = closes[i] > sma_trend[i] and sma_trend[i] > sma_trend[i - TREND_RISING_LOOKBACK]
                  if not trend_ok:
                      continue

                  window_start = i - SWING_LOOKBACK
                  window_closes = closes[window_start:i]
                  swing_high = float(np.max(window_closes))
                  swing_high_idx = window_start + int(np.argmax(window_closes))
                  low_window_start = max(0, swing_high_idx - SWING_LOOKBACK)
                  swing_low = float(np.min(lows[low_window_start:swing_high_idx + 1]))

                  swing_range = swing_high - swing_low
                  if swing_range <= 0 or (swing_range / swing_high) * 100 < MIN_SWING_PCT:
                      continue

                  fib_618 = swing_high - FIB_618 * swing_range
                  fib_382 = swing_high - FIB_382 * swing_range
                  fib_786 = swing_high - FIB_786 * swing_range

                  golden_zone_ok = fib_618 <= closes[i] <= fib_382
                  if not golden_zone_ok:
                      continue

                  reversal_ok = closes[i] > closes[i - 1] and closes[i] > opens[i]
                  if not reversal_ok:
                      continue

                  avg_vol = float(np.mean(vol[i - VOL_LOOKBACK:i]))
                  if avg_vol <= 0 or vol[i] < avg_vol:
                      continue

                  entry_price = closes[i]
                  atr_stop = entry_price - ATR_STOP_MULT * atr[i]
                  stop_loss = max(fib_786, atr_stop)  # tighter of the two
                  stop_dist = entry_price - stop_loss
                  if stop_dist <= 0:
                      continue

                  usable_capital_inr = min(capital, capital / m.CAPITAL_TRANCHES)
                  risk_amount_inr = usable_capital_inr * risk_pct / 100
                  qty = risk_amount_inr / stop_dist
                  qty = min(qty, usable_capital_inr / entry_price)
                  qty = int(np.floor(qty))
                  if qty <= 0 or qty * entry_price < 100:
                      continue

                  position = {
                      "entry_price": entry_price, "initial_stop": stop_loss, "stop": stop_loss,
                      "entry_idx": i, "entry_label": dates[i], "qty": qty,
                      "atr_at_entry": float(atr[i]), "running_max_close": entry_price,
                      "entry_cost": _entry_cost(qty, entry_price, cost_model),
                  }

              if position is not None:
                  held_days = (n - 1) - position["entry_idx"]
                  trades.append(_finalize_trade(
                      symbol, position["entry_price"], position["initial_stop"], position["qty"],
                      position["entry_label"], closes[-1], dates[-1], "data_end_forced_close",
                      position["entry_cost"], held_days, cost_model,
                  ))

              return trades


          EVIDENCED = sorted(m.NSE_STOCK_PARAM_OVERRIDES.keys())
          UNEVIDENCED_SAMPLE = [
              "ADANIPOWER.NS", "ASIANPAINT.NS", "BAJAJ-AUTO.NS", "BEL.NS", "BHARTIARTL.NS", "BPCL.NS",
              "BRITANNIA.NS", "COALINDIA.NS", "DABUR.NS", "DRREDDY.NS", "EICHERMOT.NS", "HAL.NS",
              "HCLTECH.NS", "HDFCBANK.NS", "HDFCLIFE.NS", "ICICIGI.NS", "ICICIPRULI.NS", "IOC.NS",
              "IRFC.NS", "JINDALSTEL.NS", "KOTAKBANK.NS", "LT.NS", "LUPIN.NS", "MARICO.NS",
              "MOTHERSON.NS", "NESTLEIND.NS", "PNB.NS", "POLYCAB.NS", "SBIN.NS", "SRF.NS",
              "SUNPHARMA.NS", "TATACONSUM.NS", "TATAPOWER.NS", "TATASTEEL.NS", "TORNTPHARM.NS",
              "UBL.NS", "UPL.NS", "VEDL.NS", "WIPRO.NS", "ZYDUSLIFE.NS",
          ]
          SYMBOLS = sorted(set(EVIDENCED) | set(UNEVIDENCED_SAMPLE))
          CAPITAL_INR = 400000.0

          def _metrics_row(trades):
              if not trades:
                  return dict(n=0, win_rate=0.0, pf_net=0.0, pf_gross=0.0, avg_net=0.0, avg_gross=0.0, cost_drag_pct=0.0, avg_held_days=0.0)
              n = len(trades)
              wins = [t for t in trades if t["net_pnl"] > 0]
              losses = [t for t in trades if t["net_pnl"] <= 0]
              win_rate = 100 * len(wins) / n
              gw = sum(t["net_pnl"] for t in wins)
              gl = -sum(t["net_pnl"] for t in losses)
              pf_net = (gw / gl) if gl > 0 else float("inf")
              wins_g = [t for t in trades if t["gross_pnl"] > 0]
              losses_g = [t for t in trades if t["gross_pnl"] <= 0]
              gwg = sum(t["gross_pnl"] for t in wins_g)
              glg = -sum(t["gross_pnl"] for t in losses_g)
              pf_gross = (gwg / glg) if glg > 0 else float("inf")
              avg_net = sum(t["net_pnl"] for t in trades) / n
              avg_gross = sum(t["gross_pnl"] for t in trades) / n
              total_cost = sum(t["total_cost"] for t in trades)
              cost_drag_pct = 100 * total_cost / max(1, sum(abs(t["gross_pnl"]) for t in trades))
              avg_held_days = sum(t["held_days"] for t in trades) / n
              return dict(n=n, win_rate=win_rate, pf_net=pf_net, pf_gross=pf_gross,
                          avg_net=avg_net, avg_gross=avg_gross, cost_drag_pct=cost_drag_pct,
                          avg_held_days=avg_held_days)

          def _print_row(label, row):
              print(f"{label:>28} {row['n']:>6} {row['win_rate']:>6.1f}% {row['pf_net']:>7.2f} "
                    f"{row['pf_gross']:>8.2f} {row['avg_net']:>10.2f} {row['avg_gross']:>10.2f} "
                    f"{row['cost_drag_pct']:>9.1f}% {row['avg_held_days']:>8.1f}d")

          print(f"--- Fetching {len(SYMBOLS)} symbols ({INTERVAL}, {PERIOD}) ---")
          all_trades = []
          skipped = 0
          for sym in SYMBOLS:
              cfg = m.NSE_STOCK_PARAM_OVERRIDES.get(sym, m.NSE_STOCK_DEFAULT_PARAMS)
              try:
                  raw = m.fetch_ohlc(sym, PERIOD, INTERVAL)
              except Exception:
                  skipped += 1
                  continue
              if raw is None or len(raw) < 100:
                  skipped += 1
                  continue
              try:
                  trades = replay_symbol(sym, raw, cfg["risk_pct"], CAPITAL_INR, DEFAULT_COST_MODEL)
              except Exception as e:
                  print(f"ERROR {sym}: {e}")
                  continue
              all_trades.extend(trades)
          print(f"  fetched {len(SYMBOLS) - skipped}/{len(SYMBOLS)} symbols, {len(all_trades)} trades\n")

          header = (f"{'bucket':>28} {'n':>6} {'win%':>7} {'PFnet':>7} {'PFgross':>8} "
                    f"{'avgNet':>10} {'avgGross':>10} {'costDrag%':>10} {'avgHeld':>9}")

          print("=== OVERALL ===")
          print(header)
          _print_row("ALL", _metrics_row(all_trades))

          print("\n=== BY EXIT REASON ===")
          print(header)
          for reason in sorted(set(t["exit_reason"] for t in all_trades)):
              _print_row(reason, _metrics_row([t for t in all_trades if t["exit_reason"] == reason]))

          print("\n=== BY SYMBOL (n>=2, sorted by gross PF) ===")
          print(header)
          per_symbol = {}
          for t in all_trades:
              per_symbol.setdefault(t["symbol"], []).append(t)
          symbol_rows = [(sym, _metrics_row(trades)) for sym, trades in per_symbol.items() if len(trades) >= 2]
          symbol_rows.sort(key=lambda x: x[1]["pf_gross"], reverse=True)
          for sym, row in symbol_rows:
              _print_row(sym, row)
          PYEOF

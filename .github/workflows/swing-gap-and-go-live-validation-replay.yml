name: Swing Gap and Go - LIVE code validation replay

# Validation-only, read-only pass (2026-09-16). Unlike every prior
# *-research.yml workflow this session (each a semi-independent
# reimplementation of the signal math in the workflow YAML itself), this
# workflow imports main.py and calls the REAL, now-implemented
# main.gap_and_go_entry_signal / main.gap_and_go_exit_reason functions
# directly - the exact functions main.py's swing engine (_run_swing_scan,
# wired into _scheduler_tick) calls live. Per this repo's CLAUDE.md
# ("verify the replay driver actually calls the changed main.py code - has
# drifted before"), this is the check that confirms the shipped
# implementation reproduces the validated research finding
# (swing-gap-and-go-5y-research.yml, run 35062601024: PFnet 1.65, n=142),
# not a second independent reimplementation that could quietly diverge.
#
# Also validates main.SWING_WATCHLIST (52 symbols) matches the validated
# universe, and main.SWING_MAX_HOLD_DAYS/SWING_ATR_STOP_MULT match the
# validated parameters - all read directly from main.py, not redeclared
# here, so a future parameter change shows up as a changed replay result
# rather than silently going untested.
#
# Each entry/exit check calls the real function on a bounded trailing
# window (150 bars) ending at that day, not the full history - both
# functions only ever look at the last row plus a <=20-bar rolling lookback
# (ATR14/20d volume average), so this produces IDENTICAL results to a
# full-history call for every row that has >=21 prior bars, while keeping
# ~52 symbols x ~1250 daily bars x 2 calls/day computationally cheap on a
# GitHub Actions runner.
#
# Read-only: does not write to signal_state_swing, does not call
# _run_swing_scan or touch the scheduler, does not place any paper or real
# trade - it is a pure backtest-style replay of the two pure functions.

on:
  workflow_dispatch: {}

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Replay main.py's real gap_and_go_entry_signal/gap_and_go_exit_reason
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import numpy as np
          import pandas as pd
          import main as m

          PERIOD = "5y"
          INTERVAL = "1d"
          WINDOW_BARS = 150  # >> max(SWING_ATR_N, SWING_VOL_AVG_LOOKBACK)+1 - see header comment
          CAPITAL_INR = 400000.0

          DEFAULT_COST_MODEL = {
              "brokerage_pct": 0.0020, "brokerage_flat": 0.0,
              "exchange_txn_pct": 0.0000297, "sebi_fee_pct": 0.000001,
              "stamp_duty_buy_pct": 0.00015, "stt_buy_pct": 0.001, "stt_sell_pct": 0.001,
              "gst_pct": 0.18, "slippage_pct": 0.0005, "dp_charge_flat": 15.93,
          }


          def _entry_cost(qty, price, cm):
              notional = qty * price
              brokerage = notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stamp = notional * cm["stamp_duty_buy_pct"]
              stt = notional * cm["stt_buy_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stamp + stt + gst + slippage


          def _sell_cost(qty, price, cm):
              notional = qty * price
              brokerage = notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stt = notional * cm["stt_sell_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stt + gst + slippage


          def _finalize_trade(symbol, entry_price, initial_stop, qty, entry_label, exit_price, exit_label,
                               exit_reason, entry_cost, held_days, cost_model):
              gross_pnl = (exit_price - entry_price) * qty
              sell_cost = _sell_cost(qty, exit_price, cost_model)
              dp_once = cost_model["dp_charge_flat"] + cost_model["dp_charge_flat"] * cost_model["gst_pct"]
              total_cost = entry_cost + sell_cost + dp_once
              net_pnl = gross_pnl - total_cost
              return {
                  "symbol": symbol, "entry_ts": entry_label, "exit_ts": exit_label, "exit_reason": exit_reason,
                  "gross_pnl": gross_pnl, "net_pnl": net_pnl, "total_cost": total_cost, "held_days": held_days,
              }


          def replay_symbol_via_live_code(symbol, df, risk_pct, capital, cost_model):
              """Calls main.gap_and_go_entry_signal/main.gap_and_go_exit_reason
              directly - the REAL live functions, not a reimplementation."""
              trades = []
              df = df.reset_index(drop=True)
              n = len(df)
              dates = df["Date"].astype(str).to_numpy()
              position = None

              for i in range(n):
                  window = df.iloc[max(0, i - WINDOW_BARS + 1): i + 1]

                  if position is not None:
                      reason = m.gap_and_go_exit_reason(
                          window, position["entry_day"], position["stop_loss"], position["gap_low"]
                      )
                      if reason:
                          exit_price = float(df["Close"].iloc[i])
                          held_days = i - position["entry_idx"]
                          trades.append(_finalize_trade(
                              symbol, position["entry_price"], position["stop_loss"], position["qty"],
                              position["entry_label"], exit_price, dates[i], reason,
                              position["entry_cost"], held_days, cost_model,
                          ))
                          position = None
                      continue

                  signal = m.gap_and_go_entry_signal(window)
                  if signal is None:
                      continue

                  entry_price = signal["entry_price"]
                  stop_loss = signal["stop_loss"]
                  stop_dist = entry_price - stop_loss
                  if stop_dist <= 0:
                      continue

                  usable_capital_inr = min(capital, capital / m.CAPITAL_TRANCHES)
                  risk_amount_inr = usable_capital_inr * risk_pct / 100
                  qty = risk_amount_inr / stop_dist
                  qty = min(qty, usable_capital_inr / entry_price)
                  qty = int(np.floor(qty))
                  if qty <= 0 or qty * entry_price < 100:
                      continue

                  position = {
                      "entry_price": entry_price, "stop_loss": stop_loss, "gap_low": signal["gap_low"],
                      "entry_idx": i, "entry_day": dates[i], "entry_label": dates[i], "qty": qty,
                      "entry_cost": _entry_cost(qty, entry_price, cost_model),
                  }

              if position is not None:
                  held_days = (n - 1) - position["entry_idx"]
                  trades.append(_finalize_trade(
                      symbol, position["entry_price"], position["stop_loss"], position["qty"],
                      position["entry_label"], float(df["Close"].iloc[-1]), dates[-1], "data_end_forced_close",
                      position["entry_cost"], held_days, cost_model,
                  ))

              return trades


          def _metrics_row(trades):
              if not trades:
                  return dict(n=0, win_rate=0.0, pf_net=0.0, pf_gross=0.0, avg_net=0.0, avg_gross=0.0, cost_drag_pct=0.0, avg_held_days=0.0)
              n = len(trades)
              wins = [t for t in trades if t["net_pnl"] > 0]
              losses = [t for t in trades if t["net_pnl"] <= 0]
              win_rate = 100 * len(wins) / n
              gw = sum(t["net_pnl"] for t in wins)
              gl = -sum(t["net_pnl"] for t in losses)
              pf_net = (gw / gl) if gl > 0 else float("inf")
              wins_g = [t for t in trades if t["gross_pnl"] > 0]
              losses_g = [t for t in trades if t["gross_pnl"] <= 0]
              gwg = sum(t["gross_pnl"] for t in wins_g)
              glg = -sum(t["gross_pnl"] for t in losses_g)
              pf_gross = (gwg / glg) if glg > 0 else float("inf")
              avg_net = sum(t["net_pnl"] for t in trades) / n
              avg_gross = sum(t["gross_pnl"] for t in trades) / n
              total_cost = sum(t["total_cost"] for t in trades)
              cost_drag_pct = 100 * total_cost / max(1, sum(abs(t["gross_pnl"]) for t in trades))
              avg_held_days = sum(t["held_days"] for t in trades) / n
              return dict(n=n, win_rate=win_rate, pf_net=pf_net, pf_gross=pf_gross,
                          avg_net=avg_net, avg_gross=avg_gross, cost_drag_pct=cost_drag_pct,
                          avg_held_days=avg_held_days)

          def _print_row(label, row):
              print(f"{label:>28} {row['n']:>6} {row['win_rate']:>6.1f}% {row['pf_net']:>7.2f} "
                    f"{row['pf_gross']:>8.2f} {row['avg_net']:>10.2f} {row['avg_gross']:>10.2f} "
                    f"{row['cost_drag_pct']:>9.1f}% {row['avg_held_days']:>8.1f}d")

          print(f"SWING_WATCHLIST size (from live main.py): {len(m.SWING_WATCHLIST)}")
          print(f"SWING_GAP_PCT_THRESHOLD={m.SWING_GAP_PCT_THRESHOLD} SWING_VOL_MULT={m.SWING_VOL_MULT} "
                f"SWING_ATR_STOP_MULT={m.SWING_ATR_STOP_MULT} SWING_MAX_HOLD_DAYS={m.SWING_MAX_HOLD_DAYS}")
          assert len(m.SWING_WATCHLIST) == 52, "SWING_WATCHLIST drifted from the validated 52-symbol universe"

          print(f"--- Fetching {len(m.SWING_WATCHLIST)} symbols ({INTERVAL}, {PERIOD}) via live code ---")
          all_trades = []
          skipped = 0
          for sym in m.SWING_WATCHLIST:
              cfg = m.NSE_STOCK_PARAM_OVERRIDES.get(sym, m.NSE_STOCK_DEFAULT_PARAMS)
              try:
                  raw = m.fetch_ohlc(sym, PERIOD, INTERVAL)
              except Exception:
                  skipped += 1
                  continue
              if raw is None or len(raw) < 100:
                  skipped += 1
                  continue
              try:
                  trades = replay_symbol_via_live_code(sym, raw, cfg["risk_pct"], CAPITAL_INR, DEFAULT_COST_MODEL)
              except Exception as e:
                  print(f"ERROR {sym}: {e}")
                  continue
              all_trades.extend(trades)
          print(f"  fetched {len(m.SWING_WATCHLIST) - skipped}/{len(m.SWING_WATCHLIST)} symbols, {len(all_trades)} trades\n")

          header = (f"{'bucket':>28} {'n':>6} {'win%':>7} {'PFnet':>7} {'PFgross':>8} "
                    f"{'avgNet':>10} {'avgGross':>10} {'costDrag%':>10} {'avgHeld':>9}")

          print("=== OVERALL (via live main.gap_and_go_entry_signal/exit_reason) ===")
          print(header)
          overall = _metrics_row(all_trades)
          _print_row("ALL", overall)

          print("\n=== BY EXIT REASON ===")
          print(header)
          for reason in sorted(set(t["exit_reason"] for t in all_trades)):
              _print_row(reason, _metrics_row([t for t in all_trades if t["exit_reason"] == reason]))

          print("\n=== COMPARISON TO VALIDATED RESEARCH RESULT (run 35062601024) ===")
          print(f"  validated: n=142, PFnet=1.65, PFgross=2.06")
          print(f"  this run:  n={overall['n']}, PFnet={overall['pf_net']:.2f}, PFgross={overall['pf_gross']:.2f}")
          PYEOF

name: RVNL SAIL Exit Probe

# One-off read-only probe (2026-10-06): why were RVNL/SAIL swing positions
# acted on near the 3:14pm IST intraday square-off? Reads the token-free
# /real-order-log and prints only state-transition rows for those two symbols.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS --retry 3 --retry-delay 10 -m 90 "https://tv-paper-bot-gdan.onrender.com/real-order-log?days=3" -o /tmp/l.json || true
          python3 - <<'PY'
          import json, datetime
          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          d = json.load(open("/tmp/l.json"))
          ev = d.get("events", [])
          print("total events", len(ev))
          for e in sorted(ev, key=lambda e: e["ts"]):
              if any(k in (e.get("symbol") or "") for k in ("RVNL", "SAIL")):
                  t = datetime.datetime.fromtimestamp(e["ts"], IST).strftime("%m-%d %H:%M:%S IST")
                  print(t, e["symbol"], e["leg"], e["event"], "|", (e.get("prev_state") or "")[:80], "->", (e.get("new_state") or "")[:80], "|", (e.get("detail") or "")[:160])
          PY

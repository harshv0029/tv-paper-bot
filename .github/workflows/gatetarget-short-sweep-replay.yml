name: swingminrr gatetarget short candle-size x ATR sweep (B-1010)

# Backlog B-1010. Research only (NOT wired). Sweeps main.SWINGMINRR_GATETARGET_SHORT_1H_TAG's rule across 4h (1h x 730d
# resampled by scripts/resample_4h.py), 15m (60d) and 5m (60d) x ATR {2,3,4,6}, calling the REAL main.py functions
# (brk20_min_rr_entry_signal + swingminrr_gate_short_exit_reason). Full universe (main._load_nse_universe_from_file()),
# 0.8% cost, stop on every trade. Sharded matrix (default 8 + 16 + 24 = 48 jobs): research matrix, dispatch ONLY when no
# Deploy Gate / safety run is queued. Output artifact gts-all (gts_all.json, rows[].metrics shape of tsm_all.json).
on:
  workflow_dispatch:
    inputs:
      atrs:
        description: "ATR multiples, comma separated"
        default: "2,3,4,6"
      rr:
        description: "min room/risk and target multiple"
        default: "4"
      hold:
        description: "max hold in bars of the candle in use"
        default: "30"
      nshards_4h:
        description: "Shards for 4h"
        default: "8"
      nshards_15m:
        description: "Shards for 15m"
        default: "16"
      nshards_5m:
        description: "Shards for 5m"
        default: "24"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: p
        env:
          NSHARDS_4H: ${{ inputs.nshards_4h }}
          NSHARDS_15M: ${{ inputs.nshards_15m }}
          NSHARDS_5M: ${{ inputs.nshards_5m }}
        run: |
          echo "matrix=$(python3 scripts/gatetarget_short_sweep_replay.py plan)" >> "$GITHUB_OUTPUT"

  replay:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Replay (real main.py functions)
        env:
          TF: ${{ matrix.tf }}
          SHARD: ${{ matrix.shard }}
          NSHARDS: ${{ matrix.nshards }}
          ATRS: ${{ inputs.atrs }}
          RR: ${{ inputs.rr }}
          HOLD: ${{ inputs.hold }}
        run: python3 scripts/gatetarget_short_sweep_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: gts-${{ matrix.tf }}-s${{ matrix.shard }}
          path: out/

  aggregate:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: gts-*
          merge-multiple: true
      - name: Merge shards (exact, from raw sums)
        run: python3 scripts/gatetarget_short_sweep_replay.py merge out
      - uses: actions/upload-artifact@v4
        with:
          name: gts-all
          path: out/gts_all.json

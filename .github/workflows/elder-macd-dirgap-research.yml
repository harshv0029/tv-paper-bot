name: Elder MACD, directional and gap research (B-582 to B-585 B-588 B-589 B-591 B-592 B-594 to B-597)

# Elder, "Trading for a Living": three families (macd, dirsys, gaps), one matrix job each x 4
# shards (12 jobs; dispatch only when no Deploy Gate / safety run is queued).
# FULL universe via main._load_nse_universe_from_file(), daily bars by default,
# BOTH directions, ATR stop sweep 1.5/2/3 with a stop on every trade, 0.8% round-trip
# cost. Every (variant, direction, ATR) cell is its own tag per the naming grammar.
# Candle-size sweep: re-dispatch with interval=1h (yfinance 730d) / 15m / 5m (60d).
# Bar-count constants (30-bar max hold, indicator windows) change meaning with the
# interval; 4h needs a 1h resample that is not built yet (owed, not skipped).
# Research only: no live wiring. A new workflow file cannot be dispatched until it
# is on main.
on:
  workflow_dispatch:
    inputs:
      interval:
        description: "Candle size (1d, 1h, 15m, 5m)"
        required: false
        default: "1d"
      period:
        description: "yfinance period (1d: 5y; 1h: 730d; 15m/5m: 60d)"
        required: false
        default: "5y"

jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: [macd, dirsys, gaps]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Run family shard
        run: |
          python3 scripts/elder_macd_dirgap_research.py \
            --family "${{ matrix.family }}" --shard ${{ matrix.shard }} --nshards 4 \
            --interval "${{ inputs.interval }}" --period "${{ inputs.period }}" --out out/
      - uses: actions/upload-artifact@v4
        with:
          name: elderb-${{ matrix.family }}-${{ matrix.shard }}
          path: out/

  merge:
    needs: research
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: elderb-*
          merge-multiple: true
      - name: Merge shards and print per-tag table
        run: |
          set -o pipefail
          python3 scripts/elder_macd_dirgap_research.py --merge shards --json elderb_results.json | tee elderb_table.txt
      - uses: actions/upload-artifact@v4
        with:
          name: elder-macd-dirgap-results
          path: |
            elderb_results.json
            elderb_table.txt

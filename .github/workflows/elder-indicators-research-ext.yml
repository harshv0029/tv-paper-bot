name: Elder indicators research batch 2 (B-625 B-647 B-650 B-658 B-663 B-668 B-697 B-705 B-716 B-723)

# Elder, "Trading for a Living": ten more indicator families (incl. profit_protect: B-738 B-739 B-770) (williams_r, stoch_slow,
# rsi, volume, ad_line, force_index, macdh, channel, parabolic), one matrix job each x 3
# shards (30 research jobs + 1 merge = 31, under the ~40 matrix cap; was 4 shards = 41; dispatch only when no Deploy Gate / safety run is queued and after the
# batch-1 elder-indicators-research run has finished). FULL universe via
# main._load_nse_universe_from_file(), daily bars by default, BOTH directions, ATR stop
# sweep 1.5/2/3 with a stop on every trade, 0.8% round-trip cost. Every
# (variant, direction, ATR) cell is its own tag per the naming grammar.
# Candle-size sweep: re-dispatch with interval=1h (730d) / 15m / 5m (60d). Bar-count
# constants change meaning with the interval; 4h needs a 1h resample (owed, not built).
# Research only: no live wiring. A new workflow file cannot be dispatched until on main.
on:
  workflow_dispatch:
    inputs:
      interval:
        description: "Candle size (1d, 1h, 15m, 5m)"
        required: false
        default: "1d"
      period:
        description: "yfinance period (1d: 5y; 1h: 730d; 15m/5m: 60d)"
        required: false
        default: "5y"

jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: [williams_r, stoch_slow, rsi, volume, ad_line, force_index, macdh, channel, parabolic, profit_protect]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Run family shard
        run: |
          python3 scripts/elder_indicators_research_ext.py \
            --family "${{ matrix.family }}" --shard ${{ matrix.shard }} --nshards 3 \
            --interval "${{ inputs.interval }}" --period "${{ inputs.period }}" --out out/
      - uses: actions/upload-artifact@v4
        with:
          name: elderx-${{ matrix.family }}-${{ matrix.shard }}
          path: out/

  merge:
    needs: research
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: elderx-*
          merge-multiple: true
      - name: Merge shards and print per-tag table
        run: |
          set -o pipefail
          python3 scripts/elder_indicators_research_ext.py --merge shards --json elderx_results.json | tee elderx_table.txt
      - uses: actions/upload-artifact@v4
        with:
          name: elder-indicators-ext-results
          path: |
            elderx_results.json
            elderx_table.txt

name: Fair Value Gap Backtest (research)

# Explicit user order 2026-09-21: "Implement this strategy and get this
# backtesting done" (FVG/Smart Money Concepts spec), followed by "What was
# result on historical data?" - this is that real backtest, run on THIS
# feature branch (not main - the strategy is not merged/live yet), so it
# can answer the question without needing a deploy or a merge decision
# first. Same evidence discipline every other strategy in this repo has
# been held to: real market data, judged on pct_profitable_combos +
# median_total_pnl across a parameter grid, not one cherry-picked combo.
# Read-only, writes nothing, changes no live trading behavior.
#
# Grid: fvg_displacement_atr_mult (1.0/1.5/2.0) x fvg_volume_mult
# (1.0/1.5/2.0) x fvg_expiry_bars (20/50/100) = 27 combos, against the same
# evidenced-symbol spread mtf-engulfing-backtest.yml used (RELIANCE/TCS/
# TITAN/DIVISLAB + NIFTY/BANKNIFTY), 60d of real 5-min data (yfinance's own
# intraday window). Imports main.py directly - calls its own
# add_strategy_signal/extract_trades_fast, not a reimplementation.
on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run fair_value_gap backtest grid
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import main as m
          import numpy as np
          from itertools import product

          SYMBOLS = ["RELIANCE.NS", "TCS.NS", "TITAN.NS", "DIVISLAB.NS", "^NSEI", "^NSEBANK"]
          DISP_LIST = [1.0, 1.5, 2.0]
          VOL_LIST = [1.0, 1.5, 2.0]
          EXPIRY_LIST = [20, 50, 100]
          COMBOS = [
              {"fvg_displacement_atr_mult": d, "fvg_volume_mult": v, "fvg_expiry_bars": e}
              for d, v, e in product(DISP_LIST, VOL_LIST, EXPIRY_LIST)
          ]

          rows = []
          for sym in SYMBOLS:
              try:
                  df = m.fetch_ohlc(sym, "60d", "5m")
              except Exception as e:
                  print(f"SKIP {sym}: fetch failed - {e}")
                  continue

              results = []
              for params in COMBOS:
                  sig_df = m.add_strategy_signal(df, "fair_value_gap", params)
                  long_arr = sig_df["long"].to_numpy()
                  close_arr = sig_df["Close"].to_numpy(dtype=float)
                  dates = sig_df["Date"].apply(lambda d: d.isoformat()).to_numpy()
                  trades, _ = m.extract_trades_fast(long_arr, close_arr, dates, 1)
                  if not trades:
                      continue
                  wins = [t for t in trades if t["pnl"] > 0]
                  total_pnl = round(sum(t["pnl"] for t in trades), 2)
                  results.append({
                      "params": params, "num_trades": len(trades),
                      "win_rate_pct": round(100 * len(wins) / len(trades), 1),
                      "total_pnl": total_pnl,
                  })

              if not results:
                  print(f"{sym}: 0/{len(COMBOS)} fair_value_gap combos produced any trades - no signal at all")
                  continue

              all_pnls = [r["total_pnl"] for r in results]
              pct_profitable = round(100 * sum(1 for p in all_pnls if p > 0) / len(all_pnls), 1)
              median_pnl = round(float(np.median(all_pnls)), 2)
              best = max(results, key=lambda r: r["total_pnl"])
              rows.append({"symbol": sym, "pct_profitable_combos": pct_profitable,
                           "median_total_pnl": median_pnl, "num_combos_with_trades": len(results)})
              print(f"[fair_value_gap] {sym}: {pct_profitable}% of {len(results)}/{len(COMBOS)} combos profitable, "
                    f"median {median_pnl}, best {best['params']} -> pnl {best['total_pnl']}, "
                    f"win_rate {best['win_rate_pct']}%, {best['num_trades']} trades")

          print()
          print("=== VERDICT (same bar as other strategy sweeps: >=75% combos profitable AND median > 0) ===")
          for r in sorted(rows, key=lambda r: r["pct_profitable_combos"], reverse=True):
              verdict = "CLEARS BAR" if r["pct_profitable_combos"] >= 75 and r["median_total_pnl"] > 0 else "does not clear"
              print(f"{r['symbol']}: {verdict} ({r['pct_profitable_combos']}% profitable, median {r['median_total_pnl']}, "
                    f"{r['num_combos_with_trades']} combos with trades)")
          if not rows:
              print("No symbol produced any trades at all across the full grid.")
          PYEOF

name: WCTC-style Volatility Breakout Signal (research)

# Research-only, read-only pass (2026-09-22), explicit user instruction:
# after reviewing top-10 real-world trading competitions, backtest
# strategy ideas actually inspired by their PUBLIC winning patterns - not
# fabricated rules attributed to specific undisclosed systems. This is
# idea 1 of 3 ("try each one but one by one, with its variants in mind").
#
# Larry Williams (WCTC 1987, 11,376% audited return - the most-cited
# result in trading-championship history) has PUBLICLY documented his
# "volatility breakout" concept (see "Long-Term Secrets to Short-Term
# Trading"): go long when price crosses ABOVE
#   today's session open + k * (yesterday's full-session High-Low range)
# i.e. a breakout threshold PROJECTED FROM THE PRIOR DAY'S RANGE, not
# today's own opening-range high (that's orb_breakout/universal_score,
# already live) and not today's OR-high + volume/VWAP (that's the
# separate range-breakout-momentum-research.yml signal). This is a
# genuinely distinct signal family from both.
#
# Three k variants tested in ONE pass (explicit user instruction: "with
# its variants in mind" - not a single blind guess): k=0.25 (tightest,
# most signals), k=0.50 (Williams' own most commonly cited value), k=0.75
# (loosest, fewest/highest-conviction signals). Chosen from Williams'
# published range and reasoning BEFORE running this test, not tuned
# after seeing a result.
#
# Entry (ALL required):
#   1. Yesterday's full-session (09:15-15:30 IST) High-Low range computed
#      from real 5m bars - skip a symbol's day if there's no valid prior
#      session in the fetched window.
#   2. threshold = today's first bar's Open + k * prev_range.
#   3. First 5m bar (after the open) whose CLOSE crosses above threshold -
#      only the FIRST breakout per symbol per day is taken, same
#      no-re-entry-chasing discipline as every other research signal here.
# Target: rr=2.0 R-multiple from entry (a plain, reasoned default -
# Williams' own system was originally an overnight hold, not applicable
# intraday-only, so this substitutes the same rr convention this repo's
# other research workflows already use rather than inventing a new one).
# Stop: entry_price * (1 - stop_pct/100), same convention as every other
# signal here, capped nowhere else (no structural level exists for a
# threshold-projected breakout the way an opening-range low is one).
# EOD squareoff backstop (915, matching main.py's own current live
# constant) retained.
# Same economic-viability gate (m._target_move_pct vs m.ROUND_TRIP_COST_PCT),
# same position sizing formula, same cost model, same 52-symbol/60-day/5m
# universe as every other research workflow in this repo - only the
# entry/exit mechanism (and its 3 k variants) changes, to keep this a fair
# like-for-like comparison.
#
# Does not call universal_score/orb_breakout signal code at all - reuses
# only pure data/cost plumbing from main.py (fetch_ohlc, symbol lists,
# ROUND_TRIP_COST_PCT gate, cost model). Read-only: no live parameter
# touched, nothing wired into main.py.

on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run volatility breakout backtest (3 k-variants)
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import numpy as np
          import pandas as pd
          import main as m

          OPEN_MIN = 555
          CLOSE_MIN = 930
          SQUAREOFF_MIN = 915
          TZ_OFF = m.IST_OFFSET_MIN
          INTERVAL = "5m"
          RR = 2.0
          K_VARIANTS = [0.25, 0.50, 0.75]

          DEFAULT_COST_MODEL = {
              "brokerage_pct": 0.0020, "brokerage_flat": 0.0,
              "exchange_txn_pct": 0.0000297, "sebi_fee_pct": 0.000001,
              "stamp_duty_buy_pct": 0.00015, "stt_buy_pct": 0.001, "stt_sell_pct": 0.001,
              "gst_pct": 0.18, "slippage_pct": 0.0005, "dp_charge_flat": 15.93,
          }


          def _prep(df):
              df = df.copy()
              ts = pd.to_datetime(df["Date"])
              ts_utc = ts.dt.tz_convert("UTC") if ts.dt.tz is not None else ts.dt.tz_localize("UTC")
              ts_local = ts_utc + pd.Timedelta(minutes=TZ_OFF)
              df = df.assign(ts_local=ts_local)
              df["date_local"] = df["ts_local"].dt.strftime("%Y-%m-%d")
              df["mins"] = df["ts_local"].dt.hour * 60 + df["ts_local"].dt.minute
              return df


          def _entry_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stamp = notional * cm["stamp_duty_buy_pct"]
              stt = notional * cm["stt_buy_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stamp + stt + gst + slippage


          def _sell_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stt = notional * cm["stt_sell_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stt + gst + slippage


          def _finalize_trade(symbol, entry_price, initial_stop, qty, entry_ts, exit_price, exit_ts,
                               exit_reason, entry_cost, cost_model, k):
              gross_pnl = (exit_price - entry_price) * qty
              sell_cost = _sell_cost(qty, exit_price, cost_model)
              dp_once = cost_model["dp_charge_flat"] + cost_model["dp_charge_flat"] * cost_model["gst_pct"]
              total_cost = entry_cost + sell_cost + dp_once
              net_pnl = gross_pnl - total_cost
              r = entry_price - initial_stop
              return {
                  "symbol": symbol, "k": k, "entry_ts": entry_ts, "exit_ts": exit_ts, "exit_reason": exit_reason,
                  "gross_pnl": gross_pnl, "net_pnl": net_pnl, "total_cost": total_cost,
                  "net_r": net_pnl / (r * qty) if r > 0 else None,
              }


          def replay_symbol(symbol, df, risk_pct, stop_pct, capital, cost_model, k):
              trades = []
              days = sorted(df["date_local"].unique())
              day_frames = {d: g.reset_index(drop=True) for d, g in df.groupby("date_local", sort=True)}

              for idx in range(1, len(days)):
                  prev_df = day_frames[days[idx - 1]]
                  day_df = day_frames[days[idx]]
                  if prev_df.empty or day_df.empty:
                      continue
                  prev_range = float(prev_df["High"].max() - prev_df["Low"].min())
                  if prev_range <= 0:
                      continue

                  open_mask = day_df["mins"] == day_df["mins"].min()
                  if not open_mask.any():
                      continue
                  today_open = float(day_df.loc[open_mask, "Open"].iloc[0])
                  threshold = today_open + k * prev_range

                  closes = day_df["Close"].to_numpy(dtype=float)
                  mins_arr = day_df["mins"].to_numpy(dtype=int)

                  position = None
                  day_traded = False

                  for i in range(len(day_df)):
                      mins = int(mins_arr[i])
                      if mins < OPEN_MIN or mins > CLOSE_MIN:
                          continue
                      last_close = float(closes[i])
                      last_ts = day_df["ts_local"].iloc[i].timestamp()

                      if position is not None:
                          is_squareoff = mins >= SQUAREOFF_MIN
                          exit_reason = None
                          exit_price = last_close
                          if last_close <= position["stop"]:
                              exit_reason = "stop_hit"
                          elif last_close >= position["target"]:
                              exit_reason = "target_hit"
                          elif is_squareoff:
                              exit_reason = "eod_squareoff"

                          if exit_reason:
                              trades.append(_finalize_trade(
                                  symbol, position["entry_price"], position["initial_stop"], position["qty"],
                                  position["entry_ts"], exit_price, last_ts, exit_reason,
                                  position["entry_cost"], cost_model, k,
                              ))
                              position = None
                          continue

                      if day_traded:
                          continue
                      if mins >= SQUAREOFF_MIN:
                          continue

                      breakout = last_close > threshold
                      if not breakout:
                          continue

                      day_traded = True  # only the first breakout attempt per day, win or lose

                      stop_loss = last_close * (1 - stop_pct / 100)
                      stop_dist = last_close - stop_loss
                      if stop_dist <= 0:
                          continue
                      target = last_close + RR * stop_dist
                      if target <= last_close:
                          continue

                      target_move_pct = m._target_move_pct(target, last_close)
                      if target_move_pct <= m.ROUND_TRIP_COST_PCT:
                          continue

                      usable_capital_inr = min(capital, capital / m.CAPITAL_TRANCHES)
                      risk_amount_inr = usable_capital_inr * risk_pct / 100
                      qty = risk_amount_inr / stop_dist
                      qty = min(qty, usable_capital_inr / last_close)
                      qty = int(np.floor(qty))
                      if qty <= 0 or qty * last_close < 100:
                          continue

                      position = {
                          "entry_price": last_close, "initial_stop": stop_loss, "stop": stop_loss,
                          "target": target, "entry_ts": last_ts, "qty": qty,
                          "entry_cost": _entry_cost(qty, last_close, cost_model),
                      }

                  if position is not None:
                      last_close = float(day_df["Close"].iloc[-1])
                      last_ts = day_df["ts_local"].iloc[-1].timestamp()
                      trades.append(_finalize_trade(
                          symbol, position["entry_price"], position["initial_stop"], position["qty"],
                          position["entry_ts"], last_close, last_ts, "window_end_forced_close",
                          position["entry_cost"], cost_model, k,
                      ))

              return trades


          EVIDENCED = sorted(m.NSE_STOCK_PARAM_OVERRIDES.keys())
          UNEVIDENCED_SAMPLE = [
              "ADANIPOWER.NS", "ASIANPAINT.NS", "BAJAJ-AUTO.NS", "BEL.NS", "BHARTIARTL.NS", "BPCL.NS",
              "BRITANNIA.NS", "COALINDIA.NS", "DABUR.NS", "DRREDDY.NS", "EICHERMOT.NS", "HAL.NS",
              "HCLTECH.NS", "HDFCBANK.NS", "HDFCLIFE.NS", "ICICIGI.NS", "ICICIPRULI.NS", "IOC.NS",
              "IRFC.NS", "JINDALSTEL.NS", "KOTAKBANK.NS", "LT.NS", "LUPIN.NS", "MARICO.NS",
              "MOTHERSON.NS", "NESTLEIND.NS", "PNB.NS", "POLYCAB.NS", "SBIN.NS", "SRF.NS",
              "SUNPHARMA.NS", "TATACONSUM.NS", "TATAPOWER.NS", "TATASTEEL.NS", "TORNTPHARM.NS",
              "UBL.NS", "UPL.NS", "VEDL.NS", "WIPRO.NS", "ZYDUSLIFE.NS",
          ]
          SYMBOLS = sorted(set(EVIDENCED) | set(UNEVIDENCED_SAMPLE))
          CAPITAL_INR = 400000.0

          def _metrics_row(trades):
              if not trades:
                  return dict(n=0, win_rate=0.0, pf_net=0.0, pf_gross=0.0, avg_net=0.0, avg_gross=0.0, cost_drag_pct=0.0)
              n = len(trades)
              wins = [t for t in trades if t["net_pnl"] > 0]
              losses = [t for t in trades if t["net_pnl"] <= 0]
              win_rate = 100 * len(wins) / n
              gw = sum(t["net_pnl"] for t in wins)
              gl = -sum(t["net_pnl"] for t in losses)
              pf_net = (gw / gl) if gl > 0 else float("inf")
              wins_g = [t for t in trades if t["gross_pnl"] > 0]
              losses_g = [t for t in trades if t["gross_pnl"] <= 0]
              gwg = sum(t["gross_pnl"] for t in wins_g)
              glg = -sum(t["gross_pnl"] for t in losses_g)
              pf_gross = (gwg / glg) if glg > 0 else float("inf")
              avg_net = sum(t["net_pnl"] for t in trades) / n
              avg_gross = sum(t["gross_pnl"] for t in trades) / n
              total_cost = sum(t["total_cost"] for t in trades)
              cost_drag_pct = 100 * total_cost / max(1, sum(abs(t["gross_pnl"]) for t in trades))
              return dict(n=n, win_rate=win_rate, pf_net=pf_net, pf_gross=pf_gross,
                          avg_net=avg_net, avg_gross=avg_gross, cost_drag_pct=cost_drag_pct)

          def _print_row(label, row):
              print(f"{label:>28} {row['n']:>6} {row['win_rate']:>6.1f}% {row['pf_net']:>7.2f} "
                    f"{row['pf_gross']:>8.2f} {row['avg_net']:>10.2f} {row['avg_gross']:>10.2f} {row['cost_drag_pct']:>9.1f}%")

          print(f"--- Fetching {len(SYMBOLS)} symbols ({INTERVAL}, 60d) ---")
          per_symbol_df = {}
          skipped = 0
          for sym in SYMBOLS:
              try:
                  raw = m.fetch_ohlc(sym, "60d", INTERVAL)
              except Exception:
                  skipped += 1
                  continue
              if raw is None or len(raw) < 100:
                  skipped += 1
                  continue
              per_symbol_df[sym] = _prep(raw)
          print(f"  fetched {len(per_symbol_df)}/{len(SYMBOLS)} symbols\n")

          header = f"{'bucket':>28} {'n':>6} {'win%':>7} {'PFnet':>7} {'PFgross':>8} {'avgNet':>10} {'avgGross':>10} {'costDrag%':>10}"

          all_trades_by_k = {}
          for k in K_VARIANTS:
              all_trades = []
              for sym, df in per_symbol_df.items():
                  cfg = m.NSE_STOCK_PARAM_OVERRIDES.get(sym, m.NSE_STOCK_DEFAULT_PARAMS)
                  try:
                      trades = replay_symbol(sym, df, cfg["risk_pct"], cfg["stop_pct"], CAPITAL_INR, DEFAULT_COST_MODEL, k)
                  except Exception as e:
                      print(f"ERROR {sym} k={k}: {e}")
                      continue
                  all_trades.extend(trades)
              all_trades_by_k[k] = all_trades

          print("=== OVERALL, BY k-VARIANT ===")
          print(header)
          for k in K_VARIANTS:
              _print_row(f"k={k}", _metrics_row(all_trades_by_k[k]))

          for k in K_VARIANTS:
              trades = all_trades_by_k[k]
              print(f"\n=== k={k}: BY EXIT REASON ===")
              print(header)
              for reason in sorted(set(t["exit_reason"] for t in trades)):
                  _print_row(reason, _metrics_row([t for t in trades if t["exit_reason"] == reason]))

              print(f"\n=== k={k}: BY SYMBOL (n>=3, sorted by gross PF) ===")
              print(header)
              per_symbol = {}
              for t in trades:
                  per_symbol.setdefault(t["symbol"], []).append(t)
              symbol_rows = [(sym, _metrics_row(sts)) for sym, sts in per_symbol.items() if len(sts) >= 3]
              symbol_rows.sort(key=lambda x: x[1]["pf_gross"], reverse=True)
              for sym, row in symbol_rows[:15]:
                  _print_row(sym, row)
          PYEOF

name: chan_shape LONG 1d main.py-function replay (B-965)

# Backlog B-965. Replays EVERY pooled tag of the family (main.CHAN_SHAPE_CELLS, 6 ATR x hold cells) by IMPORTING and CALLING the real main.py
# functions (main.chan_shape_long_entry_signal, main.chan_shape_exit_reason) on the FULL universe (main._load_nse_universe_from_file(), not main.NSE_FULL_UNIVERSE),
# cost = main.ROUND_TRIP_COST_PCT (0.8%), strict FIFO per symbol per tag. The merged docs row schema is what
# main._replay_verified_tags() reads: commit the merged JSON as docs/backtest_data/chan_shape_main_replay_run_<run id>.json.
# Until a file clearing the floor (n >= 30) is on file the tags stay in REPLAY_OWED_TAGS (real-money gate closed).
# Long only (short mirror is its own registered tag family). Validation only; wires nothing, no kill switch.
# Registry *_y2021/_y2023 tags are calendar-year slices of the same rule and are NOT replayed (cannot be traded forward).
on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - env:
          FAMILY: chan_shape
          SHARD: ${{ matrix.shard }}
          NSHARDS: "8"
        run: python3 scripts/chan_shape_macddiv_main_replay.py run
      - uses: actions/upload-artifact@v4
        with:
          name: chan_shape-main-replay-s${{ matrix.shard }}
          path: out/
          retention-days: 7

  merge:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: chan_shape-main-replay-s*
          merge-multiple: true
      - run: python3 scripts/chan_shape_macddiv_main_replay.py merge shards chan_shape_all.json | tee chan_shape_table.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chan_shape-main-replay-results
          path: |
            chan_shape_all.json
            chan_shape_table.txt

name: brk20_min_rr main.py-function replay (B-798)

# Backlog B-798. Replays the 20-bar-breakout + minimum reward:risk strategy (research: Douglas/Elder trade-mgmt
# run 38174269343, trademgmt_exit__brk20_min_rr__<dir>__1d__atr*_rr*__v1) by IMPORTING and CALLING the real
# main.brk20_min_rr_entry_signal / main.brk20_min_rr_exit_reason on the FULL universe
# (main._load_nse_universe_from_file()). ATR stop is attached to every trade. Both directions (the short
# mirror is its own tag). Cost = main.ROUND_TRIP_COST_PCT. NOT wired into any live scan.
#
# Matrix = interval x direction x shard (<= 40 jobs). Each job replays every (atr x rr x be) cell, so the
# default sweep = atr {3,4} x rr {3,3.5,4} x be {none, 1R} = 12 cells, covering the backlog cells atr3_rr4 and
# atr3_rr3, the neighbours atr3_rr3.5 / atr4_rr4 (hypothesis-driven sweep to rule out thin-sample luck on the
# short n=275 cell), and breakeven-at-1R. Add be values (e.g. "none,0.5,1,1.5,2") for the breakeven neighbours.
# Output: out/brk20_all.json (every metric per tag: n, win %, pfnet, pfgross, avg net/gross %, avg held BARS,
# exit-reason breakdown, nothing trimmed) + per-shard raw sums, uploaded as artifacts.
# Bar-count constants are BARS of the chosen interval (1h/15m: hours/quarter-hours, not days); yfinance caps
# 1h at 730d and 15m at 60d, so intraday cells have far fewer bars than 1d. 4h needs a 1h resample (owed).
# Dispatch order per CLAUDE.md: big matrix, only when no gate/safety run is queued.
on:
  workflow_dispatch:
    inputs:
      intervals:
        description: "Comma list of candle sizes (1d,1h,15m,5m)"
        default: "1d,1h,15m"
      directions:
        description: "long,short (short = the mirror, registered as its own tag)"
        default: "long,short"
      atrs:
        description: "ATR stop multiples (comma list)"
        default: "3,4"
      rrs:
        description: "Minimum reward:risk values (comma list)"
        default: "3,3.5,4"
      bes:
        description: "Breakeven-at-R values; 'none' = no ratchet (comma list, e.g. none,0.5,1,1.5,2)"
        default: "none,1"
      nshards:
        description: "Universe shards per (interval, direction)"
        default: "6"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: p
        env:
          INTERVALS: ${{ inputs.intervals }}
          DIRECTIONS: ${{ inputs.directions }}
          ATRS: ${{ inputs.atrs }}
          RRS: ${{ inputs.rrs }}
          BES: ${{ inputs.bes }}
          NSHARDS: ${{ inputs.nshards }}
        run: echo "matrix=$(python3 scripts/brk20_plan.py)" >> "$GITHUB_OUTPUT"

  replay:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Replay (real main.py functions)
        env:
          INTERVAL: ${{ matrix.interval }}
          DIRECTION: ${{ matrix.direction }}
          SHARD: ${{ matrix.shard }}
          NSHARDS: ${{ matrix.nshards }}
          CELLS: ${{ matrix.cells }}
        run: python3 scripts/brk20_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: brk20-${{ matrix.interval }}-${{ matrix.direction }}-s${{ matrix.shard }}
          path: out/

  aggregate:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: brk20-*
          merge-multiple: true
      - name: Merge shards (exact, from raw sums)
        run: python3 scripts/brk20_replay.py merge out
      - uses: actions/upload-artifact@v4
        with:
          name: brk20-all
          path: out/brk20_all.json

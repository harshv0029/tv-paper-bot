name: NSE Universe Sweep - Batch 2 (research)

# Explicit user instruction 2026-09-09 ("all of ur trades entered are
# giving me losses... cant you do the research for making me
# profitable"). Root cause found live: WATCHLIST runs the ENTIRE
# NSE_FULL_UNIVERSE (~2,655 symbols, docs/nse_universe.json) on
# orb_breakout's untuned default params (NSE_STOCK_DEFAULT_PARAMS) -
# only 5 individual stocks (RELIANCE/TCS/ICICIBANK/INFY/MARUTI, see
# NSE_STOCK_PARAM_OVERRIDES in main.py) have ever been swept and shown
# real evidence of edge. Today's live losers (MEDICAMEQ/SILVERCASE/
# DCMSIL/GROWWSLVR) are all untested micro-caps that turned out to be
# T2T-restricted too.
#
# This is Batch 2 of the SAME evidence-gathering sweep that already
# qualified those 5 stocks + MARUTI (18-combo grid: orb_minutes
# 10/15/30 x sma_fast 5/9/14 x sma_slow 21/50, 60d of real 5-min data,
# strategy=orb_breakout - identical methodology, not a new one) -
# applied to the next batch of liquid, well-known Nifty 50/Next 50
# names that haven't been swept yet (HDFCBANK/HINDUNILVR/BHARTIARTL/
# KOTAKBANK/LT/AXISBANK/ASIANPAINT/SBIN/BAJFINANCE were ALSO already
# done in an earlier batch - see main.py's own comment above
# NSE_STOCK_PARAM_OVERRIDES).
#
# Same evidence bar as before: NOT the single best combo (curve-fit
# risk on one historical window) but pct_profitable_combos and
# median_total_pnl too, so a real, repeatable edge across nearby
# params. Imports main.py directly and calls its OWN
# add_strategy_signal/extract_trades_fast (the exact functions
# GET /sweep itself uses) - not a reimplementation that could drift
# from what's actually live. Read-only research - writes nothing to
# any repo file, touches no live state, safe to run anytime.
#
# TATAMOTORS.NS deliberately excluded (Yahoo 404s that ticker as of
# 2026-09-03, per trailing-stop-threshold-backtest.yml's own SKIP log).
on:
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run batch-2 sweep
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import main as m
          import numpy as np
          from itertools import product

          SYMBOLS = [
              "HCLTECH.NS", "SUNPHARMA.NS", "TITAN.NS", "ULTRACEMCO.NS", "WIPRO.NS",
              "NESTLEIND.NS", "BAJAJFINSV.NS", "POWERGRID.NS", "NTPC.NS", "TATASTEEL.NS",
              "INDUSINDBK.NS", "JSWSTEEL.NS", "COALINDIA.NS", "ITC.NS", "GRASIM.NS",
          ]
          OM_LIST = [10, 15, 30]
          SF_LIST = [5, 9, 14]
          SS_LIST = [21, 50]
          COMBOS = [
              {"orb_minutes": om, "sma_fast": sf, "sma_slow": ss}
              for om, sf, ss in product(OM_LIST, SF_LIST, SS_LIST) if sf < ss
          ]

          rows = []
          for sym in SYMBOLS:
              try:
                  df = m.fetch_ohlc(sym, "60d", "5m")
              except Exception as e:
                  print(f"SKIP {sym}: fetch failed - {e}")
                  continue

              results = []
              for params in COMBOS:
                  sig_df = m.add_strategy_signal(df, "orb_breakout", params)
                  long_arr = sig_df["long"].to_numpy()
                  close_arr = sig_df["Close"].to_numpy(dtype=float)
                  dates = sig_df["Date"].apply(lambda d: d.isoformat()).to_numpy()
                  trades, _ = m.extract_trades_fast(long_arr, close_arr, dates, 1)
                  if not trades:
                      continue
                  wins = [t for t in trades if t["pnl"] > 0]
                  total_pnl = round(sum(t["pnl"] for t in trades), 2)
                  results.append({
                      "params": params, "num_trades": len(trades),
                      "win_rate_pct": round(100 * len(wins) / len(trades), 1),
                      "total_pnl": total_pnl,
                  })

              if not results:
                  print(f"{sym}: 0/{len(COMBOS)} combos produced any trades - no signal at all, SKIP")
                  continue

              all_pnls = [r["total_pnl"] for r in results]
              pct_profitable = round(100 * sum(1 for p in all_pnls if p > 0) / len(all_pnls), 1)
              median_pnl = round(float(np.median(all_pnls)), 2)
              best = max(results, key=lambda r: r["total_pnl"])
              rows.append({
                  "symbol": sym, "pct_profitable_combos": pct_profitable,
                  "median_total_pnl": median_pnl, "combos_with_trades": len(results),
                  "combos_tested": len(COMBOS), "best": best,
              })
              print(f"{sym}: {pct_profitable}% of {len(results)}/{len(COMBOS)} combos profitable, "
                    f"median {median_pnl}, best {best['params']} -> pnl {best['total_pnl']}, "
                    f"win_rate {best['win_rate_pct']}%, {best['num_trades']} trades")

          print()
          print("=== VERDICT (same bar as the first batch: >=75% combos profitable AND median > 0) ===")
          for r in sorted(rows, key=lambda r: r["pct_profitable_combos"], reverse=True):
              verdict = "CLEARS BAR" if r["pct_profitable_combos"] >= 75 and r["median_total_pnl"] > 0 else "does not clear"
              print(f"{r['symbol']}: {verdict} ({r['pct_profitable_combos']}% profitable, median {r['median_total_pnl']})")
          PYEOF

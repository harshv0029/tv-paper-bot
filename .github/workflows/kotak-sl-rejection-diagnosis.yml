name: Kotak SL rejection diagnosis (read-only)

# B-285 (2026-10-07, user-approved read-only diagnosis): why do the 5 swing holdings
# (NYKAA, DRREDDY, GMRAIRPORT, INDHOTEL, RVNL) have no live resting SL? Prints, for
# those symbols only, Kotak's own SL/SL-M order rows (status + rejRsn) and the app's
# own order-log SL events. READ-ONLY: places/cancels nothing. Public repo: no raw
# account fields (no actId/PAN), only order status, reason text, qty and times.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Kotak order book + app order log
        env:
          KOTAK_NEO_API_TOKEN: ${{ secrets.KOTAK_NEO_API_TOKEN }}
        run: |
          B=https://tv-paper-bot-gdan.onrender.com
          curl -sS -m 90 "$B/health" || true; echo
          curl -sS --retry 3 --retry-delay 10 -m 90 "$B/kotak-neo/order-report?token=${KOTAK_NEO_API_TOKEN}" -o /tmp/o.json || true
          curl -sS --retry 3 --retry-delay 10 -m 90 "$B/real-order-log?days=2" -o /tmp/l.json || true
          python3 - <<'PY'
          import json, datetime
          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          S = ("NYKAA", "DRREDDY", "GMRAIRPORT", "INDHOTEL", "RVNL")
          try: rows = json.load(open("/tmp/o.json")).get("data") or []
          except Exception as e: rows = []; print("o unreadable", type(e).__name__)
          sel = [r for r in rows if any(s in str(r.get("trdSym", "")) for s in S) and str(r.get("trnsTp", "")).upper().startswith("S")]
          sel.sort(key=lambda r: str(r.get("ordDtTm", "")))
          print("SELL-side order rows for the 5 symbols:", len(sel))
          for r in sel:
              print("|".join(str(r.get(k, "")) for k in ("ordDtTm", "trdSym", "trnsTp", "prod", "prcTp", "qty", "prc", "trgPrc", "ordSt", "rejRsn", "rmk")))
          print("cols: ordDtTm|trdSym|trnsTp|prod|prcTp|qty|prc|trgPrc|ordSt|rejRsn|rmk")
          try: ev = json.load(open("/tmp/l.json")).get("events", [])
          except Exception as e: ev = []; print("l unreadable", type(e).__name__)
          print("app order-log events (2d):", len(ev))
          for e in sorted(ev, key=lambda e: e["ts"]):
              if any(s in (e.get("symbol") or "") for s in S):
                  t = datetime.datetime.fromtimestamp(e["ts"], IST).strftime("%m-%d %H:%M:%S IST")
                  print("LOG", t, e["symbol"], e.get("leg"), e.get("event"), "|", (e.get("new_state") or "")[:60], "|", (e.get("detail") or "")[:240])
          PY

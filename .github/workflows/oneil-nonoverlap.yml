name: O'Neil non-overlap + IS/OOS re-run (B-831 / B-833)

# Research only, read-only. Strict-FIFO (one position per symbol per cell) re-run with an IS/OOS split of the O'Neil
# extension cells >= 1.1 from oneil-ext-research.yml (scripts/oneil_nonoverlap.py reuses the unchanged detectors and
# simulate_x exit engine of scripts/oneil_ext_research.py). FULL universe via main._load_nse_universe_from_file(),
# 0.8% cost, ATR stop on every trade. New tags <old minus __v1>__nonovl__v2 / _nonovl_segis__v2 / _segoos__v2.
# Output JSON: PFnet net/gross, win %, avg hold, n, raw signals before FIFO, exit reasons, top-5 trades, PFnet ex top-5.
# Prepared dispatches (one at a time; matrix = 3 shards + 1 merge; check nothing urgent is queued first):
#   B-831: interval=1d cells=pivot_tight,leaders,exit_six mirror=false
#   B-833: interval=1w cells=shake1w mirror=false          (1w short oneil_shakeout plus3 pm2 h8, atr2/atr3)
#   B-1463: interval=1d cells=ext_main mirror=false families=   (then interval=1w, same inputs). main.py-calling
#           detectors (main.oneil_ext_signals) + exits (main.oneil_stop_price/oneil_exit_bar), long AND short listed
#           explicitly (mirror flag not needed), atr2/atr3 x every hold; tags ..._srcmain__nonovl__v2.
#   B-1468: interval=1d cells=ext_main families=oneil_rsscreen rs_universe=n200 (then interval=1w). RS ranked over
#           exactly main.SWING_WATCHLIST (the live swing population); every shard fetches the whole watchlist and
#           trades only its own slice; tags gain rsn200.
# Optional second pass for the both-directions rule: same inputs with mirror=true (separate tags).
# Candle size: the rules are defined on daily/weekly bars (bar-count constants re-derived per timeframe in EX); 1m-4h
# are not applicable and that is stated, not skipped silently.
on:
  workflow_dispatch:
    inputs:
      interval:
        description: "1d or 1w"
        default: "1d"
      cells:
        description: "Comma list: pivot_tight,leaders,exit_six (1d) / shake1w (1w); blank = default for the interval"
        default: ""
      mirror:
        description: "true = also run the opposite direction of every cell (separate tags)"
        default: "false"
      families:
        description: "ext_main only: comma list of O'Neil families to run (blank = all 11)"
        default: ""
      rs_universe:
        description: "full = RS ranked across the full-universe shard (default); n200 = RS ranked across the live swing watchlist (tags gain rsn200)"
        default: "full"
      band_cap:
        description: "B-1485 (ext_main, 1d): blank = off; trail = off + live + every trailing-stop overlay (each its own tag)"
        default: ""
      split_date:
        description: "IS/OOS boundary YYYY-MM-DD (entry before = IS). Blank = split_frac"
        default: ""
      split_frac:
        description: "In-sample fraction of each symbol's time span when split_date is blank"
        default: "0.6"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Run shard
        run: |
          set -o pipefail
          MIRROR=""
          if [ "${{ inputs.mirror }}" = "true" ]; then MIRROR="--mirror"; fi
          python3 scripts/oneil_nonoverlap.py run --tf "${{ inputs.interval }}" --shard ${{ matrix.shard }} --nshards 3 --cells "${{ inputs.cells }}" --families "${{ inputs.families }}" $MIRROR --split_date "${{ inputs.split_date }}" --split_frac "${{ inputs.split_frac }}" --rs_universe "${{ inputs.rs_universe || 'full' }}" --band_cap "${{ inputs.band_cap }}" --out out
      - uses: actions/upload-artifact@v4
        with:
          name: oneil-nonovl-${{ inputs.interval }}-${{ matrix.shard }}
          path: out/oneil_nonovl_*.json
          retention-days: 3

  merge:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Merge and print
        run: python3 scripts/oneil_nonoverlap.py merge shards --json oneil_nonoverlap_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: oneil-nonoverlap-results-${{ inputs.interval }}
          path: oneil_nonoverlap_results.json

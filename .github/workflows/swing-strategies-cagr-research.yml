                      elif closes[i] < position["gap_low"]:
                          exit_reason = "gap_filled"
                      elif held_days >= MAX_HOLD_DAYS:
                          exit_reason = "max_hold_timeout"
                      if exit_reason:
                          trades.append(_finalize_trade(
                              symbol, position["entry_price"], position["initial_stop"], position["qty"],
                              position["entry_label"], exit_price, dates[i], exit_reason,
                              position["entry_cost"], held_days, cost_model,
                          ))
                          position = None
                      continue

                  if i < min_lookback or i == 0:
                      continue
                  if np.isnan(atr[i]) or atr[i] <= 0 or np.isnan(vol_avg[i]) or np.isnan(gap_pct[i]):
                      continue

                  gapped_up = gap_pct[i] >= GAP_PCT_THRESHOLD
                  held_gap = closes[i] > opens[i]
                  closed_strong = closes[i] >= opens[i] + 0.5 * (highs[i] - opens[i])
                  vol_confirmed = volumes[i] > vol_avg[i] * VOL_MULT
                  if not (gapped_up and held_gap and closed_strong and vol_confirmed):
                      continue

                  entry_price = closes[i]
                  stop_loss = entry_price - ATR_STOP_MULT * atr[i]
                  stop_dist = entry_price - stop_loss
                  if stop_dist <= 0:
                      continue

                  usable_capital_inr = min(capital, capital / m.CAPITAL_TRANCHES)
                  risk_amount_inr = usable_capital_inr * risk_pct / 100
                  qty = risk_amount_inr / stop_dist
                  qty = min(qty, usable_capital_inr / entry_price)
                  qty = int(np.floor(qty))
                  if qty <= 0 or qty * entry_price < 100:
                      continue

                  position = {
                      "entry_price": entry_price, "initial_stop": stop_loss, "stop": stop_loss,
                      "entry_idx": i, "entry_label": dates[i], "qty": qty,
                      "entry_cost": _entry_cost(qty, entry_price, cost_model),
                      "gap_low": lows[i],
                  }

              if position is not None:
                  held_days = (n - 1) - position["entry_idx"]
                  trades.append(_finalize_trade(
                      symbol, position["entry_price"], position["initial_stop"], position["qty"],
                      position["entry_label"], closes[-1], dates[-1], "data_end_forced_close",
                      position["entry_cost"], held_days, cost_model,
                  ))

              return trades


          # ============================================================================
          # Symbol universe (identical 52-symbol NIFTY200-restricted, evidenced+sampled
          # universe used by every source research.yml this session, unchanged)
          # ============================================================================

          EVIDENCED = sorted(m.NSE_STOCK_PARAM_OVERRIDES.keys())
          UNEVIDENCED_SAMPLE = [
              "ADANIPOWER.NS", "ASIANPAINT.NS", "BAJAJ-AUTO.NS", "BEL.NS", "BHARTIARTL.NS", "BPCL.NS",
              "BRITANNIA.NS", "COALINDIA.NS", "DABUR.NS", "DRREDDY.NS", "EICHERMOT.NS", "HAL.NS",
              "HCLTECH.NS", "HDFCBANK.NS", "HDFCLIFE.NS", "ICICIGI.NS", "ICICIPRULI.NS", "IOC.NS",
              "IRFC.NS", "JINDALSTEL.NS", "KOTAKBANK.NS", "LT.NS", "LUPIN.NS", "MARICO.NS",
              "MOTHERSON.NS", "NESTLEIND.NS", "PNB.NS", "POLYCAB.NS", "SBIN.NS", "SRF.NS",
              "SUNPHARMA.NS", "TATACONSUM.NS", "TATAPOWER.NS", "TATASTEEL.NS", "TORNTPHARM.NS",
              "UBL.NS", "UPL.NS", "VEDL.NS", "WIPRO.NS", "ZYDUSLIFE.NS",
          ]
          SYMBOLS = sorted(set(EVIDENCED) | set(UNEVIDENCED_SAMPLE))


          # ============================================================================
          # Metrics + CAGR
          # ============================================================================

          def _metrics_row(trades):
              if not trades:
                  return dict(n=0, win_rate=0.0, pf_net=0.0, pf_gross=0.0, avg_net=0.0, avg_gross=0.0, cost_drag_pct=0.0, avg_held_days=0.0)
              n = len(trades)
              wins = [t for t in trades if t["net_pnl"] > 0]
              losses = [t for t in trades if t["net_pnl"] <= 0]
              win_rate = 100 * len(wins) / n
              gw = sum(t["net_pnl"] for t in wins)
              gl = -sum(t["net_pnl"] for t in losses)
              pf_net = (gw / gl) if gl > 0 else float("inf")
              wins_g = [t for t in trades if t["gross_pnl"] > 0]
              losses_g = [t for t in trades if t["gross_pnl"] <= 0]
              gwg = sum(t["gross_pnl"] for t in wins_g)
              glg = -sum(t["gross_pnl"] for t in losses_g)
              pf_gross = (gwg / glg) if glg > 0 else float("inf")
              avg_net = sum(t["net_pnl"] for t in trades) / n
              avg_gross = sum(t["gross_pnl"] for t in trades) / n
              total_cost = sum(t["total_cost"] for t in trades)
              cost_drag_pct = 100 * total_cost / max(1, sum(abs(t["gross_pnl"]) for t in trades))
              avg_held_days = sum(t["held_days"] for t in trades) / n
              return dict(n=n, win_rate=win_rate, pf_net=pf_net, pf_gross=pf_gross,
                          avg_net=avg_net, avg_gross=avg_gross, cost_drag_pct=cost_drag_pct,
                          avg_held_days=avg_held_days)


          def compute_cagr(trades, capital_inr):
              # === CAGR methodology (disclosed, see this workflow's header comment) ===
              # 1. Collect every trade's (exit_date, net_pnl) across all 52 symbols.
              # 2. Sort all trades chronologically by exit_date.
              # 3. Simulate a running account balance starting at CAPITAL_INR:
              #    balance_after_trade = balance_before_trade + net_pnl_inr, applied in
              #    exit-date order - an ADDITIVE, non-compounding simulation. Position
              #    sizing for each trade already used the strategy's own existing
              #    per-trade sizing formula against the FIXED starting capital /
              #    CAPITAL_TRANCHES, exactly as originally coded above - the running
              #    balance below is NEVER fed back into position sizing.
              # 4. total_days = (last_exit_date - first_entry_date).days, using the
              #    earliest entry_ts across ALL trades as day 0 and the latest exit_ts
              #    as the end.
              # 5. CAGR = (final_balance / CAPITAL_INR) ** (365.25 / total_days) - 1
              if not trades:
                  return dict(final_balance=None, total_days=None, cagr_pct=None)
              entry_dates = [pd.to_datetime(t["entry_ts"]) for t in trades]
              exit_dates = [pd.to_datetime(t["exit_ts"]) for t in trades]
              first_entry = min(entry_dates)
              last_exit = max(exit_dates)
              total_days = (last_exit - first_entry).days
              sorted_trades = sorted(trades, key=lambda t: pd.to_datetime(t["exit_ts"]))
              balance = capital_inr
              for t in sorted_trades:
                  balance += t["net_pnl"]
              final_balance = balance
              if total_days is None or total_days <= 0:
                  return dict(final_balance=final_balance, total_days=total_days, cagr_pct=None)
              cagr = (final_balance / capital_inr) ** (365.25 / total_days) - 1
              return dict(final_balance=final_balance, total_days=total_days, cagr_pct=cagr * 100)


          def _print_row(label, row):
              print(f"{label:>36} {row['n']:>6} {row['win_rate']:>6.1f}% {row['pf_net']:>7.2f} "
                    f"{row['pf_gross']:>8.2f} {row['avg_net']:>10.2f} {row['avg_gross']:>10.2f} "
                    f"{row['cost_drag_pct']:>9.1f}% {row['avg_held_days']:>8.1f}d")


          # ============================================================================
          # Data fetch (cached per period - only 2 unique fetch passes across all 11
          # strategies: 2y for ten of them, 5y for the gap-and-go 5-year variant)
          # ============================================================================

          _data_cache = {}


          def get_symbol_data(period):
              if period in _data_cache:
                  return _data_cache[period]
              print(f"--- Fetching {len(SYMBOLS)} symbols ({INTERVAL}, {period}) ---")
              cache = {}
              skipped = 0
              for sym in SYMBOLS:
                  try:
                      raw = m.fetch_ohlc(sym, period, INTERVAL)
                  except Exception:
                      skipped += 1
                      continue
                  if raw is None or len(raw) < 100:
                      skipped += 1
                      continue
                  cache[sym] = raw
              print(f"  fetched {len(cache)}/{len(SYMBOLS)} symbols\n")
              _data_cache[period] = cache
              return cache


          def run_strategy(replay_fn, period):
              data = get_symbol_data(period)
              all_trades = []
              for sym, raw in data.items():
                  cfg = m.NSE_STOCK_PARAM_OVERRIDES.get(sym, m.NSE_STOCK_DEFAULT_PARAMS)
                  try:
                      trades = replay_fn(sym, raw, cfg["risk_pct"], CAPITAL_INR, DEFAULT_COST_MODEL)
                  except Exception as e:
                      print(f"ERROR {sym}: {e}")
                      continue
                  all_trades.extend(trades)
              return all_trades


          # ============================================================================
          # Driver: run all 11 strategies, print per-strategy stats, then the
          # consolidated CAGR leaderboard
          # ============================================================================

          STRATEGIES = [
              ("Supertrend 3.0x ATR flip-only", replay_supertrend, "2y"),
              ("MACD crossover 12/26/9", replay_macd, "2y"),
              ("MACD crossover, tighter stop 1.5x", replay_macd_tight, "2y"),
              ("Donchian breakout 55-day", replay_donchian55, "2y"),
              ("Fibonacci retracement, wide trail 3.0x", replay_fib_wide, "2y"),
              ("RSI(2) mean reversion", replay_rsi2, "2y"),
              ("RSI(2), tighter stop 1.5x", replay_rsi2_tight, "2y"),
              ("Bollinger Band squeeze breakout", replay_bb_squeeze, "2y"),
              ("Golden Cross 50/200 SMA", replay_golden_cross, "2y"),
              ("Gap and Go, 2-year window", replay_gap_and_go, "2y"),
              ("Gap and Go, 5-year window", replay_gap_and_go, "5y"),
          ]

          print("=" * 100)
          print("CAGR METHODOLOGY DISCLOSURE (applies to every strategy below - read before")
          print("trusting any CAGR% figure):")
          print("  1. Collect every trade's (exit_date, net_pnl_inr) across all 52 symbols.")
          print("  2. Sort all trades chronologically by exit_date.")
          print("  3. Simulate a running account balance starting at CAPITAL_INR (Rs 400,000):")
          print("     balance_after = balance_before + net_pnl_inr, applied in exit-date order -")
          print("     an ADDITIVE, non-compounding simulation. Position sizing for each trade")
          print("     still uses the strategy's own existing per-trade sizing formula against the")
          print("     FIXED starting capital / CAPITAL_TRANCHES, exactly as originally coded -")
          print("     sizing is NEVER made to depend on the running balance.")
          print("  4. total_days = (last_exit_date - first_entry_date).days, using the earliest")
          print("     entry_ts across ALL trades as day 0 and the latest exit_ts as the end.")
          print("  5. CAGR = (final_balance / CAPITAL_INR) ** (365.25 / total_days) - 1, as a %.")
          print()
          print("  CAVEAT (real, not hidden): this additive model does NOT enforce the shared/")
          print("  finite capital pool that multiple concurrently-open positions across 52")
          print("  symbols would actually draw on in live trading (main.py's real engine DOES")
          print("  enforce that, via deployed_notional()). This CAGR is therefore an upper-bound/")
          print("  idealized 'if this account only ever ran this one strategy across its own")
          print("  dedicated pool' figure, NOT a literal live-trading return guarantee.")
          print("=" * 100)
          print()

          header = (f"{'bucket':>36} {'n':>6} {'win%':>7} {'PFnet':>7} {'PFgross':>8} "
                    f"{'avgNet':>10} {'avgGross':>10} {'costDrag%':>10} {'avgHeld':>9}")

          leaderboard = []

          for name, fn, period in STRATEGIES:
              print(f"\n########## {name} ({period}) ##########")
              trades = run_strategy(fn, period)
              row = _metrics_row(trades)
              print(header)
              _print_row("ALL", row)
              cagr_info = compute_cagr(trades, CAPITAL_INR)
              if cagr_info["cagr_pct"] is None:
                  print(f"  CAGR: n/a (n={row['n']} trades, total_days={cagr_info['total_days']})")
              else:
                  print(f"  CAGR: {cagr_info['cagr_pct']:.2f}%  "
                        f"(final_balance=Rs{cagr_info['final_balance']:,.0f}, "
                        f"total_days={cagr_info['total_days']})")
              leaderboard.append(dict(
                  name=name, n=row["n"], pf_net=row["pf_net"],
                  cagr_pct=cagr_info["cagr_pct"], final_balance=cagr_info["final_balance"],
                  total_days=cagr_info["total_days"],
              ))

          print("\n\n" + "=" * 100)
          print("=== CONSOLIDATED CAGR LEADERBOARD (sorted by CAGR% descending; n/a sorts last) ===")
          print("=" * 100)
          lb_header = f"{'strategy':>40} {'n':>6} {'PFnet':>7} {'CAGR%':>9} {'final_balance':>16} {'total_days':>11}"
          print(lb_header)


          def _sort_key(row):
              return row["cagr_pct"] if row["cagr_pct"] is not None else float("-inf")


          leaderboard.sort(key=_sort_key, reverse=True)
          for row in leaderboard:
              cagr_str = f"{row['cagr_pct']:.2f}%" if row["cagr_pct"] is not None else "n/a"
              fb_str = f"Rs{row['final_balance']:,.0f}" if row["final_balance"] is not None else "n/a"
              td_str = str(row["total_days"]) if row["total_days"] is not None else "n/a"
              print(f"{row['name']:>40} {row['n']:>6} {row['pf_net']:>7.2f} {cagr_str:>9} {fb_str:>16} {td_str:>11}")

          print()
          print("Reminder: CAGR figures above are the idealized/upper-bound additive-model")
          print("figure described in the methodology disclosure at the top of this output -")
          print("NOT a validated forward live-trading return. See docs/STRATEGY_LOG.md for the")
          print("full write-up and this session's standing pool-bar discipline before treating")
          print("any of these numbers as production-ready.")
          PYEOF

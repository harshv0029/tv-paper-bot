name: Unger-style Ride-Winners, No Fixed Target (research)

# Research-only, read-only pass (2026-09-22), idea 4 - a MORE FAITHFUL
# reconstruction after ideas 1-3 (loose competition-inspired analogies)
# all failed net of cost, and the user asked what the actual winners did.
#
# Andrea Unger (only 4-time World Cup Championship of Futures Trading
# winner) has publicly described his early method (Better System Trader
# ep.016; Unger Academy interviews): use the first ~2-3 hours of the
# session to build an opening range (that session's high/low), enter on a
# breakout of that range, and run the trade with NO FIXED TAKE-PROFIT -
# only a stop-loss - riding it to the end of the session, filtered to
# skip days unlikely to trend. This is a genuinely different exit
# philosophy from ideas 1-3, all of which capped every winner at a fixed
# 2R target - and idea 1's own results showed target_hit trades were the
# most profitable bucket (PF=inf, avg net +Rs 3,000+) but rare (37-84 of
# 650-1630 trades) precisely BECAUSE they were capped. This tests whether
# removing that cap changes the picture.
#
# Honesty note (same discipline as every research workflow here): Unger's
# own precise "volatility pattern" day-filter is not fully public. The
# ATR-expanding filter below (current ATR >= its own 20-bar rolling mean)
# is THIS SESSION'S OWN reasoned interpretation of the publicly described
# concept ("skip choppy days, trade when a trend is likely to persist"),
# not his proprietary rule - flagged explicitly so it's never mistaken
# for a verified reproduction.
#
# Entry (ALL required):
#   1. Opening range = session high/low from OPEN_MIN (09:15) to
#      OR_END_MIN (11:45, ~2.5h - the midpoint of Unger's own "2-3 hours"
#      range, a reasoned default chosen before running this, not tuned
#      after).
#   2. First 5m bar after OR_END_MIN whose CLOSE crosses above the
#      opening-range high - only the first breakout per symbol per day.
#   3. Trend-persistence filter: current ATR(14) >= its own trailing
#      20-bar mean (volatility expanding, not contracting) - see honesty
#      note above.
# Exit: stop-loss only (entry*(1-stop_pct/100), same convention as every
# other research signal here) - NO target. Ride to EOD squareoff (915)
# or the stop, whichever comes first. No pre-entry economic-viability
# gate (m._target_move_pct vs m.ROUND_TRIP_COST_PCT) - there is no
# pre-committed target to test it against by design; true net-of-cost
# economics are reported honestly in the results either way.
# Same position sizing formula, cost model, and 52-symbol/60-day/5m
# universe as every other research workflow here.
#
# Does not call universal_score/orb_breakout live signal code, touches no
# live parameter, nothing wired into main.py.

on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ride-winners no-fixed-target backtest
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import numpy as np
          import pandas as pd
          import main as m

          OPEN_MIN = 555
          OR_END_MIN = 705  # ~2.5h after open (09:15-11:45 IST) - see header
          CLOSE_MIN = 930
          SQUAREOFF_MIN = 915
          TZ_OFF = m.IST_OFFSET_MIN
          INTERVAL = "5m"

          DEFAULT_COST_MODEL = {
              "brokerage_pct": 0.0020, "brokerage_flat": 0.0,
              "exchange_txn_pct": 0.0000297, "sebi_fee_pct": 0.000001,
              "stamp_duty_buy_pct": 0.00015, "stt_buy_pct": 0.001, "stt_sell_pct": 0.001,
              "gst_pct": 0.18, "slippage_pct": 0.0005, "dp_charge_flat": 15.93,
          }


          def _prep(df):
              df = df.copy()
              ts = pd.to_datetime(df["Date"])
              ts_utc = ts.dt.tz_convert("UTC") if ts.dt.tz is not None else ts.dt.tz_localize("UTC")
              ts_local = ts_utc + pd.Timedelta(minutes=TZ_OFF)
              df = df.assign(ts_local=ts_local)
              df["date_local"] = df["ts_local"].dt.strftime("%Y-%m-%d")
              df["mins"] = df["ts_local"].dt.hour * 60 + df["ts_local"].dt.minute
              return df.sort_values("ts_local").reset_index(drop=True)


          def _entry_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stamp = notional * cm["stamp_duty_buy_pct"]
              stt = notional * cm["stt_buy_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stamp + stt + gst + slippage


          def _sell_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stt = notional * cm["stt_sell_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stt + gst + slippage


          def _finalize_trade(symbol, entry_price, initial_stop, qty, entry_ts, exit_price, exit_ts,
                               exit_reason, entry_cost, cost_model):
              gross_pnl = (exit_price - entry_price) * qty
              sell_cost = _sell_cost(qty, exit_price, cost_model)
              dp_once = cost_model["dp_charge_flat"] + cost_model["dp_charge_flat"] * cost_model["gst_pct"]
              total_cost = entry_cost + sell_cost + dp_once
              net_pnl = gross_pnl - total_cost
              r = entry_price - initial_stop
              return {
                  "symbol": symbol, "entry_ts": entry_ts, "exit_ts": exit_ts, "exit_reason": exit_reason,
                  "gross_pnl": gross_pnl, "net_pnl": net_pnl, "total_cost": total_cost,
                  "net_r": net_pnl / (r * qty) if r > 0 else None,
              }


          def replay_symbol(symbol, df, risk_pct, stop_pct, capital, cost_model):
              trades = []
              days = sorted(df["date_local"].unique())
              day_frames = {d: g.reset_index(drop=True) for d, g in df.groupby("date_local", sort=True)}

              for day in days:
                  day_df = day_frames[day]
                  if day_df.empty or len(day_df) < 30:
                      continue

                  atr_series = m._atr_series(day_df)
                  atr_val_arr = atr_series.to_numpy(dtype=float)
                  atr_mean_arr = atr_series.rolling(20).mean().to_numpy(dtype=float)

                  mins_arr = day_df["mins"].to_numpy(dtype=int)
                  closes = day_df["Close"].to_numpy(dtype=float)

                  or_mask = (mins_arr >= OPEN_MIN) & (mins_arr < OR_END_MIN)
                  if not or_mask.any():
                      continue
                  or_high = float(day_df.loc[or_mask, "High"].max())

                  position = None
                  day_traded = False

                  for i in range(len(day_df)):
                      mins = int(mins_arr[i])
                      if mins < OR_END_MIN or mins > CLOSE_MIN:
                          continue
                      last_close = float(closes[i])
                      last_ts = day_df["ts_local"].iloc[i].timestamp()

                      if position is not None:
                          is_squareoff = mins >= SQUAREOFF_MIN
                          exit_reason, exit_price = None, last_close
                          if last_close <= position["stop"]:
                              exit_reason = "stop_hit"
                          elif is_squareoff:
                              exit_reason = "eod_squareoff"
                          if exit_reason:
                              trades.append(_finalize_trade(
                                  symbol, position["entry_price"], position["initial_stop"], position["qty"],
                                  position["entry_ts"], exit_price, last_ts, exit_reason,
                                  position["entry_cost"], cost_model,
                              ))
                              position = None
                          continue

                      if day_traded or mins >= SQUAREOFF_MIN:
                          continue

                      breakout = last_close > or_high
                      if not breakout:
                          continue

                      atr_i, atr_mean_i = atr_val_arr[i], atr_mean_arr[i]
                      if np.isnan(atr_i) or np.isnan(atr_mean_i) or atr_i < atr_mean_i:
                          continue  # trend-persistence filter not met

                      day_traded = True

                      stop_loss = last_close * (1 - stop_pct / 100)
                      stop_dist = last_close - stop_loss
                      if stop_dist <= 0:
                          continue

                      usable_capital_inr = min(capital, capital / m.CAPITAL_TRANCHES)
                      risk_amount_inr = usable_capital_inr * risk_pct / 100
                      qty = risk_amount_inr / stop_dist
                      qty = min(qty, usable_capital_inr / last_close)
                      qty = int(np.floor(qty))
                      if qty <= 0 or qty * last_close < 100:
                          continue

                      position = {
                          "entry_price": last_close, "initial_stop": stop_loss, "stop": stop_loss,
                          "entry_ts": last_ts, "qty": qty,
                          "entry_cost": _entry_cost(qty, last_close, cost_model),
                      }

                  if position is not None:
                      last_close = float(day_df["Close"].iloc[-1])
                      last_ts = day_df["ts_local"].iloc[-1].timestamp()
                      trades.append(_finalize_trade(
                          symbol, position["entry_price"], position["initial_stop"], position["qty"],
                          position["entry_ts"], last_close, last_ts, "window_end_forced_close",
                          position["entry_cost"], cost_model,
                      ))

              return trades


          EVIDENCED = sorted(m.NSE_STOCK_PARAM_OVERRIDES.keys())
          UNEVIDENCED_SAMPLE = [
              "ADANIPOWER.NS", "ASIANPAINT.NS", "BAJAJ-AUTO.NS", "BEL.NS", "BHARTIARTL.NS", "BPCL.NS",
              "BRITANNIA.NS", "COALINDIA.NS", "DABUR.NS", "DRREDDY.NS", "EICHERMOT.NS", "HAL.NS",
              "HCLTECH.NS", "HDFCBANK.NS", "HDFCLIFE.NS", "ICICIGI.NS", "ICICIPRULI.NS", "IOC.NS",
              "IRFC.NS", "JINDALSTEL.NS", "KOTAKBANK.NS", "LT.NS", "LUPIN.NS", "MARICO.NS",
              "MOTHERSON.NS", "NESTLEIND.NS", "PNB.NS", "POLYCAB.NS", "SBIN.NS", "SRF.NS",
              "SUNPHARMA.NS", "TATACONSUM.NS", "TATAPOWER.NS", "TATASTEEL.NS", "TORNTPHARM.NS",
              "UBL.NS", "UPL.NS", "VEDL.NS", "WIPRO.NS", "ZYDUSLIFE.NS",
          ]
          SYMBOLS = sorted(set(EVIDENCED) | set(UNEVIDENCED_SAMPLE))
          CAPITAL_INR = 400000.0

          def _metrics_row(trades):
              if not trades:
                  return dict(n=0, win_rate=0.0, pf_net=0.0, pf_gross=0.0, avg_net=0.0, avg_gross=0.0, cost_drag_pct=0.0)
              n = len(trades)
              wins = [t for t in trades if t["net_pnl"] > 0]
              losses = [t for t in trades if t["net_pnl"] <= 0]
              win_rate = 100 * len(wins) / n
              gw = sum(t["net_pnl"] for t in wins)
              gl = -sum(t["net_pnl"] for t in losses)
              pf_net = (gw / gl) if gl > 0 else float("inf")
              wins_g = [t for t in trades if t["gross_pnl"] > 0]
              losses_g = [t for t in trades if t["gross_pnl"] <= 0]
              gwg = sum(t["gross_pnl"] for t in wins_g)
              glg = -sum(t["gross_pnl"] for t in losses_g)
              pf_gross = (gwg / glg) if glg > 0 else float("inf")
              avg_net = sum(t["net_pnl"] for t in trades) / n
              avg_gross = sum(t["gross_pnl"] for t in trades) / n
              total_cost = sum(t["total_cost"] for t in trades)
              cost_drag_pct = 100 * total_cost / max(1, sum(abs(t["gross_pnl"]) for t in trades))
              return dict(n=n, win_rate=win_rate, pf_net=pf_net, pf_gross=pf_gross,
                          avg_net=avg_net, avg_gross=avg_gross, cost_drag_pct=cost_drag_pct)

          def _print_row(label, row):
              print(f"{label:>28} {row['n']:>6} {row['win_rate']:>6.1f}% {row['pf_net']:>7.2f} "
                    f"{row['pf_gross']:>8.2f} {row['avg_net']:>10.2f} {row['avg_gross']:>10.2f} {row['cost_drag_pct']:>9.1f}%")

          print(f"--- Fetching {len(SYMBOLS)} symbols ({INTERVAL}, 60d) ---")
          per_symbol_df = {}
          for sym in SYMBOLS:
              try:
                  raw = m.fetch_ohlc(sym, "60d", INTERVAL)
              except Exception:
                  continue
              if raw is None or len(raw) < 100:
                  continue
              per_symbol_df[sym] = _prep(raw)
          print(f"  fetched {len(per_symbol_df)}/{len(SYMBOLS)} symbols\n")

          header = f"{'bucket':>28} {'n':>6} {'win%':>7} {'PFnet':>7} {'PFgross':>8} {'avgNet':>10} {'avgGross':>10} {'costDrag%':>10}"

          all_trades = []
          for sym, df in per_symbol_df.items():
              cfg = m.NSE_STOCK_PARAM_OVERRIDES.get(sym, m.NSE_STOCK_DEFAULT_PARAMS)
              try:
                  trades = replay_symbol(sym, df, cfg["risk_pct"], cfg["stop_pct"], CAPITAL_INR, DEFAULT_COST_MODEL)
              except Exception as e:
                  print(f"ERROR {sym}: {e}")
                  continue
              all_trades.extend(trades)

          print("=== OVERALL ===")
          print(header)
          _print_row("ride_winners_no_target", _metrics_row(all_trades))

          print("\n=== BY EXIT REASON ===")
          print(header)
          for reason in sorted(set(t["exit_reason"] for t in all_trades)):
              _print_row(reason, _metrics_row([t for t in all_trades if t["exit_reason"] == reason]))

          print("\n=== BY SYMBOL (n>=3, sorted by gross PF) ===")
          print(header)
          per_symbol = {}
          for t in all_trades:
              per_symbol.setdefault(t["symbol"], []).append(t)
          symbol_rows = [(sym, _metrics_row(sts)) for sym, sts in per_symbol.items() if len(sts) >= 3]
          symbol_rows.sort(key=lambda x: x[1]["pf_gross"], reverse=True)
          for sym, row in symbol_rows[:15]:
              _print_row(sym, row)
          PYEOF

name: Kotak Real Position Reconciliation

# A genuinely separate scheduled process from the 30s trading scheduler
# (explicit user instruction, 2026-09-07: "sync ai data with kotak via
# one separate AI agent" -> "A genuinely separate scheduled process").
# Calls POST /kotak-neo/reconcile-real-positions, which corrects this
# app's own real_positions tracking against Kotak's own live positions()
# data - qty drift gets corrected, positions Kotak shows already closed
# get removed, and any open Kotak position this app has no record of
# (e.g. a manually-placed trade) is surfaced, not silently adopted. See
# that endpoint's own docstring in main.py for the full reasoning - this
# workflow is just the recurring trigger + durable audit trail for it.
#
# Runs every 15 min during NSE market hours (09:15-15:30 IST = 03:45-
# 10:00 UTC, weekdays) - same time window live-signals.yml already polls,
# just a coarser cadence since reconciliation doesn't need 5-min freshness
# the way live signal-checking does. Also workflow_dispatch for manual runs
# (e.g. right after placing a manual trade, to sync immediately rather
# than waiting for the next scheduled tick).
#
# Scheduled (cron) runs always pass adopt="*" (2026-09-08, second live
# occurrence of the same gap in one session - AGL then AARTIIND -
# explicit user finding: "why so much u sync", i.e. why does a human
# have to keep noticing and reporting this instead of it fixing itself).
# Safe to do unattended now that reconcile-real-positions's adopt logic
# only ever matches a BUY carrying Kotak's own algo-order tag for THIS
# app (see that endpoint's own docstring) - a manually-placed position
# is never auto-adopted, only ever reported as untracked for a human to
# review. A manual workflow_dispatch run still defaults to no adoption
# (empty `adopt` input) unless explicitly requested.
on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      adopt:
        description: >-
          Optional: comma-separated Kotak trading symbols (e.g. "ATL-EQ")
          to adopt from untracked_open_positions into real_positions, or
          "*" for all of them - see reconcile-real-positions's own
          `adopt` param docstring in main.py (2026-09-08) for when this
          is actually safe to use (a genuinely bot-placed position this
          app lost track of, not an unrelated manual trade).
        required: false
        default: ""

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconcile real_positions against Kotak's own live data
        env:
          KOTAK_NEO_API_TOKEN: ${{ secrets.KOTAK_NEO_API_TOKEN }}
          ADOPT: ${{ github.event_name == 'schedule' && '*' || inputs.adopt }}
        run: |
          curl -sS -m 60 "https://tv-paper-bot-gdan.onrender.com/health" || true
          echo
          URL="https://tv-paper-bot-gdan.onrender.com/kotak-neo/reconcile-real-positions?token=${KOTAK_NEO_API_TOKEN}"
          if [[ -n "$ADOPT" ]]; then
            URL="${URL}&adopt=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$ADOPT")"
          fi
          curl -sS --retry 3 --retry-delay 10 --retry-connrefused -m 60 -X POST \
            "$URL" \
            -o /tmp/reconcile-result.json
          cat /tmp/reconcile-result.json
          echo

          ERR=$(jq -r '.error // empty' /tmp/reconcile-result.json)
          if [[ -n "$ERR" ]]; then
            echo "::error::reconcile-real-positions returned an error: $ERR"
            exit 1
          fi

          QTY_FIXED=$(jq -r '.qty_corrected_count' /tmp/reconcile-result.json)
          GHOSTS=$(jq -r '.removed_ghost_count' /tmp/reconcile-result.json)
          UNTRACKED=$(jq -r '.untracked_open_positions_count' /tmp/reconcile-result.json)
          ADOPTED=$(jq -r '.adopted_count // 0' /tmp/reconcile-result.json)
          echo "qty corrected: $QTY_FIXED, ghosts removed: $GHOSTS, untracked open positions: $UNTRACKED, adopted: $ADOPTED"
          if [[ "$UNTRACKED" -gt 0 ]]; then
            echo "::warning::$UNTRACKED open Kotak position(s) have no record in this app's own tracking - see untracked_open_positions in the log below."
          fi

      - name: Append to the durable reconciliation log
        run: |
          mkdir -p docs
          test -f docs/real_reconcile_log.json || echo '[]' > docs/real_reconcile_log.json
          jq -s '
            .[0] + [.[1]]
          ' docs/real_reconcile_log.json /tmp/reconcile-result.json > /tmp/real_reconcile_log_merged.json
          mv /tmp/real_reconcile_log_merged.json docs/real_reconcile_log.json
          echo "real_reconcile_log.json now has $(jq 'length' docs/real_reconcile_log.json) entries"

      - name: Commit if changed
        run: |
          git config user.name "tv-paper-bot Kotak reconciliation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/real_reconcile_log.json
          if git diff --cached --quiet; then
            echo "No change - nothing to commit"
          else
            git commit -m "Kotak reconciliation: $(jq -r '"\(.qty_corrected_count) qty fix(es), \(.removed_ghost_count) ghost(s) removed, \(.untracked_open_positions_count) untracked"' /tmp/reconcile-result.json)"
            git push
          fi

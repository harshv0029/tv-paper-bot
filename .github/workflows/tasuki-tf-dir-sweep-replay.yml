name: tasuki gap short+long candle-size x ATR x universe sweep, main.py fns (B-1181)

# Backlog B-1181. Research only (NOT wired). tasuki gap short/long x ATR {2.5,4,6} x hold 3, universes etf (main.ETF_SYMBOLS,
# 1 shard per candle size) and full (main._load_nse_universe_from_file(), sharded), candle sizes 1d/4h/1h/15m/5m. Calls the REAL
# main.tasuki_short_signal / tasuki_short_stop / _compute_atr_value / tasuki_short_exit_reason (long = same real fns on the
# reciprocal-price frame, exact mirror). 0.8% cost, stop on every trade. Default 5 + (4+8+8+16+24) = 65 jobs: research
# matrix, dispatch ONLY when no Deploy Gate / safety run is queued. Output artifact tasuki-all (tasuki_all.json).
on:
  workflow_dispatch:
    inputs:
      atrs:
        description: "ATR multiples, comma separated"
        default: "2.5,4,6"
      holds:
        description: "holds in bars of the candle in use, comma separated"
        default: "3"
      nshards_1d:
        description: "Shards for 1d (full universe)"
        default: "4"
      nshards_4h:
        description: "Shards for 4h (full universe)"
        default: "8"
      nshards_1h:
        description: "Shards for 1h (full universe)"
        default: "8"
      nshards_15m:
        description: "Shards for 15m (full universe)"
        default: "16"
      nshards_5m:
        description: "Shards for 5m (full universe)"
        default: "24"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: p
        env:
          NSHARDS_1D: ${{ inputs.nshards_1d }}
          NSHARDS_4H: ${{ inputs.nshards_4h }}
          NSHARDS_1H: ${{ inputs.nshards_1h }}
          NSHARDS_15M: ${{ inputs.nshards_15m }}
          NSHARDS_5M: ${{ inputs.nshards_5m }}
        run: |
          echo "matrix=$(python3 scripts/tasuki_tf_dir_sweep_replay.py plan)" >> "$GITHUB_OUTPUT"

  replay:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Replay (real main.py functions)
        env:
          UNIV: ${{ matrix.univ }}
          TF: ${{ matrix.tf }}
          SHARD: ${{ matrix.shard }}
          NSHARDS: ${{ matrix.nshards }}
          ATRS: ${{ inputs.atrs }}
          HOLDS: ${{ inputs.holds }}
        run: python3 scripts/tasuki_tf_dir_sweep_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: tasuki-${{ matrix.univ }}-${{ matrix.tf }}-s${{ matrix.shard }}
          path: out/

  aggregate:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: tasuki-*
          merge-multiple: true
      - name: Merge shards (exact, from raw sums)
        run: python3 scripts/tasuki_tf_dir_sweep_replay.py merge out
      - uses: actions/upload-artifact@v4
        with:
          name: tasuki-all
          path: out/tasuki_all.json

name: Minervini Base-Count Sizing Research (research, calls the REAL main.py functions)

# 2026-10-01, docs/minervini_book_notes.txt's own "FLAGGED FOR FUTURE
# RESEARCH" item: "BASE-COUNT-AWARE SIZING/FILTER: chapter 5 says base
# #1-#2 (right off a market correction) are the highest-quality entries in
# a stage-2 uptrend, with quality degrading by base #4-#5. Worth testing:
# count how many prior VCP-qualifying bases each symbol has already had
# within its current stage-2 run... and check whether PFnet/win% actually
# degrades by base number in this data the way the book claims."
#
# Tests this directly on minervini_vcp_entry_signal_livermore_confirmed
# (the already-LIVE, real-money-eligible variant, PFnet 2.043 pooled) +
# the real, unmodified minervini_vcp_exit_reason - every entry/exit
# decision calls the real main.py function. The ONLY new research logic
# is counting which "base number" (1st, 2nd, 3rd... qualifying entry)
# each trade represents within its symbol's current uninterrupted
# Trend-Template-qualifying run, using the real m._minervini_trend_
# template_ok as the run-continuity signal (the run resets to base #1
# the moment the Trend Template stops qualifying - a stage-1/3/4 break).
#
# Full NSE universe via m._load_nse_universe_from_file() (2026-09-29
# standing thumb rule), 1d/5y, single job (same RS-cross-sectional-table
# reasoning minervini-vcp-livermore-confirmed-validation-replay.yml's own
# header gives for why this family isn't sharded).
#
# Read-only research: does not touch any live parameter, table, or
# scheduler path. A finding here does NOT by itself authorize any sizing/
# filter change to the live minervini_vcp_livermore_confirmed strategy -
# that would need its own implement -> test -> validate -> explicit
# go-ahead cycle, same as everywhere else in this repo.
on:
  workflow_dispatch: {}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run base-count research against the real main.py functions
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import numpy as np
          import pandas as pd
          import main as m

          PERIOD = "5y"
          INTERVAL = "1d"
          CAPITAL_INR = 400000.0

          DEFAULT_COST_MODEL = {
              "brokerage_pct": 0.0020, "brokerage_flat": 0.0,
              "exchange_txn_pct": 0.0000297, "sebi_fee_pct": 0.000001,
              "stamp_duty_buy_pct": 0.00015, "stt_buy_pct": 0.001, "stt_sell_pct": 0.001,
              "gst_pct": 0.18, "slippage_pct": 0.0005, "dp_charge_flat": 15.93,
          }


          def _entry_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stamp = notional * cm["stamp_duty_buy_pct"]
              stt = notional * cm["stt_buy_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stamp + stt + gst + slippage


          def _sell_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stt = notional * cm["stt_sell_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stt + gst + slippage


          def _finalize_trade(symbol, entry_price, initial_stop, qty, entry_label, exit_price,
                               exit_label, exit_reason, entry_cost, held_days, cost_model, base_number):
              gross_pnl = (exit_price - entry_price) * qty
              sell_cost = _sell_cost(qty, exit_price, cost_model)
              dp_once = cost_model["dp_charge_flat"] + cost_model["dp_charge_flat"] * cost_model["gst_pct"]
              total_cost = entry_cost + sell_cost + dp_once
              net_pnl = gross_pnl - total_cost
              r = entry_price - initial_stop
              return {
                  "symbol": symbol, "entry_ts": entry_label, "exit_ts": exit_label,
                  "exit_reason": exit_reason, "gross_pnl": gross_pnl, "net_pnl": net_pnl,
                  "total_cost": total_cost, "held_days": held_days,
                  "net_r": net_pnl / (r * qty) if r > 0 else None, "base_number": base_number,
              }


          def replay_symbol(symbol, df, risk_pct, capital, cost_model, rs_pct_series):
              """Calls the REAL m.minervini_vcp_entry_signal_livermore_confirmed
              and m.minervini_vcp_exit_reason for every entry/exit/stop/trail
              decision. The ONLY new logic: tracking base_run_count via the
              real m._minervini_trend_template_ok as the run-continuity
              signal, reset to 0 the moment the Trend Template stops
              qualifying (a stage-1/3/4 break), incremented each time a
              qualifying entry fires."""
              trades = []
              df = df.reset_index(drop=True)
              n = len(df)
              min_lookback = max(m.MINERVINI_SMA_200, m.MINERVINI_FIFTY_TWO_WEEK_N) + m.MINERVINI_SMA200_RISING_LOOKBACK + 5
              if n < min_lookback + 20:
                  return trades

              closes = df["Close"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()
              position = None
              base_run_count = 0

              for i in range(min_lookback, n):
                  sub_df = df.iloc[: i + 1]
                  rs_pct = rs_pct_series[i] if rs_pct_series is not None else None

                  tt_ok = m._minervini_trend_template_ok(sub_df, rs_percentile=rs_pct)
                  if tt_ok is not True:
                      base_run_count = 0

                  if position is not None:
                      reason, position["running_max_close"] = m.minervini_vcp_exit_reason(
                          sub_df, position["entry_label"], position["initial_stop"],
                          position["atr_at_entry"], position["running_max_close"],
                      )
                      if reason:
                          held_days = i - position["entry_idx"]
                          trades.append(_finalize_trade(
                              symbol, position["entry_price"], position["initial_stop"], position["qty"],
                              position["entry_label"], closes[i], dates[i], reason,
                              position["entry_cost"], held_days, cost_model, position["base_number"],
                          ))
                          position = None

                  if position is None:
                      sig = m.minervini_vcp_entry_signal_livermore_confirmed(sub_df, rs_percentile=rs_pct)
                      if sig is not None:
                          entry_price = sig["entry_price"]
                          stop_loss = sig["stop_loss"]
                          stop_dist = entry_price - stop_loss
                          if stop_dist > 0:
                              usable_capital_inr = min(capital, capital / m.CAPITAL_TRANCHES)
                              risk_amount_inr = usable_capital_inr * risk_pct / 100
                              qty = min(risk_amount_inr / stop_dist, usable_capital_inr / entry_price)
                              qty = int(np.floor(qty))
                              if qty > 0 and qty * entry_price >= 100:
                                  base_run_count += 1
                                  position = {
                                      "entry_price": entry_price, "initial_stop": stop_loss,
                                      "entry_idx": i, "entry_label": dates[i], "qty": qty,
                                      "atr_at_entry": sig["atr_at_entry"], "running_max_close": entry_price,
                                      "entry_cost": _entry_cost(qty, entry_price, cost_model),
                                      "base_number": base_run_count,
                                  }

              if position is not None:
                  held_days = (n - 1) - position["entry_idx"]
                  trades.append(_finalize_trade(
                      symbol, position["entry_price"], position["initial_stop"], position["qty"],
                      position["entry_label"], closes[-1], dates[-1], "data_end_forced_close",
                      position["entry_cost"], held_days, cost_model, position["base_number"],
                  ))
              return trades


          SYMBOLS = sorted(set(m._load_nse_universe_from_file()))
          print(f"--- Fetching {len(SYMBOLS)} symbols ({INTERVAL}, {PERIOD}) ---")
          raw_by_symbol = {}
          for sym in SYMBOLS:
              try:
                  raw = m.fetch_ohlc(sym, PERIOD, INTERVAL)
              except Exception as e:
                  print(f"SKIP {sym}: {e}")
                  continue
              if raw is None or len(raw) < 100:
                  continue
              raw_by_symbol[sym] = raw.reset_index(drop=True)
          print(f"  fetched {len(raw_by_symbol)}/{len(SYMBOLS)} symbols\n")

          return_series = {}
          for sym, raw in raw_by_symbol.items():
              closes_s = raw["Close"].astype(float)
              ret = closes_s.pct_change(m.MINERVINI_RS_RETURN_LOOKBACK)
              ret.index = raw["Date"].astype(str)
              return_series[sym] = ret
          returns_df = pd.DataFrame(return_series)
          rs_pct_df = returns_df.rank(axis=1, pct=True) * 100.0

          all_trades = []
          for sym, raw in raw_by_symbol.items():
              cfg = m.NSE_STOCK_PARAM_OVERRIDES.get(sym, m.NSE_STOCK_DEFAULT_PARAMS)
              dates_str = raw["Date"].astype(str)
              rs_series = rs_pct_df[sym].reindex(dates_str).to_numpy() if sym in rs_pct_df.columns else None
              try:
                  trades = replay_symbol(sym, raw, cfg["risk_pct"], CAPITAL_INR, DEFAULT_COST_MODEL, rs_series)
              except Exception as e:
                  print(f"ERROR {sym}: {e}")
                  continue
              all_trades.extend(trades)
          print(f"  {len(all_trades)} total trades\n")


          def _metrics(trades):
              if not trades:
                  return dict(n=0, win_rate=0.0, pf_net=0.0, pf_gross=0.0, avg_net=0.0, avg_held_days=0.0)
              n = len(trades)
              wins = [t for t in trades if t["net_pnl"] > 0]
              losses = [t for t in trades if t["net_pnl"] <= 0]
              win_rate = 100 * len(wins) / n
              gw = sum(t["net_pnl"] for t in wins)
              gl = -sum(t["net_pnl"] for t in losses)
              pf_net = (gw / gl) if gl > 0 else float("inf")
              wins_g = [t for t in trades if t["gross_pnl"] > 0]
              losses_g = [t for t in trades if t["gross_pnl"] <= 0]
              gwg = sum(t["gross_pnl"] for t in wins_g)
              glg = -sum(t["gross_pnl"] for t in losses_g)
              pf_gross = (gwg / glg) if glg > 0 else float("inf")
              avg_net = sum(t["net_pnl"] for t in trades) / n
              avg_held_days = sum(t["held_days"] for t in trades) / n
              return dict(n=n, win_rate=win_rate, pf_net=pf_net, pf_gross=pf_gross,
                          avg_net=avg_net, avg_held_days=avg_held_days)


          print("=== POOLED RESULT (sanity check vs the known-good baseline) ===")
          row = _metrics(all_trades)
          print(f"n_trades={row['n']} win_rate={row['win_rate']:.2f}% "
                f"pf_net={row['pf_net']:.3f} pf_gross={row['pf_gross']:.3f} avg_net_inr={row['avg_net']:.2f}")

          print("\n=== PFnet BY BASE NUMBER (the book's own claim: quality degrades #1->#5+) ===")
          by_base = {}
          for t in all_trades:
              by_base.setdefault(t["base_number"], []).append(t)
          for base_num in sorted(by_base.keys()):
              bucket = "5+" if base_num >= 5 else str(base_num)
              m2 = _metrics(by_base[base_num])
              print(f"base #{base_num:>2d}: n={m2['n']:<5d} win_rate={m2['win_rate']:6.2f}% "
                    f"pf_net={m2['pf_net']:7.3f} avg_net_inr={m2['avg_net']:9.2f} avg_held_days={m2['avg_held_days']:5.1f}")

          print("\n=== Same data, bucketed 1-2 / 3 / 4 / 5+ (book's own rough grouping) ===")
          buckets = {"1-2": [], "3": [], "4": [], "5+": []}
          for t in all_trades:
              bn = t["base_number"]
              key = "1-2" if bn <= 2 else ("3" if bn == 3 else ("4" if bn == 4 else "5+"))
              buckets[key].append(t)
          for key in ("1-2", "3", "4", "5+"):
              m2 = _metrics(buckets[key])
              print(f"base {key:>3s}: n={m2['n']:<5d} win_rate={m2['win_rate']:6.2f}% pf_net={m2['pf_net']:7.3f} avg_net_inr={m2['avg_net']:9.2f}")
          PYEOF

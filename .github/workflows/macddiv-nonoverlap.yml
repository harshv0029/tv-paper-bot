name: macddiv non-overlap re-run (B-812)

# 2026-10-12 IST. Strict-FIFO (one position per symbol per cell) re-run of the 4 macddiv 1h long cells >= 1.1 from
# run 38188472624 (scripts/macddiv_nonoverlap.py), 0.8% cost, ATR stop, FULL universe. New tags <old>__nonovl__v2.
# B-814: also emits IS/OOS split tags (_nonovl_segis__v2 / _segoos__v2). Research only; nothing wired. Mirrors chan-nonoverlap.yml.
# Prepared dispatch for the IS/OOS split (both directions, ATR x pivot sweep): interval=1h cells=sweep directions=long,short
# split_frac=0.7 (then repeat with interval=15m, 5m, 1d; yfinance: 1h 730d, 15m/5m 60d, 1d 5y; 4h owed, needs 1h resample).
on:
  workflow_dispatch:
    inputs:
      interval:
        description: "Candle size (1h, 15m, 5m, 1d)"
        default: "1h"
      cells:
        description: "orig = the 4 registered long cells; sweep = 3 variants x w3/w5 x ATR 1.5/2/3"
        default: "orig"
      directions:
        description: "Comma list: long,short (short mirror = separate tags)"
        default: "long"
      split_date:
        description: "IS/OOS boundary date YYYY-MM-DD (entry before = IS). Blank = use split_frac"
        default: ""
      split_frac:
        description: "Fraction of each symbol's time span that is in-sample when split_date is blank"
        default: "0.6"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Run shard
        run: python3 scripts/macddiv_nonoverlap.py --shard ${{ matrix.shard }} --nshards 6 --interval "${{ inputs.interval }}" --cells "${{ inputs.cells }}" --directions "${{ inputs.directions }}" --split_date "${{ inputs.split_date }}" --split_frac "${{ inputs.split_frac }}" --out out
      - uses: actions/upload-artifact@v4
        with:
          name: macddiv-nonovl-${{ inputs.interval }}-${{ matrix.shard }}
          path: out/macddiv_nonovl_*.json
          retention-days: 3

  merge:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Merge and print
        run: python3 scripts/macddiv_nonoverlap.py --merge shards --json macddiv_nonoverlap_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: macddiv-nonoverlap-results-${{ inputs.interval }}
          path: macddiv_nonoverlap_results.json

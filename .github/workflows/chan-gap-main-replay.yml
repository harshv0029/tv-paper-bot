name: chan_gap BUY-ON-GAP LONG 1d main.py-function replay (B-982)

# Backlog B-982. Replays every tag of main.CHAN_GAP_LONG_CELLS (atr4d0/atr2d5/atr1d5 top10) by IMPORTING and CALLING the real
# main.py functions (chan_gap_entry_signal, chan_gap_select_top, chan_gap_exit_reason) on the FULL universe
# (main._load_nse_universe_from_file(), not main.NSE_FULL_UNIVERSE), cost = main.ROUND_TRIP_COST_PCT (0.8%). Shards emit each
# day's candidates; the merge job does the per-date top-10 rank. Commit the merged JSON as
# docs/backtest_data/chan_gap_main_replay_run_<run id>.json (rows[].metrics, read by main._replay_verified_tags). Until a file
# clearing the floor (n >= 30) is on file the tags stay in REPLAY_OWED_TAGS (real-money gate closed).
# Long only (the short mirror is its own tag family). Validation only; wires nothing, no kill switch.
on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - env:
          SHARD: ${{ matrix.shard }}
          NSHARDS: "8"
        run: python3 scripts/chan_gap_long_main_replay.py run
      - uses: actions/upload-artifact@v4
        with:
          name: chan_gap-main-replay-s${{ matrix.shard }}
          path: out/
          retention-days: 7

  merge:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: chan_gap-main-replay-s*
          merge-multiple: true
      - run: python3 scripts/chan_gap_long_main_replay.py merge shards chan_gap_all.json | tee chan_gap_table.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chan_gap-main-replay-results
          path: |
            chan_gap_all.json
            chan_gap_table.txt

name: Elder batch 3 research (osc, struct, chan, sizing, breadth, orb)

# Elder, "Trading for a Living": rows B-641..B-776 not reached by batch 1/2 or breadth_lab.
# Families osc, struct, chan, sizing, breadth x 4 shards (20 jobs) at the chosen candle size, plus an
# opening-range job (family orb, 5m only, 4 shards). Dispatch only when no Deploy Gate / safety run is
# queued. FULL universe via main._load_nse_universe_from_file(), BOTH directions, ATR stop sweep
# 1.5/2/3 with a stop on every trade, 0.8% round-trip cost. Every (variant, direction, ATR) cell is
# its own tag per the naming grammar. Candle-size sweep: re-dispatch with interval=1h (730d) / 15m / 5m (60d).
# Bar-count constants change meaning with the interval; 4h needs a 1h resample (owed, not skipped).
# The sizing family uses a proxy R = ret / (2 * median ATR%) and the breadth family trades ^NSEI
# (daily only: run it at interval=1d). Research only: no live wiring.
on:
  workflow_dispatch:
    inputs:
      interval:
        description: "Candle size (1d, 1h, 15m, 5m)"
        required: false
        default: "1d"
      period:
        description: "yfinance period (1d: 5y; 1h: 730d; 15m/5m: 60d)"
        required: false
        default: "5y"
      pin_run_id:
        description: "B-841: run id of an earlier pin-aware run; reruns on EXACTLY its fetched symbol set (empty = unpinned)"
        required: false
        default: ""
      pin_artifact:
        description: "Merged-results artifact of pin_run_id (required with pin_run_id)"
        required: false
        default: "elder-batch3-results"
      run_orb:
        description: "Also run the 5m opening-range job (true/false)"
        required: false
        default: "true"
      families:
        description: 'JSON list of families for the research matrix (B-864 rerun: ["osc","chan"] = 8 jobs)'
        required: false
        default: '["osc","struct","chan","sizing","breadth"]'
      split_date:
        description: "IS/OOS boundary date YYYY-MM-DD (B-864 d). Adds _segis__v1 / _segoos__v1 tags next to each pooled tag; empty = off"
        required: false
        default: ""

jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(inputs.families) }}
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: ./.github/actions/resolve-pin
        with:
          pin_run_id: ${{ inputs.pin_run_id }}
          pin_artifact: ${{ inputs.pin_artifact }}
          token: ${{ github.token }}
      - name: Run family shard
        run: |
          set -o pipefail
          python3 scripts/elder_batch3_research.py \
            --family "${{ matrix.family }}" --shard ${{ matrix.shard }} --nshards 4 \
            --interval "${{ inputs.interval }}" --period "${{ inputs.period }}" \
            --split_date "${{ inputs.split_date }}" --out out/
      - uses: actions/upload-artifact@v4
        with:
          name: elderc-${{ matrix.family }}-${{ matrix.shard }}
          path: out/

  orb:
    if: ${{ inputs.run_orb == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Run ORB shard (5m, 60d)
        run: |
          set -o pipefail
          python3 scripts/elder_batch3_research.py --family orb --shard ${{ matrix.shard }} --nshards 4 \
            --interval 5m --period 60d --out out/
      - uses: actions/upload-artifact@v4
        with:
          name: elderc-orb-${{ matrix.shard }}
          path: out/

  merge:
    needs: [research, orb]
    if: ${{ always() && needs.research.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: elderc-*
          merge-multiple: true
      - name: Merge shards and print per-tag table
        run: |
          set -o pipefail
          python3 scripts/elder_batch3_research.py --merge shards --json elderc_results.json | tee elderc_table.txt
      - uses: actions/upload-artifact@v4
        with:
          name: elder-batch3-results
          path: |
            elderc_results.json
            elderc_table.txt

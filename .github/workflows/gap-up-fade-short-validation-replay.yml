name: Gap-Up Fade Short Validation Replay (calls the REAL main.py functions)

# 2026-09-30, explicit user instruction ("Read about it and backtest") - a
# genuinely new short-sell candidate: a stock gaps UP strongly at the
# open, then fails to hold that gap during the session (reverses below
# its own opening print). The mirror-opposite of gap_and_go (needs the
# gap to HOLD) and distinct from gap_and_go_short_fade (a gap-DOWN
# continuation trade, not a fade).
#
# Per CLAUDE.md's standing discipline: implement -> unit test -> full
# pytest -> full-universe validation replay calling the REAL main.py
# functions (not a reimplementation that could drift from what's actually
# live) -> honest report -> register in strategy_registry.py regardless of
# outcome. Every entry/exit/stop/trail decision below calls
# m.gap_up_fade_entry_signal_short / m.gap_up_fade_exit_reason_short
# directly.
#
# Intraday (5m, 60d - yfinance's own max window for that granularity),
# full NSE universe via m._load_nse_universe_from_file() (CLAUDE.md,
# 2026-09-29 full-universe thumb rule). Deliberately a single, unsharded
# job (unlike range/trend-short-validation-replay.yml's 40-way matrix) -
# this entry function has no regime classification or multi-factor
# scoring, just gap-percentage arithmetic and a close-vs-open comparison,
# so per-bar compute is far cheaper; sharding is a performance
# optimization to revisit if this single job times out in practice, not a
# correctness requirement.
#
# Read-only research: does not touch any live parameter, table, or
# scheduler path, and gap_up_fade_entry_signal_short/
# gap_up_fade_exit_reason_short are NOT wired into main.py's live scan/
# scheduler/order path (see strategy_registry.py's "registering != trading"
# principle) - this replay is the honest number to report before any
# further go/no-go decision on that.
on:
  workflow_dispatch: {}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run Gap-Up Fade short backtest against the real main.py functions
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import numpy as np
          import pandas as pd
          import yfinance as yf
          import main as m

          PERIOD = "60d"
          INTERVAL = "5m"
          CAPITAL_INR = 400000.0

          DEFAULT_COST_MODEL = {
              "brokerage_pct": 0.0020, "brokerage_flat": 0.0,
              "exchange_txn_pct": 0.0000297, "sebi_fee_pct": 0.000001,
              "stamp_duty_buy_pct": 0.00015, "stt_buy_pct": 0.001, "stt_sell_pct": 0.001,
              "gst_pct": 0.18, "slippage_pct": 0.0005, "dp_charge_flat": 15.93,
          }


          def _entry_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stamp = notional * cm["stamp_duty_buy_pct"]
              stt = notional * cm["stt_buy_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stamp + stt + gst + slippage


          def _sell_cost(qty, price, cm):
              notional = qty * price
              brokerage = cm["brokerage_flat"] if cm["brokerage_pct"] == 0 and cm["brokerage_flat"] else notional * cm["brokerage_pct"]
              exch = notional * cm["exchange_txn_pct"]
              sebi = notional * cm["sebi_fee_pct"]
              stt = notional * cm["stt_sell_pct"]
              gst = (brokerage + exch + sebi) * cm["gst_pct"]
              slippage = notional * cm["slippage_pct"]
              return brokerage + exch + sebi + stt + gst + slippage


          def _finalize_trade_short(symbol, entry_price, initial_stop, qty, entry_label, exit_price,
                                     exit_label, exit_reason, entry_cost, held_minutes, cost_model):
              # Short: profit when price FALLS - gross_pnl sign flipped vs a long trade.
              gross_pnl = (entry_price - exit_price) * qty
              sell_cost = _sell_cost(qty, exit_price, cost_model)
              dp_once = cost_model["dp_charge_flat"] + cost_model["dp_charge_flat"] * cost_model["gst_pct"]
              total_cost = entry_cost + sell_cost + dp_once
              net_pnl = gross_pnl - total_cost
              r = initial_stop - entry_price
              return {
                  "symbol": symbol, "entry_ts": entry_label, "exit_ts": exit_label,
                  "exit_reason": exit_reason, "gross_pnl": gross_pnl, "net_pnl": net_pnl,
                  "total_cost": total_cost, "held_minutes": held_minutes,
                  "net_r": net_pnl / (r * qty) if r > 0 else None,
              }


          def replay_symbol(symbol, df, risk_pct, capital, cost_model):
              """Calls the REAL m.gap_up_fade_entry_signal_short and
              m.gap_up_fade_exit_reason_short for every entry/exit/stop/
              trail decision - only the position-bookkeeping/cost-
              application loop is written here."""
              trades = []
              df = df.reset_index(drop=True)
              n = len(df)
              min_lookback = max(m.GAP_UP_FADE_ATR_N, m.GAP_UP_FADE_MIN_BARS_INTO_SESSION) + 5
              if n < min_lookback + 20:
                  return trades

              closes = df["Close"].to_numpy(dtype=float)
              dates = df["Date"].astype(str).to_numpy()
              position = None

              for i in range(min_lookback, n):
                  sub_df = df.iloc[: i + 1]

                  if position is not None:
                      reason, position["running_min_close"] = m.gap_up_fade_exit_reason_short(
                          sub_df, position["entry_label"], position["initial_stop"],
                          position["atr_at_entry"], position["running_min_close"],
                      )
                      if reason:
                          held_minutes = (pd.Timestamp(dates[i]) - pd.Timestamp(position["entry_label"])).total_seconds() / 60.0
                          trades.append(_finalize_trade_short(
                              symbol, position["entry_price"], position["initial_stop"], position["qty"],
                              position["entry_label"], closes[i], dates[i], reason,
                              position["entry_cost"], held_minutes, cost_model,
                          ))
                          position = None

                  if position is None:
                      sig = m.gap_up_fade_entry_signal_short(sub_df)
                      if sig is not None:
                          entry_price = sig["entry_price"]
                          stop_loss = sig["stop_loss"]
                          stop_dist = stop_loss - entry_price
                          if stop_dist > 0:
                              usable_capital_inr = min(capital, capital / m.CAPITAL_TRANCHES)
                              risk_amount_inr = usable_capital_inr * risk_pct / 100
                              qty = min(risk_amount_inr / stop_dist, usable_capital_inr / entry_price)
                              qty = int(np.floor(qty))
                              if qty > 0 and qty * entry_price >= 100:
                                  position = {
                                      "entry_price": entry_price, "initial_stop": stop_loss,
                                      "entry_idx": i, "entry_label": dates[i], "qty": qty,
                                      "atr_at_entry": sig["atr_at_entry"], "running_min_close": entry_price,
                                      "entry_cost": _entry_cost(qty, entry_price, cost_model),
                                  }

              if position is not None:
                  held_minutes = (pd.Timestamp(dates[-1]) - pd.Timestamp(position["entry_label"])).total_seconds() / 60.0
                  trades.append(_finalize_trade_short(
                      symbol, position["entry_price"], position["initial_stop"], position["qty"],
                      position["entry_label"], closes[-1], dates[-1], "data_end_forced_close",
                      position["entry_cost"], held_minutes, cost_model,
                  ))
              return trades


          def _fetch_universe_batched(symbols, period, interval, chunk_size=100):
              """Bulk OHLC fetch via yfinance's own native multi-ticker
              batch/thread download - see power-play-validation-replay.yml's
              own copy of this function for the full reasoning. Smaller
              chunk_size than the 1d replays (100 vs 250) since intraday
              batch downloads are more prone to partial/rate-limited
              responses at very large batch sizes. Returns {symbol: DataFrame}."""
              out = {}
              for start in range(0, len(symbols), chunk_size):
                  chunk = symbols[start:start + chunk_size]
                  raw = yf.download(chunk, period=period, interval=interval, group_by="ticker",
                                     threads=True, progress=False, auto_adjust=False)
                  if raw.empty:
                      continue
                  if not isinstance(raw.columns, pd.MultiIndex):
                      sub = raw.dropna(subset=["Open", "High", "Low", "Close"])
                      if not sub.empty:
                          sub = sub.reset_index()
                          date_col = "Date" if "Date" in sub.columns else "Datetime"
                          out[chunk[0]] = sub.rename(columns={date_col: "Date"}).reset_index(drop=True)
                      continue
                  top_level = set(raw.columns.get_level_values(0))
                  for sym in chunk:
                      if sym not in top_level:
                          continue
                      sub = raw[sym].dropna(subset=["Open", "High", "Low", "Close"])
                      if sub.empty:
                          continue
                      sub = sub.reset_index()
                      date_col = "Date" if "Date" in sub.columns else "Datetime"
                      out[sym] = sub.rename(columns={date_col: "Date"}).reset_index(drop=True)
              return out


          SYMBOLS = sorted(set(m._load_nse_universe_from_file()))
          print(f"--- Fetching {len(SYMBOLS)} symbols ({INTERVAL}, {PERIOD}), batched+threaded ---")
          raw_by_symbol = {
              sym: df for sym, df in _fetch_universe_batched(SYMBOLS, PERIOD, INTERVAL).items()
              if len(df) >= 100
          }
          print(f"  fetched {len(raw_by_symbol)}/{len(SYMBOLS)} symbols\n")

          all_trades = []
          per_symbol_trade_count = {}
          for sym, raw in raw_by_symbol.items():
              cfg = m.NSE_STOCK_PARAM_OVERRIDES.get(sym, m.NSE_STOCK_DEFAULT_PARAMS)
              try:
                  trades = replay_symbol(sym, raw, cfg["risk_pct"], CAPITAL_INR, DEFAULT_COST_MODEL)
              except Exception as e:
                  print(f"ERROR {sym}: {e}")
                  continue
              if trades:
                  per_symbol_trade_count[sym] = len(trades)
              all_trades.extend(trades)
          print(f"  {len(all_trades)} total trades\n")


          def _metrics(trades):
              if not trades:
                  return dict(n=0, win_rate=0.0, pf_net=0.0, pf_gross=0.0, avg_net=0.0, avg_gross=0.0, avg_held_minutes=0.0)
              n = len(trades)
              wins = [t for t in trades if t["net_pnl"] > 0]
              losses = [t for t in trades if t["net_pnl"] <= 0]
              win_rate = 100 * len(wins) / n
              gw = sum(t["net_pnl"] for t in wins)
              gl = -sum(t["net_pnl"] for t in losses)
              pf_net = (gw / gl) if gl > 0 else float("inf")
              wins_g = [t for t in trades if t["gross_pnl"] > 0]
              losses_g = [t for t in trades if t["gross_pnl"] <= 0]
              gwg = sum(t["gross_pnl"] for t in wins_g)
              glg = -sum(t["gross_pnl"] for t in losses_g)
              pf_gross = (gwg / glg) if glg > 0 else float("inf")
              avg_net = sum(t["net_pnl"] for t in trades) / n
              avg_gross = sum(t["gross_pnl"] for t in trades) / n
              avg_held_minutes = sum(t["held_minutes"] for t in trades) / n
              return dict(n=n, win_rate=win_rate, pf_net=pf_net, pf_gross=pf_gross,
                          avg_net=avg_net, avg_gross=avg_gross, avg_held_minutes=avg_held_minutes)


          print("=== POOLED RESULT (real main.py functions, Gap-Up Fade short) ===")
          row = _metrics(all_trades)
          print(f"n_trades={row['n']} win_rate={row['win_rate']:.2f}% "
                f"pf_net={row['pf_net']:.3f} pf_gross={row['pf_gross']:.3f} "
                f"avg_net_inr={row['avg_net']:.2f} avg_held_minutes={row['avg_held_minutes']:.1f}")

          print("\n=== By exit_reason ===")
          by_reason = {}
          for t in all_trades:
              by_reason.setdefault(t["exit_reason"], []).append(t)
          for reason, ts in sorted(by_reason.items(), key=lambda kv: -len(kv[1])):
              m2 = _metrics(ts)
              print(f"{reason}: n={m2['n']} win_rate={m2['win_rate']:.2f}% pf_net={m2['pf_net']:.3f} avg_held_minutes={m2['avg_held_minutes']:.1f}")

          print("\n=== Top 15 symbols by trade count ===")
          for sym, cnt in sorted(per_symbol_trade_count.items(), key=lambda kv: -kv[1])[:15]:
              print(f"{sym}: {cnt} trades")
          PYEOF

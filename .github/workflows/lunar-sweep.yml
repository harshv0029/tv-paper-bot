name: Lunar sweep (B-112 full/new moon, both directions, ATR x hold x candle size)

# Research-only, read-only. Folk rule "buy full moon, sell new moon" (Murphy ch.14) tested as its own tags:
# lunar__{full,new,quarter(placebo)}__{long,short}__<tf>__atr<k>_hd<days>__v1. Moon phases are computed deterministically
# (Meeus ch.49) in scripts/lunar_sweep.py, no network. FULL NSE universe (main._load_nse_universe_from_file(), never
# main.NSE_FULL_UNIVERSE), BOTH directions as separate tags, ATR stop 1.5/2.5/4.0 on EVERY trade, holds 1/3/5/10 trading
# days, 0.8% round trip. Candle sizes 1d (5y), 4h (1h resampled, 730d), 1h (730d), 15m and 5m (60d).
# Jobs: 5 intervals x 4 shards = 20, + 1 merge = 21 (< 40). Dispatch order per CLAUDE.md: big matrix, only when no gate or
# safety run is queued. Pilot: maxsym=50 with intervals='["1d"]' (4 jobs + merge).
# Merge prints PFnet net/gross, win %, n, avg hold bars, exit reasons, distinct phase events per candle size (the honest
# sample size: every stock shares the same dates) and a derived pooled bidirectional `pair` row; full TSV in the log.
on:
  workflow_dispatch:
    inputs:
      intervals:
        description: 'JSON list of candle sizes (1d, 4h, 1h, 15m, 5m)'
        required: false
        default: '["1d","4h","1h","15m","5m"]'
      period:
        description: 'yfinance period override (blank = per-interval default: 1d 5y, 4h/1h 730d, 15m/5m 60d); use with ONE interval only'
        required: false
        default: ''
      maxsym:
        description: 'cap symbols for a pilot (0 = full universe)'
        required: false
        default: '0'
      pin_run_id:
        description: "B-841: run id of an earlier pin-aware run; reruns on EXACTLY its fetched symbol set (empty = unpinned)"
        required: false
        default: ""
      pin_artifact:
        description: "Merged-results artifact of pin_run_id (required with pin_run_id)"
        required: false
        default: "lunar-results"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        interval: ${{ fromJSON(inputs.intervals) }}
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: ./.github/actions/resolve-pin
        with:
          pin_run_id: ${{ inputs.pin_run_id }}
          pin_artifact: ${{ inputs.pin_artifact }}
          token: ${{ github.token }}
      - name: Run shard
        env:
          INTERVAL: ${{ matrix.interval }}
          PERIOD: ${{ inputs.period }}
          SHARD: ${{ matrix.shard }}
          NSHARDS: "4"
          MAXSYM: ${{ inputs.maxsym }}
          OUT_DIR: out
        run: |
          set -o pipefail
          python3 scripts/lunar_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: lunar-${{ matrix.interval }}-${{ matrix.shard }}
          path: out/lunar_*.json

  merge:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: lunar-*-*
          path: shards
          merge-multiple: true
      - name: Merge and print
        env:
          OUT: out/lunar_results.json
          TSV_OUT: out/lunar_cells.tsv
        run: |
          set -o pipefail
          python3 scripts/lunar_sweep.py --merge shards/lunar_*.json | tee out_table.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lunar-results
          path: |
            out/lunar_results.json
            out/lunar_cells.tsv
            out_table.txt

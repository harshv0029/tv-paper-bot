name: Table Git Sync

# B-1302 (user 2026-10-21): audit/log/counter tables are unloaded from Upstash and
# kept in git. Every 5 min the live server's /table-export/<name> is written to
# docs/tables/<name>.json; main.py restores an empty table from that file at startup.
# READ-ONLY toward Kotak. An empty server answer never blanks a non-empty git copy.
on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: table-git-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export git-tier tables
        run: |
          mkdir -p docs/tables
          curl -sS -m 60 "https://tv-paper-bot-gdan.onrender.com/health" || true
          echo
          for t in swing_scan_log signal_shadow_log strategy_scan_counts short_trades_closed strategy_viable_stack real_order_events fno_momo_scan_log; do
            if ! curl -sS --retry 4 --retry-delay 5 --retry-connrefused -m 45 \
                 "https://tv-paper-bot-gdan.onrender.com/table-export/$t" -o /tmp/$t.json \
               || ! jq -e '.rows' /tmp/$t.json > /dev/null; then
              echo "skip $t (fetch failed)"; continue
            fi
            f=docs/tables/$t.json
            if [ "$(jq '.rows|length' /tmp/$t.json)" = "0" ] && [ -f $f ] && [ "$(jq '.rows|length' $f)" != "0" ]; then
              echo "$t: server empty, keeping git copy"; continue
            fi
            if [ -f $f ] && [ "$(jq -S .rows /tmp/$t.json)" = "$(jq -S .rows $f)" ]; then
              echo "$t: no change"; continue
            fi
            jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{rows: .rows, synced_at_utc: $ts}' /tmp/$t.json > $f
          done
      - name: Archive View 6 paper trades (B-1719)
        run: |
          # Upstash stays the restore source; this is the permanent copy. Rows only grow, so a server answer
          # with fewer rows than git (a partial table after a restart) never replaces the archive.
          f=docs/tables/fno_momo_paper_trades.json
          if curl -sS --retry 4 --retry-delay 5 --retry-connrefused -m 45 \
               "https://tv-paper-bot-gdan.onrender.com/fno-momo-paper-export" -o /tmp/fmp.json \
             && jq -e '.rows' /tmp/fmp.json > /dev/null; then
            n=$(jq '.rows|length' /tmp/fmp.json); g=0
            [ -f $f ] && g=$(jq '.rows|length' $f)
            if [ "$n" -lt "$g" ]; then echo "paper trades: server $n < git $g, keeping git copy"
            elif [ -f $f ] && [ "$(jq -S .rows /tmp/fmp.json)" = "$(jq -S .rows $f)" ]; then echo "paper trades: no change"
            else jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{rows: .rows, synced_at_utc: $ts}' /tmp/fmp.json > $f; fi
          else echo "skip paper trades (fetch failed)"; fi
      - name: Commit if changed
        run: |
          git config user.name "tv-paper-bot journal sync"
          git config user.email "actions@users.noreply.github.com"
          git add docs/tables
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "Sync git-tier tables ($(date -u +%Y-%m-%dT%H:%M:%SZ)) [skip render]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi

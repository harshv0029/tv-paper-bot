name: Sweep-Engulf-Retracement v1 Backtest (research)

# Explicit user request 2026-09-21: adapted from a social-media strategy
# post (Instagram, @OmarAgag6) - 4H liquidity-sweep engulfing candle marks
# a buy zone (lower half of its range), drop to 15m, wait for a pullback
# into the zone then a break-of-structure entry, fixed 2:1 risk:reward.
# Stop-loss (sweep-zone low) and the structure-break definition (break of
# the local 15m swing high formed during the pullback) were both resolved
# via explicit user decision, not guessed - the source post gave neither.
#
# Genuinely multi-day/swing-capable per explicit user decision (unlike
# every other strategy in this repo) - this is signal/backtest-detection
# ONLY, no live order wiring, no CNC/delivery-margin handling. Same
# evidence discipline as every other strategy sweep in this repo: real
# market data, judged on pct_profitable_combos + median_total_pnl across a
# parameter grid, not one cherry-picked combo. Read-only, writes nothing,
# changes no live trading behavior.
#
# Grid: sweep_htf_minutes (120/240/360 = 2h/4h/6h) x sweep_rr_multiple
# (1.5/2.0/3.0) = 9 combos, against the same evidenced-symbol spread
# mtf-engulfing-backtest.yml/fvg-backtest.yml used (RELIANCE/TCS/TITAN/
# DIVISLAB + NIFTY/BANKNIFTY), 60d of real 15-minute data (yfinance's own
# intraday window - the LTF this strategy actually trades on). Imports
# main.py directly - calls its own add_strategy_signal/extract_trades_fast,
# not a reimplementation.
on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run sweep_engulf_retracement_v1 backtest grid
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          import main as m
          import numpy as np
          from itertools import product

          SYMBOLS = ["RELIANCE.NS", "TCS.NS", "TITAN.NS", "DIVISLAB.NS", "^NSEI", "^NSEBANK"]
          HTF_LIST = [120, 240, 360]
          RR_LIST = [1.5, 2.0, 3.0]
          COMBOS = [
              {"htf_minutes": h, "rr_multiple": r}
              for h, r in product(HTF_LIST, RR_LIST)
          ]

          rows = []
          for sym in SYMBOLS:
              try:
                  df = m.fetch_ohlc(sym, "60d", "15m")
              except Exception as e:
                  print(f"SKIP {sym}: fetch failed - {e}")
                  continue

              results = []
              for params in COMBOS:
                  sig_df = m.add_strategy_signal(df, "sweep_engulf_retracement_v1", params)
                  long_arr = sig_df["long"].to_numpy()
                  close_arr = sig_df["Close"].to_numpy(dtype=float)
                  dates = sig_df["Date"].apply(lambda d: d.isoformat()).to_numpy()
                  trades, _ = m.extract_trades_fast(long_arr, close_arr, dates, 1)
                  if not trades:
                      continue
                  wins = [t for t in trades if t["pnl"] > 0]
                  total_pnl = round(sum(t["pnl"] for t in trades), 2)
                  results.append({
                      "params": params, "num_trades": len(trades),
                      "win_rate_pct": round(100 * len(wins) / len(trades), 1),
                      "total_pnl": total_pnl,
                  })

              if not results:
                  print(f"{sym}: 0/{len(COMBOS)} sweep_engulf_retracement_v1 combos produced any trades - no signal at all")
                  continue

              all_pnls = [r["total_pnl"] for r in results]
              pct_profitable = round(100 * sum(1 for p in all_pnls if p > 0) / len(all_pnls), 1)
              median_pnl = round(float(np.median(all_pnls)), 2)
              best = max(results, key=lambda r: r["total_pnl"])
              rows.append({"symbol": sym, "pct_profitable_combos": pct_profitable,
                           "median_total_pnl": median_pnl, "num_combos_with_trades": len(results)})
              print(f"[sweep_engulf_retracement_v1] {sym}: {pct_profitable}% of {len(results)}/{len(COMBOS)} combos profitable, "
                    f"median {median_pnl}, best {best['params']} -> pnl {best['total_pnl']}, "
                    f"win_rate {best['win_rate_pct']}%, {best['num_trades']} trades")

          print()
          print("=== VERDICT (same bar as other strategy sweeps: >=75% combos profitable AND median > 0) ===")
          for r in sorted(rows, key=lambda r: r["pct_profitable_combos"], reverse=True):
              verdict = "CLEARS BAR" if r["pct_profitable_combos"] >= 75 and r["median_total_pnl"] > 0 else "does not clear"
              print(f"{r['symbol']}: {verdict} ({r['pct_profitable_combos']}% profitable, median {r['median_total_pnl']}, "
                    f"{r['num_combos_with_trades']} combos with trades)")
          if not rows:
              print("No symbol produced any trades at all across the full grid.")
          PYEOF
